<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3c5f12">
<title>Website</title>
<link rel="icon" href="moose-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --moose:#88B535; --moose-soft:#eef5e0; --moose-ink:#2f4710; --forest:#3c5f12; --forest-2:#5b8a1e;
  --ground:#f5f7f0; --card:#ffffff; --ink:#15201a; --ink-2:#3d4a42; --muted:#6b776f; --line:#e1e7de; --line-2:#cfd8cb;
  --red:#c8382b; --red-soft:#fbe7e4; --amber:#b5770a; --amber-soft:#fbf0d9; --blue:#2463a0; --blue-soft:#e3edf8;
  --radius:16px; --shadow:0 1px 2px rgba(20,40,25,.06), 0 4px 14px rgba(20,40,25,.06);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--ground);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d; --shadow:0 1px 2px rgba(0,0,0,.3); } }
:root[data-theme="dark"]{
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d; --shadow:0 1px 2px rgba(0,0,0,.3); }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding:16px 16px 40px}
.hero{background:linear-gradient(135deg,var(--forest),var(--forest-2));color:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.hero h1{font-size:22px;margin:0 0 2px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;font-size:13.5px;opacity:.9}
.muted{color:var(--muted);font-size:13px}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:999px;min-height:34px;padding:0 12px;
  font:inherit;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.on{background:var(--forest-2);border-color:var(--forest-2);color:#fff}
.btn.sm{min-height:28px;padding:0 9px;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bar input,.bar select{font:inherit;font-size:13.5px;border:1px solid var(--line-2);border-radius:10px;padding:5px 9px;background:var(--card);color:var(--ink);min-height:34px}
.bar input[type=search]{flex:1;min-width:180px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.tile b{display:block;font-size:24px;font-weight:800;line-height:1.2}
.tile span{font-size:12.5px;color:var(--muted);font-weight:700}
.tile.on{outline:2px solid var(--forest-2)}
.tile.warn b{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.n,td.n{text-align:right}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.go{cursor:pointer} tr.go:hover td{background:var(--moose-soft)}
.mbar{height:6px;border-radius:3px;background:var(--moose);min-width:2px;margin-top:3px}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--ink-2);white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
.days{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:8px}
.days div{flex:1;background:var(--moose);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.dlab{display:flex;gap:3px;font-size:10.5px;color:var(--muted)} .dlab span{flex:1;text-align:center;overflow:hidden}
.empty{padding:20px;text-align:center;color:var(--muted)}
.step{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.step time{color:var(--muted);font-size:12.5px}
body.inhub .wrap{padding-top:10px}
@media (max-width:640px){ .step{grid-template-columns:1fr} th,td{padding:5px 6px} }
</style>
<!-- Reports & Analytics > Website (2026-11-24, Brandon: "lets do it"). Our own Google Analytics (G-G6MQNPW0SV, property 565729348) read
     through Edge Function ga4-report (read-only service account; hub_can('analytics')). Nothing is saved; every load asks Google. -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>Website</h1>
    <p>Visitors on vacationrentalsparkcity.com from our own Google Analytics: where they come from, what they read, which homes they look at.</p></div>
  <div class="bar" id="range"></div>
  <div class="tiles" id="tiles"></div>
  <div id="out"><div class="card empty">Loading…</div></div>
</div>
<script>
(function(){
if(window.top !== window) document.body.classList.add("inhub");
const CFG = window.MM_CONFIG || {}, sb = supabase.createClient(CFG.url, CFG.anonKey);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const num = n => Math.round(n || 0).toLocaleString();
const pct = n => Math.round((n || 0) * 100) + "%";
const mins = s => { s = Math.round(s || 0); return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s"; };
const iso = d => d.toISOString().slice(0, 10);
const R = { days: 28 };
const SITE = "https://www.vacationrentalsparkcity.com";

function rangeBar(){
  $("#range").innerHTML = [[7, "Last 7 days"], [28, "Last 28 days"], [90, "Last 90 days"]].map(([n, l]) =>
    `<button class="btn${R.days === n ? " on" : ""}" data-d="${n}">${l}</button>`).join("") + `<span class="muted" id="live"></span>`;
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { R.days = +b.dataset.d; rangeBar(); load(); });
}
function table(rows, cols){
  if(!rows.length) return `<div class="empty">Nothing yet for these dates.</div>`;
  const mx = Math.max(...rows.map(r => r[cols[1].k] || 0), 1);
  return `<div class="tw"><table><tr>${cols.map(c => `<th class="${c.n ? "n" : ""}">${c.t}</th>`).join("")}</tr>` + rows.map(r => `<tr>${cols.map((c, i) =>
    `<td class="${c.n ? "n" : ""}">${c.f ? c.f(r) : esc(r[c.k])}${i === 1 ? `<div class="mbar" style="width:${Math.max(2, (r[c.k] || 0) / mx * 100)}%"></div>` : ""}</td>`).join("")}</tr>`).join("") + `</table></div>`;
}
const homeName = p => { const m = String(p || "").match(/\/booking-engine\/unit\/([^/?#]+)/); return m ? m[1].replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase()) : p; };

async function load(){
  $("#out").innerHTML = `<div class="card empty">Loading…</div>`;
  const to = new Date(), from = new Date(Date.now() - (R.days - 1) * 864e5);
  const r = await sb.functions.invoke("ga4-report", { body: { from: iso(from), to: iso(to) } });
  if(r.error || !r.data || !r.data.ok){
    $("#out").innerHTML = `<div class="card empty">Couldn't load the website numbers${r.data && r.data.error ? ": " + esc(r.data.error) : ""}. Try again in a minute.</div>`; return; }
  const d = r.data, t = d.totals || {};
  $("#live").textContent = `· ${num(d.now)} on the website right now`;
  $("#tiles").innerHTML = [["Visitors", num(t.activeUsers)], ["New visitors", num(t.newUsers)], ["Visits", num(t.sessions)], ["Pages viewed", num(t.screenPageViews)],
    ["Engaged visits", t.sessions ? pct(t.engagementRate) : "—"], ["Avg time per visit", t.sessions ? mins(t.averageSessionDuration) : "—"]]
    .map(([l, v]) => `<div class="tile" style="cursor:default"><b>${v}</b><span>${l}</span></div>`).join("");
  const days = d.days || [], mx = Math.max(...days.map(x => x.activeUsers), 1);
  const dayLab = s => s.slice(4, 6) + "/" + s.slice(6, 8);
  const empty = !days.length && !(t.sessions);
  $("#out").innerHTML = (empty ? `<div class="card"><h3>Reports fill in within about a day</h3><div class="muted">Our Google Analytics went live on the website on Nov 24, 2026, and Google needs up to a day to process each day's visits. ${num(d.now)} ${d.now === 1 ? "person is" : "people are"} on the website right now.</div></div>` : "") +
    `<div class="card"><h3>Visitors by day</h3><div class="days">${days.map(x => `<div title="${dayLab(x.date)}: ${num(x.activeUsers)} visitors, ${num(x.sessions)} visits" style="height:${x.activeUsers / mx * 100}%"></div>`).join("")}</div>
      <div class="dlab">${days.map((x, i) => `<span>${i % Math.ceil(days.length / 10 || 1) === 0 ? dayLab(x.date) : ""}</span>`).join("")}</div></div>` +
    `<div class="card"><h3>Where visitors come from</h3><div class="muted">Source / medium. Guest emails, owner postcards and Ask Patrick links carry their own tags, so they show here by name.</div>${table(d.sources || [], [
      { k:"sessionSourceMedium", t:"Source / medium" }, { k:"sessions", t:"Visits", n:1, f:x => num(x.sessions) }, { k:"activeUsers", t:"Visitors", n:1, f:x => num(x.activeUsers) }, { k:"engagementRate", t:"Engaged", n:1, f:x => pct(x.engagementRate) }])}</div>` +
    `<div class="card"><h3>Homes people looked at</h3><div class="muted">Each home's page on our booking engine. A home many people look at but few book is a pricing or listing question.</div>${table(d.homes || [], [
      { k:"pagePath", t:"Home", f:x => `<a href="${SITE}${esc(x.pagePath)}" target="_blank" rel="noopener">${esc(homeName(x.pagePath))}</a>` }, { k:"screenPageViews", t:"Views", n:1, f:x => num(x.screenPageViews) }, { k:"activeUsers", t:"Visitors", n:1, f:x => num(x.activeUsers) }])}</div>` +
    `<div class="card" id="phcard"></div>` +
    `<div class="card"><h3>Top pages</h3>${table(d.pages || [], [
      { k:"pageTitle", t:"Page", f:x => `<a href="${SITE}${esc(x.pagePath)}" target="_blank" rel="noopener">${esc(x.pageTitle || x.pagePath)}</a>` }, { k:"screenPageViews", t:"Views", n:1, f:x => num(x.screenPageViews) }, { k:"activeUsers", t:"Visitors", n:1, f:x => num(x.activeUsers) }])}</div>` +
    `<div class="card"><h3>Where visitors are</h3>${table(d.places || [], [
      { k:"region", t:"State / region", f:x => esc(x.region || "(unknown)") + (x.country && x.country !== "United States" ? ` <span class="muted">${esc(x.country)}</span>` : "") }, { k:"activeUsers", t:"Visitors", n:1, f:x => num(x.activeUsers) }])}</div>` +
    `<div class="card"><h3>Devices</h3>${table(d.devices || [], [{ k:"deviceCategory", t:"Device" }, { k:"activeUsers", t:"Visitors", n:1, f:x => num(x.activeUsers) }])}</div>` +
    `<div class="card"><h3>What visitors did</h3><div class="muted">Events Google records on the site, including Ask Patrick's chat events.</div>${table(d.events || [], [{ k:"eventName", t:"Event" }, { k:"eventCount", t:"Times", n:1, f:x => num(x.eventCount) }])}</div>` +
    `<p class="muted">${esc(d.source)}</p>`;
  R.photos = d.photos; photos();
}

// Photos guests look at most (website_photo_tracker.js on the website, live 2026-11-24). "Looks" = opened full screen,
// tapped in the gallery, or tapped on the home page; "in list" = stayed on screen 1.5 s in the gallery list (weaker sign).
const PIMG = id => `https://img.trackhs.com/320x/https://track-pm.s3.amazonaws.com/moosemanagement/image/${id}`;
const PFULL = id => `https://img.trackhs.com/1080x/https://track-pm.s3.amazonaws.com/moosemanagement/image/${id}`;
function photos(){
  const box = $("#phcard"); if(!box) return;
  const p = R.photos;
  const head = `<h3>Photos guests look at most</h3><div class="muted">From the photo tracker on each home's page (live since Nov 24, 2026). Looks = opened full screen or tapped. Pick the most-looked photos for ads and the Dropbox folder.</div>`;
  if(!Array.isArray(p)){ box.innerHTML = head + `<div class="empty">Photo numbers aren't ready yet${p && p.error ? " (" + esc(p.error) + ")" : ""}. Google can take up to a day after the photo fields were added.</div>`; return; }
  const by = {};
  for(const r of p){
    const home = r["customEvent:home"], id = r["customEvent:photo_id"], how = r["customEvent:how"];
    if(!home || !id || home === "(not set)" || id === "(not set)") continue;
    const k = home + "|" + id, o = by[k] || (by[k] = { home, id, num: 0, full: 0, tap: 0, page: 0, list: 0 });
    const n = parseInt(r["customEvent:photo_num"], 10); if(n && (!o.num || n < o.num)) o.num = n;
    if(o[how] !== undefined) o[how] += r.eventCount || 0;
  }
  const all = Object.values(by).map(o => (o.looks = o.full + o.tap + o.page, o));
  if(!all.length){ box.innerHTML = head + `<div class="empty">No photo views yet for these dates.</div>`; return; }
  const homes = [...new Set(all.map(o => o.home))].map(h => ({ h, n: all.filter(o => o.home === h).reduce((s, o) => s + o.looks, 0) })).sort((a, b) => b.n - a.n);
  if(R.ph && !homes.some(x => x.h === R.ph)) R.ph = "";
  const list = all.filter(o => !R.ph || o.home === R.ph).sort((a, b) => b.looks - a.looks || b.list - a.list).slice(0, R.ph ? 60 : 24);
  box.innerHTML = head +
    `<div class="bar"><select id="phhome"><option value="">All homes (top 24 photos)</option>${homes.map(x => `<option value="${esc(x.h)}"${R.ph === x.h ? " selected" : ""}>${esc(homeName("/booking-engine/unit/" + x.h + "/"))} · ${num(x.n)} looks</option>`).join("")}</select>
      <button class="btn sm" id="phcsv">Download CSV</button></div>` +
    `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px">${list.map((o, i) => `<a href="${PFULL(o.id)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)">
      <img src="${PIMG(o.id)}" alt="" loading="lazy" style="display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--line)">
      <div style="padding:6px 8px;font-size:12.5px"><b>#${i + 1}</b> · ${num(o.looks)} looks${o.list ? ` · ${num(o.list)} in list` : ""}
      <div class="muted" style="font-size:11.5px">${R.ph ? "" : esc(homeName("/booking-engine/unit/" + o.home + "/")) + " · "}${o.num ? "photo " + o.num : ""} · ${num(o.full)} full screen</div></div></a>`).join("")}</div>`;
  $("#phhome").onchange = e => { R.ph = e.target.value; photos(); };
  $("#phcsv").onclick = () => {
    const rows = [["home", "photo_number", "looks", "full_screen", "tapped_in_gallery", "tapped_on_page", "seen_in_list", "photo_link"]]
      .concat(all.sort((a, b) => a.home.localeCompare(b.home) || b.looks - a.looks).map(o => [o.home, o.num || "", o.looks, o.full, o.tap, o.page, o.list, PFULL(o.id)]));
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map(r => r.join(",")).join("\n")], { type: "text/csv" }));
    a.download = "website_photo_looks.csv"; a.click();
  };
}

(async () => {
  const s = await sb.auth.getSession();
  if(!s.data || !s.data.session){ location.replace("hub.html"); return; }
  const ok = await sb.rpc("hub_can", { p_desk:"analytics" });
  if(ok.error){ $("#out").innerHTML = `<div class="card empty">Couldn't load. Check your signal and try again.</div>`; return; }
  if(!ok.data){ (window.top !== window ? window.top : window).location.replace("hub.html#/home"); return; }
  rangeBar(); load();
})();
})();
</script>
</body>
</html>
