<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3c5f12">
<title>Competitor Playbook</title>
<link rel="icon" href="moose-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Competitor Playbook desk (hub keys 'competitor' + 'competitor_add'). Ported from the "Moose Competitor Playbook" artifact;
     content now lives in the cmp_* tables (cmp_schema.sql). Access is enforced in Supabase - this page only hides what RLS already refuses. -->
<style>
:root{
  --moose:#88B535; --moose-2:#A6CE39; --moose-ink:#2f4710; --moose-soft:#eef5e0;
  --forest:#3c5f12; --forest-2:#5b8a1e; --pine:#4f7a18; --pine-soft:#eaf3da;
  --ground:#f5f7f0; --card:#ffffff; --ink:#15201a; --ink-2:#3d4a42; --muted:#6b776f; --line:#e1e7de; --line-2:#cfd8cb;
  --red:#c8382b; --red-soft:#fbe7e4; --red-ink:#7a271b; --amber:#b5770a; --amber-soft:#fbf0d9; --blue:#2463a0; --blue-soft:#e3edf8; --blue-ink:#274b5e;
  --gold:#a5741f; --gold-soft:#fbf3e4; --gold-line:#ecd9b6; --green:#3a7d44; --green-soft:#e6f1ea; --green-ink:#2f5d40;
  --radius:16px; --tap:48px; --shadow:0 1px 2px rgba(20,40,25,.06), 0 4px 14px rgba(20,40,25,.06);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--ground);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --pine-soft:#173026; --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --red-ink:#f3c3bc; --amber-soft:#33270c;
  --blue-soft:#13283d; --blue-ink:#bcd6e6; --gold:#e0b25f; --gold-soft:#2e2412; --gold-line:#4a3a1a; --green-soft:#16301f; --green-ink:#b9dcc4;
  --shadow:0 1px 2px rgba(0,0,0,.3); } }
:root[data-theme="dark"]{
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --pine-soft:#173026; --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --red-ink:#f3c3bc; --amber-soft:#33270c;
  --blue-soft:#13283d; --blue-ink:#bcd6e6; --gold:#e0b25f; --gold-soft:#2e2412; --gold-line:#4a3a1a; --green-soft:#16301f; --green-ink:#b9dcc4;
  --shadow:0 1px 2px rgba(0,0,0,.3); }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:var(--pine)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:12px;min-height:44px;padding:0 15px;
  font:inherit;font-weight:800;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn:active{transform:scale(.98)} .btn.primary{background:var(--forest-2);border-color:var(--forest-2);color:#fff}
.btn.small{min-height:34px;font-size:13px;padding:0 11px;border-radius:10px} .btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink-2);white-space:nowrap}
.pill.green{background:var(--moose-soft);color:var(--moose-ink)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.red{background:var(--red-soft);color:var(--red)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
label.f{display:block;margin:12px 0} label.f>span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:800}
label.f small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;font-weight:600}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:var(--tap);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical} textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--moose-soft);border-color:var(--moose)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:640px){ .row2{grid-template-columns:1fr} }

/* masthead + tabs */
header.mast{background:linear-gradient(160deg,#2e4a0e,var(--forest) 60%,var(--forest-2));color:#fff;padding:22px 0 18px;border-bottom:4px solid var(--gold)}
header.mast h1{font-size:26px;line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
header.mast p{margin:0;max-width:68ch;opacity:.93;font-size:15px}
.metabar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
.metabar span{background:rgba(255,255,255,.13);padding:4px 11px;border-radius:999px}
.metabar .conf{border:1px solid rgba(224,178,95,.7);background:rgba(224,178,95,.2)}
nav.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{display:inline-flex;align-items:center;gap:6px;padding:12px 12px;font-weight:800;font-size:14px;color:var(--ink-2);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--moose)}
nav.tabs .n{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.controls{position:sticky;top:47px;z-index:20;background:color-mix(in srgb,var(--ground) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 0}
.controls .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:34px}
.chip.on{background:var(--forest);color:#fff;border-color:var(--forest)}
#q{flex:1;min-width:180px;max-width:300px;margin-left:auto;min-height:38px;border-radius:999px;padding:6px 15px;font-size:15px}
@media (max-width:640px){ #q{margin-left:0;max-width:none} header.mast h1{font-size:22px} }

/* sections */
section.s{padding:26px 0 6px}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;font-weight:800;color:var(--gold);margin:0 0 4px}
h2.sec{font-size:21px;margin:0 0 6px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.sec-note{color:var(--muted);font-size:14.5px;max-width:70ch;margin:0 0 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:12px}
.box table{width:100%;border-collapse:collapse;font-size:14px}
.box th,.box td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.box th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.box tr:last-child td{background:var(--moose-soft)}
.box h5{margin:14px 0 6px;font-size:15px;color:var(--forest-2)} .box h5:first-child{margin-top:0}
.box ul,.box ol{padding-left:20px} .box li{margin-bottom:4px}
.argument{background:linear-gradient(160deg,#2e4a0e,var(--forest-2));color:#fff;border-radius:18px;padding:24px 26px;box-shadow:var(--shadow)}
.argument .kicker{color:#ffd98a}
.argument blockquote{font-size:19px;line-height:1.5;font-weight:600;margin:6px 0 0;border-left:4px solid var(--gold);padding-left:16px}
.rulecard{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:14px;padding:16px 20px;font-size:14.5px}
.rulecard strong{color:var(--gold)}
.edit-sec{float:right}

/* competitor cards (same anatomy as the artifact) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;border-top:4px solid var(--muted);min-width:0;scroll-margin-top:160px}
.cc[data-tier="local"]{border-top-color:var(--forest-2)} .cc[data-tier="national"]{border-top-color:#4a6fa5} .cc[data-tier="half"]{border-top-color:var(--amber)}
.cc[data-tier="boutique"]{border-top-color:var(--gold)} .cc[data-tier="resort"]{border-top-color:#6d8a96} .cc[data-tier="heber"]{border-top-color:#7d9b6a}
.cc.hit{outline:3px solid var(--moose)}
.cc h3{margin:0;font-size:18px;line-height:1.2;font-weight:800}
.cc .who{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.cc .who a{color:var(--pine)}
.flagbadge{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--red);padding:3px 7px;border-radius:6px;vertical-align:middle}
.flagbadge.opp{background:var(--green)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.tag{font-size:12px;background:var(--ground);border:1px solid var(--line);color:var(--muted);padding:3px 8px;border-radius:6px;font-weight:600}
.tag.comm{background:var(--green-soft);border-color:#cfe3d6;color:var(--green-ink);font-weight:800}
.tag.pms{background:#ece7f6;border-color:#cdc0ea;color:#5a4a8a;font-weight:800}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.pms{background:#241d38;border-color:#3b3060;color:#cdbff0} :root:not([data-theme="light"]) .tag.comm{border-color:#24412d} }
.bx{border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.bx .lbl,.fld .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;margin-bottom:3px}
.bx p{margin:0 0 6px} .bx p:last-child{margin-bottom:0} .bx ul,.fld ul,.bx ol{margin:4px 0 0;padding-left:18px} .bx li,.fld li{margin-bottom:3px}
.bx.flag{background:var(--red-soft);border:1px solid #e6b4ab;color:var(--red-ink)} .bx.flag .lbl{color:var(--red)}
.bx.opp{background:var(--green-soft);border:1px solid #bcd9c6;color:var(--green-ink)} .bx.opp .lbl{color:var(--green)}
.bx.intel{background:var(--blue-soft);border:1px solid #bcd6e6;color:var(--blue-ink)} .bx.intel .lbl{color:var(--blue)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bx.flag,:root:not([data-theme="light"]) .bx.opp,:root:not([data-theme="light"]) .bx.intel{border-color:var(--line-2)} }
.fld{margin-top:12px;font-size:14.5px} .fld .lbl{color:var(--gold)} .fld p{margin:0 0 6px}
.bx.win{background:var(--moose-soft);color:var(--ink)} .bx.win .lbl{color:var(--moose-ink)}
.bx.ask{background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--ink)} .bx.ask .lbl{color:var(--gold)}
.bx.ask ol{padding-left:20px}
.src{font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:12px}
.src>div{border-top:1px dashed var(--line-2);padding-top:9px;margin-top:12px}
.cfoot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.noresult{text-align:center;color:var(--muted);padding:30px;font-style:italic}

/* lists (intel, threads, log, reports) */
.page{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.page h2{font-size:22px;margin:4px 0 4px;font-weight:800;letter-spacing:-.02em}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.item .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .hd b{font-size:15.5px}
.item .what{white-space:pre-wrap;margin:8px 0 6px;font-size:14.5px;overflow-wrap:anywhere}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;margin-top:6px}
.meta dt{color:var(--muted);font-weight:700} .meta dd{margin:0;overflow-wrap:anywhere}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sure{display:flex;gap:8px;flex-wrap:wrap}
.sure label{flex:1;min-width:150px;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--card)}
.sure label:has(input:checked){border-color:var(--moose);background:var(--moose-soft)}
.sure input{width:auto;min-height:0;margin:0 6px 0 0;vertical-align:-2px}
.sure b{font-size:14.5px} .sure small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:16px;text-align:center;background:var(--card);cursor:pointer}
.drop.over{border-color:var(--moose);background:var(--moose-soft)}
.flist{list-style:none;padding:0;margin:8px 0 0} .flist li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.flist li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.more{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
details.more>summary{cursor:pointer;font-weight:800;font-size:14.5px;min-height:36px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.msg{padding:10px 12px;border-radius:12px;margin:10px 0;font-size:14.5px;font-weight:600}
.msg.ok{background:var(--moose-soft);color:var(--moose-ink)} .msg.err{background:var(--red-soft);color:var(--red)}
table.rep{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.rep th,table.rep td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.rep th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--ground)}
.scroll{overflow-x:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}

/* editor dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(860px,calc(100vw - 20px));max-height:calc(100dvh - 30px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,14,.5)}
dialog .dh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:center;z-index:2}
dialog .dh b{flex:1;font-size:17px}
dialog .db{padding:6px 18px 10px}
dialog .df{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--ground)}
.sub .hd{display:flex;gap:8px;align-items:center}
.center{max-width:520px;margin:12vh auto;padding:0 16px;text-align:center}
</style>
</head>
<body>
<div id="app"><div class="center"><p class="muted">Loading…</p></div></div>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const C = window.MM_CONFIG;
const sb = supabase.createClient(C.url, C.anonKey, { auth:{ persistSession:true, detectSessionInUrl:true, flowType:"implicit" } });
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fmtD = d => d ? new Date(String(d).length === 10 ? d + "T12:00:00" : d).toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }) : "";
const fmtDT = d => d ? new Date(d).toLocaleString("en-US", { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" }) : "";
const errText = e => { const m = (e && (e.message || e.error_description)) || String(e);
  return /row-level security|permission denied/i.test(m) ? "Your login can't change this." : m.replace(/^.*?ERROR:\s*/, ""); };

const TIERS = [["local","Local — deep-profiled"],["boutique","Luxury & boutique"],["resort","Resort programs"],["heber","Heber Valley"],
               ["national","National"],["half","Half-service"],["budget","Budget / AI"]];
const TIER = Object.fromEntries(TIERS);
const STATUS = { active:"Active", historical:"Historical", not_str:"Not an STR manager", watch:"Watch" };
// how we got it (cmp_captures.channel) - order = how often front desk sees them
const CHANNELS = [["mailer","Mailer / letter"],["email","Email"],["owner","Owner told us"],["realtor","Realtor told us"],["call","Phone call"],["text","Text message"],
  ["in_person","In person"],["rumor","Rumor / word of mouth"],["web","Their website"],["social","Social media"],["ad","Ad (Google, print, sign)"],
  ["review","Online review"],["event","Event / conference"],["other","Other"]];
const CHANNEL = Object.fromEntries(CHANNELS);
const SURE = [["confirmed","Confirmed","We saw it: a mailer, email, page or their own words"],
              ["likely","Likely","From someone we trust, not seen ourselves"],
              ["rumor","Rumor","Heard around; not checked"]];
const SURE_PILL = { confirmed:"green", likely:"blue", rumor:"amber" };
const CSTATUS = { new:["New","red"], reviewed:["Reviewed","blue"], filed:["Filed on a card","green"], set_aside:["Set aside",""] };
const FILE_TYPES = { jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", webp:"image/webp", heic:"image/heic", gif:"image/gif", pdf:"application/pdf",
  eml:"message/rfc822", msg:"application/vnd.ms-outlook", txt:"text/plain" };
const MAX_FILE = 15 * 1024 * 1024;

/* ---------- card HTML: a small allow-list, everything else is dropped (cards are typed by editors, rendered for everyone) ---------- */
const OK_TAGS = new Set(["P","B","STRONG","EM","I","U","UL","OL","LI","BR","A","CODE","TABLE","THEAD","TBODY","TR","TH","TD","H5","BLOCKQUOTE","SPAN","SMALL","SUP"]);
function clean(html){
  if(!html) return "";
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html"), root = doc.body.firstChild;
  (function walk(el){
    [...el.childNodes].forEach(n => {
      if(n.nodeType === 3) return;
      if(n.nodeType !== 1 || !OK_TAGS.has(n.tagName)){ if(n.nodeType === 1 && !/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED)$/.test(n.tagName)){ walk(n); n.replaceWith(...n.childNodes); } else n.remove(); return; }
      const href = n.tagName === "A" ? n.getAttribute("href") : null;
      [...n.attributes].forEach(a => n.removeAttribute(a.name));
      if(href && /^(https?:|mailto:)/i.test(href.trim())){ n.setAttribute("href", href.trim()); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener"); }
      walk(n);
    });
  })(root);
  return root.innerHTML;
}

/* ---------- state ---------- */
const S = { me:null, uid:null, companies:[], cards:{}, content:[], threads:[], due:{}, newCount:0, loaded:false, tier:"all", q:"" };
const byId = id => S.companies.find(c => c.id === id);

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("#app").innerHTML = `<div class="center"><h2>Please sign in</h2><p class="muted">Open the Competitor Playbook from the Moose Hub.</p>
      <a class="btn primary" href="hub.html#/competitor" target="_top">Go to the Moose Hub</a></div>`; return; }
  const r = await sb.rpc("cmp_me");
  S.me = r.data || {};
  if(r.error || (!S.me.read && !S.me.add)){ $("#app").innerHTML = `<div class="center"><h2>No access</h2><p class="muted">This desk isn't on your teams. Ask Brandon or Kim.</p></div>`; return; }
  window.addEventListener("hashchange", route);
  route();
}

async function loadPlaybook(force){
  if(S.loaded && !force) return;
  const [co, ca, ct, th, du] = await Promise.all([
    sb.from("cmp_companies").select("*").order("sort").order("name"),
    sb.from("cmp_cards").select("*"),
    sb.from("cmp_content").select("*").order("sort"),
    sb.from("cmp_threads").select("*").order("id"),
    sb.from("cmp_due").select("id,why,days_since")]);
  const bad = [co, ca, ct, th, du].find(x => x.error); if(bad) throw bad.error;
  S.companies = co.data; S.cards = Object.fromEntries(ca.data.map(c => [c.company_id, c]));
  S.content = ct.data; S.threads = th.data; S.due = Object.fromEntries(du.data.map(d => [d.id, d]));
  S.loaded = true;
}
async function countNew(){
  if(!S.me.edit) return;
  const r = await sb.from("cmp_captures").select("id", { count:"exact", head:true }).eq("status", "new");
  S.newCount = r.count || 0;
}

function tabs(on){
  const t = [];
  if(S.me.read) t.push(["", "Playbook"]);
  t.push(["add", "Add what you heard"]);
  if(S.me.edit) t.push(["review", "Review intel" + (S.newCount ? ` <span class="n">${S.newCount}</span>` : "")]);
  else t.push(["mine", "What I've sent"]);
  if(S.me.read) t.push(["threads", "Open threads"], ["log", "Crew log"], ["reports", "Reports"]);
  return `<nav class="tabs"><div class="wrap">${t.map(([k, l]) => `<a href="#/${k}" class="${k === on ? "on" : ""}">${l}</a>`).join("")}</div></nav>`;
}
async function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const parts = h.replace(/^\//, "").split("/"), k = h.startsWith("/") || !h ? parts[0] : "";
  const jump = !h.startsWith("/") && h ? h : "";
  try {
    if(!S.me.read && !["add", "mine"].includes(k)){ location.replace("#/add"); return; }
    await countNew();
    if(k === "add") return addView(parts[1] || "");
    if(k === "mine") return mineView();
    if(k === "review" && S.me.edit) return reviewView(parts[1] || "open");
    if(k === "threads") return threadsView();
    if(k === "log") return logView();
    if(k === "reports") return reportsView();
    if(k === "report") return reportView(parts[1]);
    return playbookView(jump);
  } catch(e){ console.error(e); $("#app").innerHTML = tabs("") + `<div class="page"><div class="msg err">Couldn't load: ${esc(errText(e))}</div></div>`; }
}

function fileType(f){ const ext = (f.name.split(".").pop() || "").toLowerCase(); return FILE_TYPES[ext] || (Object.values(FILE_TYPES).includes(f.type) ? f.type : ""); }
function addFiles(fl){
  const bad = [];
  [...fl].forEach(f => { if(!fileType(f)) bad.push(`${f.name}: not a photo, PDF or email file`); else if(f.size > MAX_FILE) bad.push(`${f.name}: over 15 MB`); else pending.push(f); });

  $$("[data-rm]").forEach(b => b.onclick = () => { pending.splice(+b.dataset.rm, 1); addFiles([]); });
  $("#addmsg").innerHTML = bad.length ? `<div class="msg err">${bad.map(esc).join("<br>")}</div>` : "";
}
async function submitCapture(f){
  const v = n => (f[n] && f[n].value || "").trim();
  const company = f.company && f.company.value !== "__new" ? v("company") : "", ctext = v("company_text");
  if(v("what").length < 3){ $("#addmsg").innerHTML = `<div class="msg err">Add a few words about what you heard.</div>`; f.what.focus(); return; }
  if(v("heard_on") > today()){ $("#addmsg").innerHTML = `<div class="msg err">The date can't be in the future.</div>`; return; }
  const btn = f.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Sending…";
  try {
    // skipped fields: company -> "Not sure" (owner relations links it in review), channel -> other, date -> today
    const r = await sb.rpc("cmp_capture_add", { p_company: company || null, p_company_text: company ? null : ctext || "Not sure", p_channel: v("channel") || "other", p_heard_on: v("heard_on") || today(),
      p_what: v("what"), p_where: v("where") || null, p_source_person: v("source_person") || null,
      p_confidence: (f.querySelector("input[name=confidence]:checked") || {}).value || "likely", p_freshdesk: v("freshdesk") || null });
    if(r.error) throw r.error;
    const id = r.data, failed = await uploadFiles(id, pending);
    $("#app").innerHTML = tabs("add") + `<div class="page"><div class="item">
      <h2>Thanks — sent</h2><p>Entry #${esc(id)} is with owner relations for review.${pending.length ? ` ${pending.length - failed.length} of ${pending.length} file${pending.length === 1 ? "" : "s"} attached.` : ""}</p>
      ${failed.length ? `<div class="msg err">These files didn't attach: ${failed.map(esc).join(", ")}. Open <a href="#/${S.me.edit ? "review/all" : "mine"}">your entry</a> to try again.</div>` : ""}
      <div class="acts"><a class="btn primary" href="#/add">Add another</a><a class="btn" href="#/${S.me.edit ? "review" : "mine"}">${S.me.edit ? "Review intel" : "What I've sent"}</a></div></div></div>`;
  } catch(e){ $("#addmsg").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; btn.disabled = false; btn.textContent = "Send it in"; }
}
async function myUid(captureId){   // storage folders are named by the hub user id (allowed_users.id), which RLS shows on your own entries
  if(S.uid) return S.uid;
  const r = await sb.from("cmp_captures").select("added_by").eq("id", captureId).maybeSingle();
  return S.uid = r.data && r.data.added_by;
}
async function uploadFiles(captureId, files){
  const failed = []; if(!files.length) return failed;
  const uid = await myUid(captureId); if(!uid) return files.map(f => f.name);
  for(const f of files){
    try {
      const path = `${uid}/${captureId}/${Date.now()}-${f.name.replace(/[^A-Za-z0-9._-]+/g, "_").slice(-120)}`;
      const up = await sb.storage.from("cmp-files").upload(path, f, { contentType: fileType(f), upsert:false });
      if(up.error) throw up.error;
      const r = await sb.rpc("cmp_capture_file_add", { p_capture: captureId, p_path: path, p_name: f.name, p_type: fileType(f) });
      if(r.error) throw r.error;
    } catch(e){ console.error(e); failed.push(f.name); }
  }
  return failed;
}
async function openFile(path){
  const r = await sb.storage.from("cmp-files").createSignedUrl(path, 120);
  if(r.error){ alert(errText(r.error)); return; }
  window.open(r.data.signedUrl, "_blank", "noopener");
}

    $$("#intelEd [data-up]").forEach(b => b.onclick = () => { const i = +b.dataset.up; [intel[i - 1], intel[i]] = [intel[i], intel[i - 1]]; drawIntel(); }); };
  const drawAsk = () => { $("#askEd").innerHTML = ask.map((a, i) => `<div class="sub"><div class="hd"><b style="flex:1">Set ${i + 1}</b><button type="button" class="btn small" data-rma="${i}">Remove</button></div>

    }

    try {
      const cap = capture ? capture.id : null;
      if(Object.keys(pc).length){ const r = await sb.rpc("cmp_save", { p_table:"cmp_companies", p_key:key, p_patch:pc, p_reason:reason, p_capture:Object.keys(pk).length ? null : cap }); if(r.error) throw r.error; }

      d.close(); S.loaded = false;
      if(capture){ await loadPlaybook(true); location.hash === "#/review" ? reviewView("open") : (location.hash = "#/review"); }
      else { await loadPlaybook(true); playbookView(key); }
    } catch(e){ msg.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; btn.disabled = false; btn.textContent = "Save card"; }
  };
}

    const r = await sb.from("cmp_due").select("*").order("days_since", { ascending:false, nullsFirst:true }); if(r.error) throw r.error;
    $("#app").innerHTML = tabs("reports") + `<div class="page">${back}<h2>Cards due for re-verify</h2>
      <p class="muted">${r.data.length} card${r.data.length === 1 ? "" : "s"}. Re-check the website, BBB and anything we've heard, then “Mark re-verified” on the card (even if nothing changed).</p>
      <div class="scroll"><table class="rep"><thead><tr><th>Company</th><th>Tier</th><th>Last verified</th><th>Why</th></tr></thead><tbody>
      ${r.data.map(x => `<tr><td><a href="#${esc(x.id)}">${esc(x.name)}</a></td><td>${esc(TIER[x.tier] || x.tier)}</td><td>${x.last_verified ? `${esc(fmtD(x.last_verified))} <span class="muted">(${x.days_since} days)</span>` : "never"}</td><td>${esc(x.why)}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  } else if(which === "changes"){
    const r = await sb.from("cmp_changes").select("*").order("at", { ascending:false }).limit(300); if(r.error) throw r.error;
    const name = x => (x.company_id && byId(x.company_id) || {}).name || ({ cmp_threads:"Thread #", cmp_content:"Section: " }[x.table_name] || "") + (x.row_key || "");
    const val = v => { const s = typeof v === "string" ? v : JSON.stringify(v); return s == null ? "—" : s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 160) + (s.length > 160 ? "…" : ""); };
    $("#app").innerHTML = tabs("reports") + `<div class="page">${back}<h2>Playbook change log</h2>
      <p class="muted">The last ${r.data.length} saves. Nothing here can be edited or removed.</p>
      ${r.data.map(x => `<div class="item"><div class="hd"><b>${x.company_id ? `<a href="#${esc(x.company_id)}">${esc(name(x))}</a>` : esc(name(x))}</b>
          <span class="pill">${esc(x.action)}</span>${x.capture_id ? `<span class="pill blue">from intel #${x.capture_id}</span>` : ""}
          <span class="muted" style="margin-left:auto">${esc(x.by_name)} · ${esc(fmtDT(x.at))}</span></div>
        ${x.reason ? `<div class="what"><b>Why:</b> ${esc(x.reason)}</div>` : ""}
        <details><summary class="muted" style="cursor:pointer">${Object.keys(x.changed || {}).length} field${Object.keys(x.changed || {}).length === 1 ? "" : "s"}: ${esc(Object.keys(x.changed || {}).join(", "))}</summary>
          <dl class="meta">${Object.entries(x.changed || {}).map(([k, o]) => `<dt>${esc(k)}</dt><dd><span class="muted">was</span> ${esc(val(o.old))}<br><span class="muted">now</span> ${esc(val(o.new))}</dd>`).join("")}</dl></details></div>`).join("")}</div>`;
  } else reportsView();
}

boot().catch(e => { console.error(e); $("#app").innerHTML = `<div class="center"><div class="msg err">Couldn't load: ${esc(errText(e))}</div></div>`; });
</script>
</body>
</html>
