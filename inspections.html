<!-- Maintenance ▸ Inspection planner (Brandon 2026-11-23: "an inspection planner section that allows the office to see what homes need
     inspections and what homes have had some recently"). Reads crew_fill_list() (two-week promise, what's due, rotation, Breezeway task
     already open, stays) + inspection_recent() (hub_inspection_plan.sql: finished + booked Breezeway inspection-department tasks).
     Hands out with crew_fill_give() (managers/admins, same as the Crew planner). Access = crew_plan_ok() (every team but the accountant). -->
<style>
:root{
  --moose:#88B535; --moose-soft:#eef5e0; --moose-ink:#2f4710; --forest:#3c5f12; --forest-2:#5b8a1e;
  --ground:#f5f7f0; --card:#ffffff; --ink:#15201a; --ink-2:#3d4a42; --muted:#6b776f; --line:#e1e7de; --line-2:#cfd8cb;
  --red:#c8382b; --red-soft:#fbe7e4; --amber:#b5770a; --amber-soft:#fbf0d9; --blue:#2463a0; --blue-soft:#e3edf8; --violet:#6b4bb0; --violet-soft:#eee8f8;
  --radius:16px; --shadow:0 1px 2px rgba(20,40,25,.06), 0 4px 14px rgba(20,40,25,.06);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--ground);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d; --violet-soft:#241c36; --shadow:0 1px 2px rgba(0,0,0,.3); } }
:root[data-theme="dark"]{
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d; --violet-soft:#241c36; --shadow:0 1px 2px rgba(0,0,0,.3); }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);-webkit-font-smoothing:antialiased;line-height:1.45}
.wrap{max-width:1800px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--muted);font-size:13px}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:10px;min-height:34px;padding:0 12px;
  font:inherit;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--forest-2);border-color:var(--forest-2);color:#fff} .btn.sm{min-height:28px;padding:0 9px;font-size:12px}
.hero{background:linear-gradient(135deg,var(--forest),var(--forest-2));color:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.hero .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero .top .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hero .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.hero .sub{font-size:13px;opacity:.9;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tile{background:rgba(255,255,255,.96);color:var(--ink);border:0;border-radius:14px;padding:9px 13px;text-align:left;font:inherit;cursor:pointer}
.tile b{display:block;font-size:22px;font-weight:800;line-height:1.15} .tile span{font-size:12px;color:var(--muted);font-weight:700}
.tile.on{outline:3px solid var(--moose)} .tile.red b{color:var(--red)} .tile.amber b{color:var(--amber)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.pt{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink)}
.pt.on{background:var(--forest);border-color:var(--forest);color:#fff}
.bar input,.bar select{font:inherit;font-size:14px;border:1px solid var(--line-2);border-radius:10px;padding:6px 10px;background:var(--card);color:var(--ink)}
.bar input{flex:1 1 220px;min-width:180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--card);position:sticky;top:0;cursor:pointer;white-space:nowrap}

tr:hover td{background:var(--ground)}
td b.h{font-size:14.5px} .sm2{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--moose-soft);color:var(--moose-ink)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.violet{background:var(--violet-soft);color:var(--violet)} .pill.grey{background:var(--ground);color:var(--muted);border:1px solid var(--line-2)}
a.bw{color:var(--blue);font-weight:700;text-decoration:none} a.bw:hover{text-decoration:underline}
.empty{padding:30px;text-align:center;color:var(--muted)}
.note{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;max-width:540px;width:calc(100% - 24px);background:var(--card);color:var(--ink);max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .dbody{padding:18px 20px;overflow:auto;max-height:calc(100vh - 110px)}
dialog h3{margin:0 0 4px;font-size:18px}
dialog label{display:block;margin:10px 0;font-size:13px;font-weight:800;color:var(--ink-2)}
dialog input:where(:not([type=checkbox],[type=radio])),dialog select{display:block;width:100%;font:inherit;font-size:15px;border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;margin-top:4px;background:var(--card);color:var(--ink)}
dialog .foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.hist{margin:8px 0 0;padding:0;list-style:none;font-size:13px} .hist li{padding:5px 0;border-bottom:1px solid var(--line)}
.err{color:var(--red);font-weight:700;font-size:13px;margin-top:8px}
body.inhub .hero h1{font-size:20px}
@media (max-width:640px){ .wrap{padding:10px 10px 30px} .tile b{font-size:19px} }
/* v2 (Brandon 2026-11-23: "gotta be prettier ... easier to schedule"): home cards by urgency + one-tap scheduler */
.sec{margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.sec h2{margin:0;font-size:16px;font-weight:800} .sec .cnt{font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--card);border:1px solid var(--line-2);color:var(--ink-2)}
.sec .hint{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.hc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 14px 12px;display:flex;flex-direction:column;gap:9px;border-top:5px solid var(--moose)}
.hc.st-now{border-top-color:var(--red)} .hc.st-week{border-top-color:var(--amber)} .hc.st-booked{border-top-color:var(--blue)} .hc.st-off{border-top-color:var(--line-2)}
.hc.sel{outline:3px solid var(--moose);outline-offset:-1px}
.hc .hd{display:flex;align-items:flex-start;gap:10px}
.hc .code{font-size:18px;font-weight:800;line-height:1.15;letter-spacing:-.01em} .hc .comm{font-size:12.5px;color:var(--muted);font-weight:600}
.hc .pick{margin-left:auto;width:22px;height:22px;accent-color:var(--forest-2);cursor:pointer;flex:none}
.ring{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1;
  background:conic-gradient(var(--rc) calc(var(--p)*1%), var(--line) 0)}
.ring>div{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;align-content:center}
.ring b{font-size:18px;color:var(--rc)} .ring small{font-size:9.5px;color:var(--muted);font-weight:700;margin-top:2px}
.hc .row{display:flex;gap:12px;align-items:center}
.hc .lines{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}
.hc .lines div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .lines .k{color:var(--muted);font-weight:700}
.hc .facts{display:flex;flex-direction:column;gap:5px;font-size:12.8px;border-top:1px dashed var(--line-2);padding-top:8px}
.hc .facts div{display:flex;gap:7px;align-items:baseline} .hc .facts .ic{width:16px;flex:none;text-align:center}
.hc .ft{display:flex;gap:6px;margin-top:auto}
.hc .ft .btn{flex:1;justify-content:center}
.btn.sched{background:var(--forest-2);border-color:var(--forest-2);color:#fff;min-height:38px;font-size:14px}
details.okfold>summary{list-style:none;cursor:pointer} details.okfold>summary::-webkit-details-marker{display:none}
.selbar{position:sticky;bottom:12px;z-index:5;margin-top:14px;background:var(--forest);color:#fff;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.selbar .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff} .selbar .btn.go{background:#fff;color:var(--forest);border-color:#fff}
dialog.wide{max-width:760px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ch{border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;text-align:left;line-height:1.2}
.ch small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.ch.on{border-color:var(--forest-2);background:var(--moose-soft);color:var(--moose-ink);box-shadow:0 0 0 2px var(--moose) inset}
.ch:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.ch.day{min-width:62px;text-align:center}
.ch .nr{color:var(--forest-2)}
.lbl{display:block;margin:14px 0 2px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sugg{margin-top:12px;background:var(--moose-soft);color:var(--moose-ink);border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:700}
.ptab{width:100%;border-collapse:collapse;min-width:0} .ptab td,.ptab th{padding:6px;border-bottom:1px solid var(--line);font-size:13px;position:static}
.ptab select{font:inherit;font-size:13px;border:1px solid var(--line-2);border-radius:8px;padding:4px 6px;background:var(--card);color:var(--ink);max-width:100%}
.ok{color:var(--forest-2);font-weight:800} .bad{color:var(--red);font-weight:800}
body.inhub .selbar{margin-right:190px}
@media (max-width:640px){ .grid{grid-template-columns:1fr} body.inhub .selbar{margin-right:0;bottom:80px} }
</style>

<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>
<dialog id="dlg"></dialog>
<script src="confirm.js?v=20261120c"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const C = window.MM_CONFIG;
const sb = supabase.createClient(C.url, C.anonKey, { auth:{ persistSession:true, detectSessionInUrl:true, flowType:"implicit" } });
window.MM_SB = sb;
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const errText = e => ((e && (e.message || e.error_description)) || String(e)).replace(/^.*?ERROR:\s*/, "");
if(window.top !== window) document.body.classList.add("inhub");
const pcDay = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone:"America/Denver", year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((new Date(a + "T12:00:00Z") - new Date(b + "T12:00:00Z")) / 864e5);
const dLabel = iso => iso ? new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric", timeZone:"UTC" }) : "";
const TODAY = pcDay();
const WHAT = { housekeeping:"a cleaning", maintenance:"a maintenance job", inspection:"an inspection", vendors:"a vendor job", office:"an office task",
  property_services:"a service visit", guest:"a guest stay", owner:"the owner staying", tenant:"a tenant" };
const ago = iso => { if(!iso) return ""; const n = dayDiff(TODAY, iso); return n <= 0 ? "today" : n === 1 ? "yesterday" : n + " days ago"; };
const short = n => String(n || "").replace(/^\d+\s*-\s*/, "").replace(/ Inspection$/i, "");
const first = s => String(s || "").split(" ")[0];
const bwLink = id => `https://app.breezeway.io/task/${id}`;

const S = { F:null, R:null, err:"", view:"homes", tile:"all", q:"", comm:"", days:60, sort:"over", dir:-1, crew:null };
try { const v = localStorage.getItem("mm_insp_view"); if(v) S.view = v; } catch(_){}

async function load(){
  const [f, r] = await Promise.all([sb.rpc("crew_fill_list", { p_day: TODAY }), sb.rpc("inspection_recent", { p_days: S.days })]);
  if(f.error || r.error){ S.err = errText(f.error || r.error); render(); return; }
  S.F = f.data; S.R = r.data; S.err = ""; build(); render();
}

/* one row per home: the two-week check row from crew_fill_list + its last inspection + what's already booked in Breezeway */
function build(){
  const fill = (S.F.homes || []), byHome = {};
  fill.forEach(f => { (byHome[f.home] = byHome[f.home] || {})[f.kind] = f; });
  const done = {}, open = {};
  (S.R.done || []).forEach(t => (done[t.home] = done[t.home] || []).push(t));
  (S.R.open || []).forEach(t => (open[t.home] = open[t.home] || []).push(t));
  const homes = new Map();
  (S.R.homes || []).forEach(h => homes.set(h.home, h));
  Object.keys(byHome).forEach(c => { if(!homes.has(c)) homes.set(c, { home:c }); });
  S.rows = [...homes.values()].map(h => {
    const k = byHome[h.home] || {}, b = k.biweekly || null, u = k.utility || null;
    const ds = done[h.home] || [], os = (open[h.home] || []).slice().sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
    const lastI = ds[0] || null;
    const lastVisit = b && b.last ? { day: b.last, what: b.lastWhat } : (lastI ? { day: lastI.day, what: "inspection" } : null);
    const next = os.find(t => t.date && t.date >= TODAY) || null;
    const past = os.filter(t => t.date && t.date < TODAY);
    const stayNow = b && b.stay;
    return { home: h.home, community: h.community || "", beds: h.beds, b, u, rot: (b && b.rot) || [], pick: b && b.pick,
      lastVisit, since: lastVisit ? dayDiff(TODAY, lastVisit.day) : 9999, lastI, done: ds, open: os, next, past,
      over: b ? b.over : null, due: b ? b.due : null, given: b && b.given && b.given.day >= TODAY ? b.given : null,
      stayNow, nextArrive: b && b.nextArrive, stays: (b && b.stays) || [], onList: !!b };
  });
}

/* states */
const isLate = r => r.onList && r.over > 0;                                   // nobody in for 14+ days
const isWeek = r => r.onList && r.over <= 0 && r.over > -7;                   // two-week check due in the next 7 days
const isBooked = r => !!r.next || !!r.given;
const isRecent = r => r.lastI && dayDiff(TODAY, r.lastI.day) <= 30;
const isNever = r => !r.lastI;
const TILES = [
  ["late", "Past 2 weeks", "no one in 14+ days", isLate, "red"],
  ["week", "Due this week", "two-week check", isWeek, "amber"],
  ["notbooked", "Due, not booked", "past due or this week, nothing in Breezeway", r => (isLate(r) || isWeek(r)) && !isBooked(r), "red"],
  ["booked", "Booked in Breezeway", "inspection on the books", isBooked, ""],
  ["recent", "Inspected last 30 days", "finished inspection", isRecent, ""],
  ["never", "No inspection lately", "none in the days picked below", isNever, ""],
];

function filtered(){
  const q = S.q.trim().toLowerCase().replace(/\s+/g, " ");
  const t = TILES.find(x => x[0] === S.tile);
  return S.rows.filter(r => (!t || t[3](r)) && (!S.comm || r.community === S.comm)
    && (!q || (r.home + " " + r.home.replace(/\s/g, "") + " " + r.community).toLowerCase().includes(q)));
}
const SORTS = {
  home: r => r.home, community: r => r.community + " " + r.home,
  over: r => r.onList ? r.over : -999, last: r => r.since, insp: r => r.lastI ? dayDiff(TODAY, r.lastI.day) : 9999,
  next: r => r.next && r.next.date ? dayDiff(r.next.date, TODAY) : 9999, arrive: r => r.nextArrive ? dayDiff(r.nextArrive, TODAY) : 9999,
};

/* status of a home card: now = due/past due with nothing booked, week = due within 7 days, booked, ok */
function stOf(r){ if(isBooked(r)) return "booked"; if(!r.onList) return "off"; if(r.over >= 0) return "now"; if(r.over > -7) return "week"; return "ok"; }
S.sel = new Set();
function render(){
  const a = $("#app");
  if(S.err){ a.innerHTML = `<div class="hero"><h1>Inspection planner</h1></div><p class="err">Couldn't load: ${esc(S.err)}</p>`; return; }
  if(!S.rows){ return; }
  const canAct = S.F.canAct, comms = [...new Set(S.rows.map(r => r.community).filter(Boolean))].sort();
  const dueNot = S.rows.filter(r => ["now", "week"].includes(stOf(r)));
  a.innerHTML = `
  <div class="hero"><div class="top"><div><h1>🔎 Inspection planner</h1>
    <div class="sub">Someone in every home at least once every 2 weeks: a cleaning, a job, a vendor, an inspection or a stay all count.</div></div>
    <div class="right">${canAct && dueNot.length ? `<button class="btn" id="planall" style="background:#fff;color:var(--forest);border-color:#fff">📋 Plan all ${dueNot.length} due homes</button>` : ""}<a class="btn" href="crew_plan.html">Crew planner →</a><button class="btn" id="rl">↻</button></div></div>
    <div class="tiles">${TILES.map(t => { const n = S.rows.filter(t[3]).length;
      return `<button class="tile ${t[4]}${S.tile === t[0] ? " on" : ""}" data-tile="${t[0]}"><b>${n}</b><span>${esc(t[1])}</span><span style="display:block;font-weight:600">${esc(t[2])}</span></button>`; }).join("")}</div></div>
  <div class="bar">
    <div class="tabs">${[["homes","🏠 Homes"],["recent","✅ Recently inspected"],["booked","📅 Booked"]].map(v => `<button class="pt${S.view === v[0] ? " on" : ""}" data-view="${v[0]}">${v[1]}</button>`).join("")}</div>
    <input id="q" placeholder="Find a home or community" value="${esc(S.q)}">
    <select id="comm"><option value="">All communities</option>${comms.map(c => `<option${c === S.comm ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>
    <select id="days" title="How far back to look for inspections">${[30,60,120,365].map(n => `<option value="${n}"${n === S.days ? " selected" : ""}>Inspections: last ${n} days</option>`).join("")}</select>
    ${S.tile !== "all" ? `<button class="btn sm" data-tile="all">Show all homes</button>` : ""}
  </div>
  ${S.view === "recent" ? recentView() : S.view === "booked" ? bookedView() : homesView(canAct)}
  ${S.sel.size && S.view === "homes" ? `<div class="selbar"><button class="btn go" id="selplan">📋 Plan ${S.sel.size === 1 ? "it" : "them"}</button><button class="btn" id="selclear">Clear</button>
    <b>${S.sel.size} home${S.sel.size === 1 ? "" : "s"} picked</b><span style="opacity:.85;font-size:13px">The hub picks a free day and the best tech for each. You check it, then send.</span></div>` : ""}
  <p class="note">Last visit = newest finished Breezeway task of any kind or a Track stay (last 120 days). Inspections = Breezeway's inspection department.
  ${canAct ? "" : S.F.canEdit ? "Scheduling is switched off right now." : "Managers schedule inspections; you can look."}</p>`;
  if(S._qf){ const q = $("#q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

const SECS = [["now", "🚨 Needs an inspection", "past due or due today, nothing booked"], ["week", "⏳ Due this week", "nothing booked yet"],

/* ---------- scheduling: the crew's next 2 weeks from crew_plan() (tasks, time off, home points) ---------- */
const P = { B:null };
const miles = (a, b) => { const R = 3958.8, r = x => x * Math.PI / 180, dl = r(b[0] - a[0]), dn = r(b[1] - a[1]);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const NEAR = 0.5, MAX_DAY = 6;      // "near" = same complex / next door; a tech with 6+ jobs that day is full
async function crewPlan(){
  if(P.B) return P.B;
  const r = await sb.rpc("crew_plan", { p_from: TODAY, p_to: addDays(TODAY, 14) });
  if(r.error) throw r.error;
  P.B = r.data; P.techs = (r.data.crew || []).filter(c => c.bw && !c.mgr); return P.B;
}
const onTask = (c, t) => (t.who || []).some(n => n === c.bwName || n.split(" ")[0].toLowerCase() === (c.first || "").toLowerCase());
const loadOf = (c, day, extra) => (P.B.tasks || []).filter(t => t.date === day && t.stage !== "finished" && onTask(c, t)).length + ((extra && extra[c.uid + "|" + day]) || 0);
const offOn = (c, day) => (P.B.off || []).some(o => o.uid === c.uid && o.from <= day && day <= (o.to || o.from));
const ptOf = r => (r.b && r.b.pt) || (P.B.places || {})[r.home] || null;
const stayOn = (r, day) => r.stays.find(s => s[0] <= day && day < s[1]);
const isWkend = d => [0, 6].includes(new Date(d + "T12:00:00Z").getUTCDay());
function nearOf(c, day, r, extraNear){
  const p = ptOf(r); if(!p) return null; let best = null;
  const homes = (P.B.tasks || []).filter(t => t.date === day && onTask(c, t)).map(t => t.home).concat((extraNear && extraNear[c.uid + "|" + day]) || []);
  homes.forEach(h => { if(!h || h === "Moose company") return; const q = (P.B.places || {})[h]; const m = h === r.home ? 0 : q ? miles(p, q) : 99;
    if(m <= NEAR && (!best || m < best.mi)) best = { home: h, mi: m }; });
  return best;
}
const DAYS = () => Array.from({ length: 14 }, (_, i) => addDays(TODAY, i));
/* best day + tech: first weekday from tomorrow with no stay; on that day a tech already working next door wins, else the lightest load */
function suggest(r, extra, extraNear){
  for(const day of DAYS().slice(1)){
    if(stayOn(r, day) || isWkend(day)) continue;
    const opts = P.techs.filter(c => !offOn(c, day)).map(c => ({ c, load: loadOf(c, day, extra), near: nearOf(c, day, r, extraNear) }))
      .filter(o => o.load < MAX_DAY).sort((a, b) => (a.near ? 0 : 1) - (b.near ? 0 : 1) || a.load - b.load);
    if(opts.length) return { day, tech: opts[0].c, near: opts[0].near, load: opts[0].load };
  }
  return { day: addDays(TODAY, 1), tech: P.techs[0], near: null, load: 0 };
}
const kindOpts = r => [{ kind:"biweekly", short:"Two-week check", last: r.b && r.b.lastKind }].concat(r.rot.map(x => ({ kind:x.kind, short:x.short, last:x.last, over:x.over })));

async function openGive(code){
  const r = S.rows.find(x => x.home === code); if(!r || !r.b) return; const d = $("#dlg");
  try { await crewPlan(); } catch(e){ await mmAlert("Couldn't load the crew's schedule: " + errText(e)); return; }
  if(!P.techs.length){ await mmAlert("No techs are set up in Breezeway."); return; }
  const sg = suggest(r), G = { kind: r.pick || "biweekly", day: sg.day, uid: sg.tech.uid };
  d.className = "wide";
  const draw = () => {
    const tech = P.techs.find(c => c.uid === G.uid), nr = tech && nearOf(tech, G.day, r), st = stayOn(r, G.day);
    d.innerHTML = `<div class="dbody"><h3>📅 Schedule an inspection · ${esc(r.home)}</h3>
      <div class="muted">${esc(r.community || "")} · ${r.lastVisit ? "last someone was in " + esc(dLabel(r.lastVisit.day)) + " (" + esc(ago(r.lastVisit.day)) + ")" : "no visit on record"}${r.next ? ` · Breezeway already has ${esc(short(r.next.name))} ${r.next.date ? "on " + esc(dLabel(r.next.date)) : "with no date"}` : ""}</div>
      <div class="sugg">✨ Suggested: ${esc(dLabel(sg.day))} · ${esc(first(sg.tech.bwName || sg.tech.name))}${sg.near ? ` (already at ${esc(sg.near.home)} that day)` : ` (${sg.load} job${sg.load === 1 ? "" : "s"} that day)`} — just press Send, or change it below.</div>
      <span class="lbl">What</span><div class="chips">${kindOpts(r).map(k => `<button class="ch${G.kind === k.kind ? " on" : ""}" data-gk="${esc(k.kind)}">${esc(k.short)}${k.kind === r.pick && r.pick !== "biweekly" ? " ⭐" : ""}<small>${k.last ? "last " + esc(dLabel(k.last)) : "none on record"}</small></button>`).join("")}</div>
      <span class="lbl">When</span><div class="chips">${DAYS().map(day => { const s = stayOn(r, day);
        return `<button class="ch day${G.day === day ? " on" : ""}" data-gd="${day}"${s ? " disabled" : ""} title="${s ? esc(s[2]) + " staying" : ""}">${esc(day === TODAY ? "Today" : new Date(day + "T12:00:00Z").toLocaleDateString("en-US", { weekday:"short", timeZone:"UTC" }))}<small>${esc(new Date(day + "T12:00:00Z").toLocaleDateString("en-US", { month:"short", day:"numeric", timeZone:"UTC" }))}${s ? " · " + esc(s[2]) : ""}</small></button>`; }).join("")}</div>
      <span class="lbl">Who</span><div class="chips">${P.techs.map(c => { const off = offOn(c, G.day), l = loadOf(c, G.day), n = nearOf(c, G.day, r);
        return `<button class="ch${G.uid === c.uid ? " on" : ""}" data-gu="${esc(c.uid)}"${off ? " disabled" : ""}>${esc(c.bwName || c.name)}<small>${off ? "Off" : l + " job" + (l === 1 ? "" : "s") + " that day"}${n ? ` · <span class="nr">📍 at ${esc(n.home)}</span>` : ""}</small></button>`; }).join("")}</div>
      ${st ? `<div class="err">Someone is staying that night. Pick another day.</div>` : ""}
      <div class="err" id="g_err"></div></div>
      <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="g_go"${st || !tech ? " disabled" : ""}>Send to Breezeway: ${esc(kindName(G.kind))} · ${esc(first(tech ? tech.bwName || tech.name : ""))} · ${esc(dLabel(G.day))}</button></div>`;
    $$("[data-gk]", d).forEach(b => b.onclick = () => { G.kind = b.dataset.gk; draw(); });
    $$("[data-gd]", d).forEach(b => b.onclick = () => { G.day = b.dataset.gd; draw(); });
    $$("[data-gu]", d).forEach(b => b.onclick = () => { G.uid = b.dataset.gu; draw(); });
    $("#g_go").onclick = async () => {
      $("#g_go").disabled = true; $("#g_go").textContent = "Sending…";
      const res = await sb.rpc("crew_fill_give", { p_code: r.home, p_kind: G.kind, p_user: G.uid, p_day: G.day });
      if(res.error){ $("#g_err").textContent = errText(res.error); $("#g_go").disabled = false; return; }
      r.given = { who: tech.bwName || tech.name, day: G.day, how: "manual", kind: G.kind }; P.B = null;
      d.close(); S.sel.delete(r.home); render(); setTimeout(load, 60000);
    };
  };
  draw(); if(!d.open) d.showModal();
}

/* plan several homes at once: each gets a suggested day + tech (spreading the load), editable, then one Send */
async function openPlan(codes){
  const rows = codes.map(c => S.rows.find(x => x.home === c)).filter(r => r && r.b).sort((a, b) => b.since - a.since);
  if(!rows.length) return; const d = $("#dlg");
  try { await crewPlan(); } catch(e){ await mmAlert("Couldn't load the crew's schedule: " + errText(e)); return; }
  const extra = {}, extraNear = {};
  const L = rows.map(r => { const s = suggest(r, extra, extraNear), k = s.tech.uid + "|" + s.day;
    extra[k] = (extra[k] || 0) + 1; (extraNear[k] = extraNear[k] || []).push(r.home);
    return { r, kind: r.pick || "biweekly", day: s.day, uid: s.tech.uid, near: s.near, st: "" }; });
  d.className = "wide";
  const draw = () => {
    const byTech = {}; L.forEach(x => { const c = P.techs.find(c => c.uid === x.uid); const n = c ? first(c.bwName || c.name) : "?"; byTech[n] = (byTech[n] || 0) + 1; });
    d.innerHTML = `<div class="dbody"><h3>📋 Plan ${L.length} inspection${L.length === 1 ? "" : "s"}</h3>
      <div class="muted">The hub picked the first free weekday for each home and spread them across the crew, putting a tech next door when they're already there. Change anything, then send.</div>
      <div class="sugg">${Object.entries(byTech).map(([n, c]) => `${esc(n)}: ${c}`).join(" · ")}</div>
      <table class="ptab"><thead><tr><th>Home</th><th>What</th><th>Day</th><th>Who</th><th></th></tr></thead><tbody>
      ${L.map((x, i) => `<tr><td><b>${esc(x.r.home)}</b><span class="sm2">${x.r.lastVisit ? esc(ago(x.r.lastVisit.day)) : "no visit"}${x.near ? " · 📍 near " + esc(x.near.home) : ""}</span></td>
        <td><select data-pk="${i}">${kindOpts(x.r).map(k => `<option value="${esc(k.kind)}"${k.kind === x.kind ? " selected" : ""}>${esc(k.short)}</option>`).join("")}</select></td>
        <td><select data-pd="${i}">${DAYS().map(day => `<option value="${day}"${day === x.day ? " selected" : ""}${stayOn(x.r, day) ? " disabled" : ""}>${esc(dLabel(day))}${stayOn(x.r, day) ? " (stay)" : ""}</option>`).join("")}</select></td>
        <td><select data-pu="${i}">${P.techs.map(c => `<option value="${esc(c.uid)}"${c.uid === x.uid ? " selected" : ""}${offOn(c, x.day) ? " disabled" : ""}>${esc(c.bwName || c.name)}${offOn(c, x.day) ? " (off)" : ""}</option>`).join("")}</select></td>
        <td>${x.st === "ok" ? `<span class="ok">✓ Sent</span>` : x.st ? `<span class="bad" title="${esc(x.st)}">✗ ${esc(x.st.slice(0, 40))}</span>` : `<button class="btn sm" data-px="${i}" title="Take it off this plan">✕</button>`}</td></tr>`).join("")}</tbody></table></div>
      <div class="foot"><button class="btn" data-close>Close</button><button class="btn primary" id="p_go"${L.every(x => x.st === "ok") ? " disabled" : ""}>Send ${L.filter(x => x.st !== "ok").length} to Breezeway</button></div>`;
    $$("[data-pk]", d).forEach(s => s.onchange = () => { L[+s.dataset.pk].kind = s.value; });
    $$("[data-pd]", d).forEach(s => s.onchange = () => { L[+s.dataset.pd].day = s.value; draw(); });
    $$("[data-pu]", d).forEach(s => s.onchange = () => { L[+s.dataset.pu].uid = s.value; draw(); });
    $$("[data-px]", d).forEach(b => b.onclick = () => { L.splice(+b.dataset.px, 1); if(!L.length) d.close(); else draw(); });
    $("#p_go").onclick = async () => {
      $("#p_go").disabled = true;
      for(const x of L){ if(x.st === "ok") continue;
        $("#p_go").textContent = `Sending ${x.r.home}…`;
        const res = await sb.rpc("crew_fill_give", { p_code: x.r.home, p_kind: x.kind, p_user: x.uid, p_day: x.day });
        if(res.error) x.st = errText(res.error); else { x.st = "ok"; const c = P.techs.find(c => c.uid === x.uid);
          x.r.given = { who: c.bwName || c.name, day: x.day, how: "manual", kind: x.kind }; S.sel.delete(x.r.home); } }
      P.B = null; draw(); render(); setTimeout(load, 60000);
    };
  };
  draw(); if(!d.open) d.showModal();
}

document.addEventListener("click", async e => {
  const d = $("#dlg"); if(e.target === d){ d.close(); return; }
  const b = e.target.closest("button"); if(!b) { const th = e.target.closest("th[data-sort]"); if(th){ const k = th.dataset.sort; if(S.sort === k) S.dir = -S.dir; else { S.sort = k; S.dir = k === "over" ? -1 : 1; } render(); } return; }
  if(b.dataset.tile){ S.tile = S.tile === b.dataset.tile ? "all" : b.dataset.tile; if(S.view !== "homes" && S.tile !== "all") S.view = "homes"; render(); return; }
  if(b.dataset.view){ S.view = b.dataset.view; try { localStorage.setItem("mm_insp_view", S.view); } catch(_){} render(); return; }
  if(b.id === "rl"){ load(); return; }
  if(b.dataset.open){ openHome(b.dataset.open); return; }
  if(b.dataset.give){ openGive(b.dataset.give); return; }
  if(b.dataset.selsec){ S.rows.filter(r => stOf(r) === b.dataset.selsec).filter(r => filtered().includes(r)).forEach(r => S.sel.add(r.home)); render(); return; }
  if(b.id === "selclear"){ S.sel.clear(); render(); return; }
  if(b.id === "selplan"){ openPlan([...S.sel]); return; }
  if(b.id === "planall"){ openPlan(S.rows.filter(r => ["now", "week"].includes(stOf(r))).map(r => r.home)); return; }
  if(b.hasAttribute("data-close")){ d.close(); return; }
});
document.addEventListener("toggle", e => { const f = e.target.dataset && e.target.dataset.fold; if(f) S["open_" + f] = e.target.open; }, true);
document.addEventListener("input", e => { if(e.target.id === "q"){ S.q = e.target.value; S._qf = true; render(); S._qf = false; } });
document.addEventListener("change", e => {
  if(e.target.id === "comm"){ S.comm = e.target.value; render(); }
  if(e.target.dataset && e.target.dataset.sel){ const c = e.target.dataset.sel; e.target.checked ? S.sel.add(c) : S.sel.delete(c); render(); }
  if(e.target.id === "days"){ S.days = +e.target.value; load(); }
});

(async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("#app").innerHTML = `<h1>Please sign in</h1><p><a class="btn primary" href="hub.html" target="_top">Go to the Moose Hub</a></p>`; return; }
  const ok = await sb.rpc("crew_plan_ok");
  if(ok.error){ $("#app").innerHTML = `<h1>Inspection planner</h1><p class="muted">Couldn't load. Check your signal and try again.</p>`; return; }
  if(ok.data !== true){ location.replace("hub.html#/home"); return; }
  load();
})();
window.__ip = { S, render, build };
</script>
