<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3c5f12">
<title>Moose Locks</title>
<link rel="icon" href="moose-logo.png">
<link rel="apple-touch-icon" href="moose-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --moose:#88B535; --moose-2:#A6CE39; --moose-ink:#2f4710; --moose-soft:#eef5e0;
  --forest:#3c5f12; --forest-2:#5b8a1e; --pine:#4f7a18; --pine-soft:#eaf3da;
  --ground:#f5f7f0; --card:#ffffff; --ink:#15201a; --ink-2:#3d4a42; --muted:#6b776f; --line:#e1e7de; --line-2:#cfd8cb;
  --red:#c8382b; --red-soft:#fbe7e4; --amber:#b5770a; --amber-soft:#fbf0d9; --blue:#2463a0; --blue-soft:#e3edf8;
  --radius:18px; --tap:48px; --shadow:0 1px 2px rgba(20,40,25,.06), 0 4px 14px rgba(20,40,25,.06);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-feature-settings:"tnum" 1;
  color:var(--ink); background:var(--ground);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --pine-soft:#173026; --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d;
  --shadow:0 1px 2px rgba(0,0,0,.3); } }
:root[data-theme="dark"]{ --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --pine-soft:#173026; --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d; --shadow:0 1px 2px rgba(0,0,0,.3); }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
a{color:var(--pine)}
/* header */
header.top{position:sticky;top:0;z-index:6;color:#fff;background:linear-gradient(135deg,var(--forest),var(--forest-2));
  padding:14px 16px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 2px 12px rgba(10,30,20,.18)}
.top .bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top .mark{width:38px;height:38px;border-radius:12px;background:var(--moose);display:grid;place-items:center;flex:none}
.top .mark svg{width:22px;height:22px;color:#16220a}
.logo{position:relative;width:46px;height:46px;flex:none}
.logo img{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 2px 8px rgba(0,0,0,.25);display:block}
.logo .lk{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--moose);display:grid;place-items:center;box-shadow:0 0 0 2px var(--forest)}
.logo .lk svg{width:11px;height:11px;color:#16220a}
.login .logo{width:84px;height:84px;margin:0 auto 12px}.login .logo img{width:84px;height:84px}
.login .logo .lk{width:28px;height:28px;box-shadow:0 0 0 3px #fff}.login .logo .lk svg{width:15px;height:15px}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.top .sub{font-size:13px;opacity:.75;font-weight:600}
.top .grow{flex:1;min-width:0}
.top .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;text-decoration:none}
.top .iconbtn svg{width:20px;height:20px}
.top .deskbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;text-decoration:none;font-weight:800;font-size:14px;white-space:nowrap}
.top .deskbtn svg{width:18px;height:18px}
.top .bar{gap:8px}
@media (max-width:560px){ .top .hide-sm{display:none} }
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:4px 0 12px;font-weight:800;letter-spacing:-.02em}
h3{font-size:13px;margin:22px 2px 10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
b,strong{font-weight:800}
/* chips */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;background:var(--pine-soft);color:var(--pine);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.pill.plain::before{display:none}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--moose-soft);color:var(--moose-ink)} .pill.grey{background:var(--line);color:var(--ink-2)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
@media (prefers-color-scheme: dark){ .pill{color:#c5e38a} }
/* buttons */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:14px;min-height:var(--tap);padding:0 16px;
  font:inherit;font-weight:800;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .05s, filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--forest-2);border-color:var(--forest-2);color:#fff}
.btn.go{background:var(--moose);border-color:var(--moose);color:#16220a}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.small{min-height:36px;font-size:13.5px;padding:0 12px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
/* forms */
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:700}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:var(--tap);border:1px solid var(--line-2);border-radius:13px;padding:10px 13px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--moose-soft);border-color:var(--moose)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--forest-2)}
.big{font-size:28px;letter-spacing:5px;font-weight:800;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.list>div{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--card);user-select:none}
.chip.on{background:var(--forest-2);color:#fff;border-color:var(--forest-2)}
details summary{cursor:pointer;font-weight:800;padding:4px 0;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
details[open] summary{margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:9px 4px;border-top:1px solid var(--line);text-align:left} th{color:var(--muted);font-weight:700}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}
.stat.warn .n{color:var(--red)}
/* home cards */
.home{display:block;text-decoration:none;color:inherit;position:relative;overflow:hidden;padding-left:20px}
.home::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line-2)}
.home.ok::before{background:var(--moose)} .home.bad::before{background:var(--red)} .home.todo::before{background:var(--amber)}
.home .code{font-size:20px;font-weight:800;letter-spacing:-.01em}
.home .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.batt{display:inline-block;width:22px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.batt i{position:absolute;left:1px;top:1px;bottom:1px;border-radius:1px;background:var(--moose)}
.batt.low i{background:var(--red)}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--moose),var(--moose-2));border-radius:99px}
/* doors */
.door .state{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--moose-soft);color:var(--moose-ink)}
.door .state.open{background:var(--amber-soft);color:var(--amber)} .door .state.off{background:var(--red-soft);color:var(--red)}
.door .state svg{width:24px;height:24px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.temp{font-size:34px;font-weight:800;letter-spacing:-.03em}
/* install stepper */
.how{margin:8px 0 4px;padding:0;list-style:none;display:grid;gap:6px}
.how li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35}
.how .key{flex:0 0 auto;min-width:44px;text-align:center;padding:6px 8px;border-radius:10px;background:var(--card,#fff);border:2px solid var(--line);font-weight:900;font-size:16px}
.master{font-size:18px;margin-top:8px}
@media print{ .tabs,header,nav,#rgo,#rcsv,#rprint,.chips{display:none!important} .card{box-shadow:none!important;border:1px solid #ccc} }
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;padding:16px;overflow:auto}
.hoodpick{position:relative}.hoodpick input{width:100%;padding-right:48px!important}
.hp-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:22px;padding:6px 10px;cursor:pointer;color:var(--ink,#222)}
.hp-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:300px;overflow:auto;background:var(--card,#fff);border:2px solid var(--moose);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hp-row{display:flex;flex-direction:column;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px}.hp-row:last-child{border-bottom:0}
.hp-row:hover,.hp-row:active{background:var(--pine-soft)}.hp-row .muted{font-size:13px}.hp-new b{color:var(--pine)}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.pic{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px;border:1px solid #dfe5da;border-radius:14px;background:var(--card,#fff)}.pic b{font-size:14px}.pic span{font-size:12.5px;color:#5b6656;line-height:1.3}
.step.flash{background:var(--pine-soft);border-radius:12px;transition:background .4s}
.step{scroll-margin-top:80px}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:4px}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--ink-2);display:grid;place-items:center;font-weight:800;font-size:14px}
.step.done .n{background:var(--moose);color:#16220a}
.step.now .n{background:var(--forest-2);color:#fff;box-shadow:0 0 0 4px var(--pine-soft)}
.step .t{font-weight:800}
.step.done .t{color:var(--muted)}
.step .body{margin-top:8px}
.who{font-size:12px;color:var(--muted);font-weight:700}
.check{display:flex;gap:10px;align-items:center;padding:6px 0;font-weight:600}
.syncbar{display:flex;align-items:center;gap:12px}
.syncbar .ic{width:40px;height:40px;border-radius:12px;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center;flex:none}
.syncbar .ic svg{width:20px;height:20px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;padding:4px 4px env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:800;position:relative;border-radius:12px}
nav.tabs a.on{color:var(--forest-2)}
nav.tabs a.on svg{background:var(--moose-soft);border-radius:10px}
nav.tabs svg{width:42px;height:28px;padding:3px 9px}
nav.tabs .badge{position:absolute;top:3px;left:calc(50% + 8px);background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
@media (prefers-color-scheme: dark){ nav.tabs a.on{color:var(--moose)} }
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:14px;font-weight:800;z-index:20;max-width:90vw;box-shadow:var(--shadow)}
.login{max-width:420px;margin:60px auto;padding:0 16px;text-align:center}
.login .mark{width:64px;height:64px;border-radius:20px;background:var(--moose);display:grid;place-items:center;margin:0 auto 10px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
/* ---- office desk version (locks-desk.html): wide, tabs on top, codes + stays */
body.desk{padding-bottom:30px}
.desk .top .bar,.desk main{max-width:min(1800px,calc(100vw - 48px))}
.desk nav.tabs{position:sticky;top:76px;bottom:auto;z-index:5;max-width:none;margin:0;border:0;border-bottom:1px solid var(--line);background:var(--ground);backdrop-filter:none;gap:6px;padding:12px max(16px,calc((100vw - min(1800px,calc(100vw - 48px)))/2 + 16px));flex-wrap:wrap}
.desk nav.tabs a{flex:none;flex-direction:row;gap:8px;padding:9px 16px 9px 10px;font-size:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.desk nav.tabs a.on{background:var(--forest-2);color:#fff;border-color:var(--forest-2)}
.desk nav.tabs a.on svg{background:transparent}
.desk nav.tabs svg{width:22px;height:22px;padding:0}
.desk nav.tabs .badge{position:static;margin-left:2px}
.desk .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.desk .tile-grid>.card{margin:0}
.desk .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.desk .stats{grid-template-columns:repeat(4,1fr)}
.desk .toast{bottom:30px}
@media (max-width:900px){ .desk .cols{grid-template-columns:1fr} }
.tbl td,.tbl th{padding:10px 8px}.tbl tr:hover td{background:var(--ground)}
.code-chip{font-weight:800;letter-spacing:2px;font-size:16px}
details.sect{margin:18px 0 6px} details.sect>summary{padding:6px 2px;border-bottom:1px solid var(--line);margin-bottom:10px} details.sect>summary h3{display:inline}
.status .sl{display:grid;grid-template-columns:14px 1fr auto;column-gap:10px;row-gap:2px;align-items:center;padding:7px 0;border-top:1px solid var(--line)} .status .sl .muted{grid-column:2;grid-row:2;font-size:13.5px} .status .sl .btn{grid-column:3;grid-row:1 / span 2}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;transform:translateY(1px);background:var(--line-2)}
.dot.ok{background:#3fb24a;box-shadow:0 0 0 3px #3fb24a33} .dot.wait{background:#e0a106;box-shadow:0 0 0 3px #e0a10633;animation:pulse 1.4s infinite} .dot.bad{background:var(--red);box-shadow:0 0 0 3px #c8382b33}
@keyframes pulse{50%{opacity:.35}}
.status.allok{border-color:#3fb24a} .status.anybad{border-color:var(--red)}
.reveal{cursor:pointer;border:1px dashed var(--line-2);border-radius:9px;padding:3px 9px;font-weight:800;color:var(--ink-2);background:var(--ground)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
const C = window.MM_CONFIG;
const sb = supabase.createClient(C.url, C.anonKey, { auth:{ persistSession:true, detectSessionInUrl:true, flowType:"implicit" } });
const app = document.getElementById("app");
const S = { me:null, homes:[], props:{}, timer:null };
// Two versions of one page: locks.html = field (phone, no code lists) · locks-desk.html = office desk (codes, stays, scorecard)
const DESK = /locks-desk\.html$/.test(location.pathname) || window.LOCKS_DESK === true;
if(DESK) document.body.classList.add("desk");
const SELF = DESK ? "locks-desk.html" : "locks.html";
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOOR_NAMES = ["Front door","Garage door","Side door","Back door","Lockoff door","Owner closet"];
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function fail(e,w){ console.error(e); toast((w||"Didn't work")+": "+(e&&e.message||e)); }
function ago(ts){ if(!ts) return "never"; const m=(Date.now()-new Date(ts))/6e4; if(m<1) return "just now"; if(m<60) return Math.round(m)+" min ago"; if(m<1440) return Math.round(m/60)+" h ago"; return Math.round(m/1440)+" d ago"; }
function when(ts){ return ts? new Date(ts).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : ""; }
function ageTxt(d){ const y=(Date.now()-new Date(d+"T12:00:00"))/3.156e10; return y<1? Math.max(1,Math.round(y*12))+" mo" : y.toFixed(1)+" yr"; }
const online = h => h && h.last_seen && (Date.now()-new Date(h.last_seen)) < 10*6e4;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function rpc(fn, args){ const { data, error } = await sb.rpc(fn, args); if(error) throw error; return data; }
async function q(table, sel, f){ let x = sb.from(table).select(sel); if(f) x = f(x); const { data, error } = await x; if(error) throw error; return data||[]; }
async function wake(hubId){ try{ await fetch(C.url+"/realtime/v1/api/broadcast",{method:"POST",headers:{"content-type":"application/json",apikey:C.anonKey,authorization:"Bearer "+((await sb.auth.getSession()).data.session||{}).access_token},body:JSON.stringify({messages:[{topic:"hub-"+hubId,event:"wake",payload:{}}]})}); }catch(e){} }
/* "Sync with Track now": the ThinkStation picks it up within a minute (new last-minute booking, code change...) */
async function syncBar(){
  const rows = await q("lock_settings","key,value",x=>x.in("key",["sync_last_run","sync_requested_at"]));
  const v = Object.fromEntries(rows.map(r=>[r.key,r.value]));
  const waiting = v.sync_requested_at && (!v.sync_last_run || new Date(v.sync_requested_at) > new Date(v.sync_last_run));
  return `<div class="card syncbar"><div class="ic">${ICON.sync}</div><div class="grow"><b>Track sync</b><div class="muted">${waiting?"Running within a minute…":"Last synced "+ago(v.sync_last_run)+" · runs by itself every 30 min (6 am-10 pm): new bookings, check-in / check-out time changes, cancellations, agreements"}</div></div>
    <button class="btn go small" id="syncnow" ${waiting?"disabled":""}>🔄 Resync with Track</button></div>`;
}
function wireSync(){
  const b = $("#syncnow"); if(!b) return;
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Asked…";
    try{
      const asked = new Date(await rpc("lock_request_sync"));
      toast("Syncing with Track - about a minute");
      for(let i=0;i<60;i++){ await sleep(5000);

/* status lights: is everything at this home connected? (techs watch this while installing) */
function statusLights(o){
  const now = Date.now(), age = t => t ? (now - new Date(t)) / 6e4 : 1e9;
  const L = [];   // [state, label, detail]  state: ok / wait / bad / off
  if(o.net){ const ct = (navigator.connection||{}).type;
    L.push(o.net.same_as_hub ? ["ok","Your phone","on this home's internet"]
      : o.net.new_hub_here ? ["ok","Your phone","on the same internet as the new hub"]
      : o.net.other_home ? ["bad","Your phone","on "+o.net.other_home+"'s internet - join this home's Wi-Fi"]
      : ["wait","Your phone", ct==="cellular" ? "on cell data - join the home's Wi-Fi" : "not on the hub's network yet"]); }
  const hub = o.hub;
  if(!hub) L.push([o.net && o.net.new_hub_here ? "wait" : "off", "Hub", o.net && o.net.new_hub_here ? "found on this internet - add it in step 2" : "not added yet (plug it in: power + Ethernet cable to the router)"]);
  else { const m = age(hub.last_seen);
    L.push(m < 3 ? ["ok","Hub","online · checked in "+ago(hub.last_seen)] : m < 10 ? ["wait","Hub","checking in… last "+ago(hub.last_seen)] : ["bad","Hub","offline since "+ago(hub.last_seen)+" - check power and the router cable"]);
    const nk = (hub.status||{}).net;
    if(m < 10 && nk) L.push(nk==="ethernet" ? ["ok","Hub internet","Ethernet cable ✓"] : ["wait","Hub internet","on Wi-Fi - plug in the Ethernet cable to the router (more reliable)"]);

    const st = hub.status || {};
    L.push(st.zwave==="ok" && m < 10 ? ["ok","Z-Wave stick","working"+(st.zwave_fw?" · firmware "+st.zwave_fw:"")] : m < 10 ? ["bad","Z-Wave stick","not answering - check it's plugged into the extension cable"] : ["off","Z-Wave stick","waiting for the hub"]); }
  const grp = (list, name, none, ok) => { if(!list.length){ L.push(["off", name, none]); return; }
    const on = list.filter(ok); L.push([on.length===list.length ? "ok" : on.length ? "wait" : "bad", name, `${on.length} of ${list.length} connected` + (on.length<list.length ? " - not answering: "+list.filter(x=>!ok(x)).map(x=>x.name).join(", ") : "")]); };
  const hubUp = hub && age(hub.last_seen) < 10;
  grp(o.locks||[], "Doors", "none paired yet", l => hubUp && l.online !== false);
  grp(o.thermos||[], "Thermostats", "none paired yet - every home needs one", t => hubUp && t.online !== false);
  const leak = (o.sensors||[]).filter(x=>x.kind!=="noise" && x.kind!=="contact"), noise = (o.sensors||[]).filter(x=>x.kind==="noise"), cont = (o.sensors||[]).filter(x=>x.kind==="contact");
  if(leak.length) grp(leak, "Leak sensors", "", x => hubUp && x.online !== false);
  if(cont.length) grp(cont, "Door & window sensors", "", x => hubUp && x.online !== false);
  grp(noise, "Noise sensor (Wi-Fi)", "not set up yet", x => hubUp && x.online !== false && age(x.last_seen) < 10);
  if(o.tvs) grp(o.tvs, "TVs (Wi-Fi)", "none found (optional)", t => hubUp && t.state !== "unavailable" && age(t.last_seen) < 10);
  if(o.codes) L.push(o.codes.total ? [o.codes.on===o.codes.total ? "ok" : "wait", "Codes on the doors", `${o.codes.on} of ${o.codes.total} confirmed`] : ["off","Codes on the doors","none yet"]);
  const needed = L.filter(x=>x[0]!=="off"), allOk = needed.length && needed.every(x=>x[0]==="ok") && hub;
  const anyBad = L.some(x=>x[0]==="bad");
  return `<div class="card status ${allOk?"allok":anyBad?"anybad":""}">
    <div class="row" style="margin-bottom:6px"><b class="grow" style="font-size:16px">${allOk ? "🟢 Everything is connected" : anyBad ? "🔴 Something isn't connected" : "🟡 Still connecting…"}</b><span class="muted" style="font-size:12px">updates every 15 s</span></div>
    ${L.map(([st,l,d])=>`<div class="sl"><i class="dot ${st}"></i><b>${esc(l)}</b><span class="muted grow">${esc(d)}</span>${o.go&&o.go[l]?`<button class="btn small" data-goto="${o.go[l]}">${st==="ok"?"View":"Fix it"} ↓</button>`:""}</div>`).join("")}</div>`;
}

/* "2H-" = second home, "L-" = lease: ignored for sorting / neighborhood, shown as a tag at the end ("DR 4043 · 2H") */
const unpre = c => String(c||"").replace(/^(2H|L)\s*-\s*/i,"");
const preOf = c => ((String(c||"").match(/^(2H|L)\s*-/i)||[])[1]||"").toUpperCase();
const ck = c => unpre(c).toUpperCase();
const dc = c => unpre(c) + (preOf(c) ? " · "+preOf(c) : "");
const hoodOf = h => (h.properties && (unpre(h.properties.area) || unpre(h.properties.code).split(" ")[0])) || "Other";
function hoodName(area){
  const pool = (S.allProps && S.allProps.length ? S.allProps.map(p=>({properties:p})) : S.homes);
  if(String(area).startsWith("county:")) return area.slice(7);
  const names = pool.filter(h=>hoodOf(h)===area).map(h=>unpre(String(h.properties.name||""))
    .replace(/\s*\(.*\)\s*$/,"").replace(/\s+PF$/i,"").replace(/\s+(unit\s+)?#?[\w-]*\d[\w-]*$/i,"").trim()).filter(Boolean);
  const top = Object.entries(names.reduce((m,n)=>(m[n]=(m[n]||0)+1,m),{})).sort((a,b)=>b[1]-a[1])[0];
  return top ? top[0] : area;
}

        ${ts.length?`<button class="btn small" data-hact="temp" data-pid="${esc(h.property_id)}">${ICON.temp} Set temp</button>`:""}</div>`:""}

  };
  const bar = await syncBar();
  shell("homes", `
    <div class="stats">

      <div class="stat"><div class="n">${codesOn}</div><div class="l">Codes on locks</div></div>
      <div class="stat ${ourAlerts?"warn":""}"><div class="n">${ourAlerts}</div><div class="l">Open alerts</div></div>
      ${DESK?`<a class="stat" href="#/stays" style="text-decoration:none;color:inherit"><div class="n">${arrivals}</div><div class="l">Arrivals next 7 days</div></a>`:""}
    </div>
    ${bar}
    ${true ? `<div class="card row" style="gap:12px">
        <label class="field" style="margin:0;flex:1;min-width:200px"><span>Neighborhood</span><select id="hood"><option value="">All neighborhoods</option>
          ${[...new Set(sec.ours.map(hoodOf))].sort((a,b)=>hoodName(a).localeCompare(hoodName(b))).map(a=>`<option value="${esc(a)}">${esc(hoodName(a))} (${esc(a)})</option>`).join("")}</select></label>
        <label class="field" style="margin:0;flex:1;min-width:200px;${DESK?"":"display:none"}"><span>Sort</span><select id="hsort">
          <option value="az">A → Z</option><option value="za">Z → A</option><option value="attn">Needs attention first</option></select></label>
        <label class="field" style="margin:0;flex:1;min-width:200px"><span>Find</span><input id="hfind" placeholder="Home code or name"></label></div>
      <div id="hoodlist"></div>`
    : `<h3>Homes on our system · ${sec.ours.length}</h3><div class="tile-grid">${sec.ours.map(card).join("")||'<div class="empty">No homes yet.</div>'}</div>`}
    ${S.me.role==="admin"?`<details class="card"><summary>Add a home to the test</summary>
      <label class="field"><span>Home code - start typing (e.g. bhv)</span><input id="nh" list="nh_list" autocomplete="off" placeholder="Type letters or numbers…"></label>
      <datalist id="nh_list">${(S.allProps||[]).filter(x=>!S.homes.some(h=>h.property_id===x.id && h.section==="ours")).sort((a,b)=>ck(a.code).localeCompare(ck(b.code),undefined,{numeric:true})).map(x=>`<option value="${esc(dc(x.code))}">${esc(x.name||"")}</option>`).join("")}</datalist>
      <label class="field"><span>Section</span><select id="ns"><option value="ours">Our system</option></select></label>
      <button class="btn primary wide" id="addh">Add</button></details>`:""}`, "Moose Locks", `${sec.ours.length} test homes · ${hubOn} online`);
  wireSync();
  $("#main").addEventListener("click", async ev => { const b = ev.target.closest("[data-hact]"); if(!b) return; ev.preventDefault(); ev.stopPropagation();
    const pid = b.dataset.pid, code = (S.props[pid]||{}).code || "";
    const ls = locks.filter(x=>x.property_id===pid), ts = thermos.filter(x=>x.property_id===pid);
    b.disabled = true;
    try{
      if(b.dataset.hact==="temp"){ const cur = ts.find(t=>t.heat_sp!=null); const v = prompt("Heat every thermostat at "+code+" to (°F):", cur?Math.round(cur.heat_sp):68);
        if(v && +v) await setHomeTemp(ts, "heat", +v, null); }
      else await allDoors(ls, b.dataset.hact, code);
    }catch(e){ fail(e); }
    b.disabled = false; setTimeout(()=>homesView(), 2500);
  }, { capture:true });
  {
    const score = h => { const hub = hubs.find(x=>x.property_id===h.property_id && x.claimed_at); const n = alerts.filter(x=>x.property_id===h.property_id).length;

    if(ps) $("#hsort").value = ps;
    $("#hood").onchange = draw; $("#hsort").onchange = draw; $("#hfind").oninput = draw; draw();
  }
  const b = $("#addh"); if(b) b.onclick = async () => {
    try{ const typed = $("#nh").value.trim().toLowerCase(); const p = (S.allProps||[]).find(x=>x.code.toLowerCase()===typed); if(!p) return toast("No home with that code - pick one from the list");

}

/* ------------------------------------------------ installer tools (like Brivo's): hub info, signal per device, ping, rebuild routes */
function signal(rssi){
  if(rssi==null || rssi===127) return '<span class="muted">-</span>';
  const bars = rssi >= -65 ? 4 : rssi >= -75 ? 3 : rssi >= -85 ? 2 : 1;
  const col = bars>=3 ? "var(--moose)" : bars===2 ? "var(--amber)" : "var(--red)";
  return `<span title="${rssi} dBm" style="display:inline-flex;gap:2px;align-items:flex-end;vertical-align:middle">${[1,2,3,4].map(i=>`<i style="width:4px;height:${4+i*3}px;border-radius:1px;background:${i<=bars?col:"var(--line-2)"}"></i>`).join("")}</span> <span class="muted" style="font-size:12px">${rssi}</span>`;
}
function wireHeal(hub){
  $$("[data-heal]").forEach(b=>b.onclick=async()=>{ if(!confirm("Rebuild Z-Wave routes? Takes a few minutes; doors keep working. Do it once - not again and again.")) return;
    const box = $("[data-healmsg]", b.closest(".card")); b.disabled = true;
    try{ const id = await command(hub.id, null, "heal"); box.innerHTML = '<div class="pill amber" style="margin-top:8px">⏳ Rebuilding… stay nearby</div>';
      const r = await waitCmd(id, 240);
      box.innerHTML = r && r.ok ? '<div class="pill green" style="margin-top:8px">✓ Routes rebuilt - check the signal bars again</div>'
        : `<div class="pill red" style="margin-top:8px">✗ ${esc((r&&r.result&&r.result.msg)||"No answer from the hub yet - it may still be working")}</div>`;
    }catch(e){ fail(e); } b.disabled = false; });
}
function healCard(hub){ return `<div class="card" style="margin-top:10px;background:var(--ground)"><div class="row"><div class="grow"><b>📶 Rebuild routes</b><div class="muted" style="font-size:13px">Tap once after the last device is paired, or after adding a repeater. Takes a few minutes - doors keep working.</div></div>
        <button class="btn primary" data-heal ${hub&&online(hub)?"":"disabled"}>Rebuild</button></div><div data-healmsg></div></div>`; }
/* how the hub reaches the internet (hub 1.5.2+) */
function netPill(hub){ const n = ((hub||{}).status||{}).net;
  return n==="ethernet" ? ' <span class="pill grey plain" title="Hub is plugged into the router with a cable">🔌 Ethernet</span>'
    : n==="wifi" ? ' <span class="pill amber" title="Hub is on Wi-Fi - plug in the Ethernet cable for the most reliable connection">📶 Wi-Fi</span>' : ""; }
function toolsCard(hub, devices){
  if(!hub) return "";
  const st = hub.status || {};
  return `<details class="card" id="tools"><summary>Installer tools</summary>
    <div class="grid2" style="font-size:13.5px">
      <div><span class="muted">Hub</span><br><b>${online(hub)?"Online":"Offline"}</b> · ${ago(hub.last_seen)}${netPill(hub)}</div>
      <div><span class="muted">Software</span><br><b>${esc(st.version||"?")}</b> · HA ${esc(st.ha||"?")}</div>
      <div><span class="muted">Z-Wave stick</span><br><b>${esc(st.zwave_fw||"?")}</b> (SDK ${esc(st.zwave_sdk||"?")})</div>
      <div><span class="muted">Up for</span><br><b>${st.uptime_min!=null?(st.uptime_min>1440?Math.round(st.uptime_min/1440)+" d":st.uptime_min>60?Math.round(st.uptime_min/60)+" h":st.uptime_min+" min"):"?"}</b> · ${st.nodes??"?"} devices</div>
    </div>
    <table style="margin-top:10px"><tr><th>Device</th><th>Signal</th><th>Dropped</th><th></th></tr>
      ${devices.map(d=>`<tr><td><b>${esc(d.name)}</b><div class="muted" style="font-size:12px">node ${d.node_id}${d.online===false?' · <span style="color:var(--red)">not answering</span>':""}</div></td>
        <td>${signal(d.rssi)}</td><td>${d.dropped??"-"}</td>
        <td style="text-align:right"><button class="btn small" data-ping="${d.node_id}">Ping</button></td></tr>`).join("") || '<tr><td colspan="4" class="muted">No devices paired yet.</td></tr>'}
    </table>
    <p class="muted" style="font-size:12.5px">Weak signal (1 bar, or lots of dropped)? Move the stick higher / closer on its cable, or add a Z-Wave repeater between the hub and that door, then Rebuild routes.</p>
    <div class="grid3"><button class="btn small" id="t_heal">Rebuild routes</button><button class="btn small" id="t_add">Add mode</button><button class="btn small" id="t_remove">Remove mode</button></div>
    ${updatesBlock(hub)}
    <button class="btn small danger wide" style="margin-top:8px" id="t_restart">Restart hub</button>
    <div id="t_out" class="muted" style="margin-top:8px"></div></details>`;
}
const UPD_AUTO = ["core","os","supervisor","addon"];
function updatesBlock(hub){
  const ups = hub._ups || [], admin = S.me && S.me.role === "admin";
  const open = ups.filter(u=>!u.done_at), bad = ups.filter(u=>u.ok===false);
  if(!open.length && !bad.length) return `<p style="margin:10px 0 0"><span class="pill green">Up to date</span> <span class="muted" style="font-size:12.5px">Home Assistant updates install themselves 2–5 am when nobody's arriving.</span></p>`;
  const state = u => u.ok===false ? `<span class="pill red">Failed</span><div class="muted" style="font-size:12px">${esc(u.err||"")}</div>`
    : u.started_at ? `<span class="pill amber">Installing…</span>`
    : UPD_AUTO.includes(u.kind) ? `<span class="pill grey">Auto</span><div class="muted" style="font-size:12px">2–5 am, test hub first</div>`
    : admin ? `<button class="btn small" data-upd="${esc(u.entity)}" data-to="${esc(u.to_ver)}">Update now</button>` : `<span class="pill grey">Admin</span>`;
  return `<h4 style="margin:14px 0 4px">Updates</h4><table><tr><th>What</th><th>Version</th><th></th></tr>
    ${[...open, ...bad.filter(b=>!open.includes(b))].map(u=>`<tr><td><b>${esc(u.title||u.entity)}</b><div class="muted" style="font-size:12px">${esc({core:"Home Assistant",os:"Hub system",supervisor:"Supervisor",addon:"Add-on",stick:"Z-Wave stick firmware",device:"Device firmware"}[u.kind]||u.kind)}</div></td>
      <td>${esc(u.from_ver||"?")} → <b>${esc(u.to_ver)}</b></td><td style="text-align:right">${state(u)}</td></tr>`).join("")}</table>
    ${open.some(u=>!UPD_AUTO.includes(u.kind))?'<p class="muted" style="font-size:12.5px">Firmware updates are never automatic. Run them when the home is empty: a lock can take 10–30 min and may need fresh batteries.</p>':""}`;
}
async function loadUpdates(hub){
  if(!hub) return;
  const wk = Date.now() - 7*864e5;
  hub._ups = (await q("lock_updates","*",x=>x.eq("hub_id",hub.id).order("id",{ascending:false}).limit(40)))
    .filter(u => !u.done_at || (u.ok===false && new Date(u.done_at) > wk));
}
function wireTools(hub, after){
  if(!hub || !$("#tools")) return;
  const out = m => { $("#t_out").textContent = m; };
  const run = async (kind, lock, args, label) => {
    out(label + "…");
    try{ const r = await waitCmd(await command(hub.id, lock, kind, args||{}), kind==="include"||kind==="exclude" ? 300 : 40);
      out(r ? ((r.ok?"✓ ":"✗ ") + ((r.result||{}).msg || (r.ok?"done":"failed"))) : "No answer from the hub yet."); if(after) setTimeout(after, 1500);
    }catch(e){ fail(e); } };
  $$("[data-ping]").forEach(b=>b.onclick=()=>run("ping", null, {node:+b.dataset.ping}, "Pinging node "+b.dataset.ping));
  $("#t_heal").onclick = () => { if(confirm("Rebuild Z-Wave routes? Takes a few minutes; locks keep working.")) run("heal", null, {}, "Rebuilding routes"); };
  $("#t_add").onclick = () => run("include", null, {}, "Add mode on for 5 minutes - put the device in join mode");
  $("#t_remove").onclick = () => run("exclude", null, {}, "Remove mode on for 5 minutes - put the device in remove mode");
  $$("[data-upd]").forEach(b=>b.onclick=()=>{ if(confirm("Start this update now? Only do this when the home is empty.")) run("update", null, {entity:b.dataset.upd, to:b.dataset.to}, "Starting update"); });
  $("#t_restart").onclick = () => { if(confirm("Restart the hub? It's back in about a minute; codes keep working on the locks.")) run("restart", null, {}, "Restarting"); };
}

/* ------------------------------------------------ one home */
async function homeView(pid){
  if(!S.homes.length) await loadBase();
  const h = S.homes.find(x=>x.property_id===pid); if(!h) return shell("homes","<p>Home not found.</p>");
  const p = h.properties;
  const [hubs, locks, thermos, sensors, assigns, stays, alerts, events, access, links] = await Promise.all([
    q("lock_hubs","id,name,last_seen,claimed_at,version,status",x=>x.eq("property_id",pid).eq("active",true)),
    q("locks","*",x=>x.eq("property_id",pid).eq("active",true).order("name")),
    q("thermostats","*",x=>x.eq("property_id",pid).eq("active",true).order("name")),
    q("sensors","*",x=>x.eq("property_id",pid).eq("active",true)),
    q("lock_assign","id,lock_id,slot,ref_kind,ref_id,label,code,wanted,state,err,verified_at",x=>x.neq("state","cleared").order("slot")),
    q("lock_stays","res_id,guest,kind,status,starts_at,ends_at,code,code_source,portal_token,agreement,out_at,out_how",x=>x.eq("property_id",pid).gte("ends_at",new Date(Date.now()-864e5).toISOString()).neq("status","cancelled").order("starts_at").limit(8)),
    q("lock_alerts","kind,detail,opened_at,bw_task",x=>x.eq("property_id",pid).is("closed_at",null)),
    q("lock_events","at,kind,who,slot,detail,lock_id",x=>x.eq("property_id",pid).order("at",{ascending:false}).limit(40)),
    q("property_access","wifi_name,wifi_password,door_code,gate_code,garage_code",x=>x.eq("property_id",pid)),
    q("lock_links_on","parent_id,child_id")]);

  // wifi
  $("#wsave") && ($("#wsave").onclick = async () => {
    const { error } = await sb.from("property_access").upsert({ property_id:pid, wifi_name:$("#wn").value.trim()||null, wifi_password:$("#wp").value.trim()||null,
      gate_code:$("#gc").value.trim()||null, garage_code:$("#gg").value.trim()||null });

    try{ await rpc("lock_home_rules",{p_property:pid,r:{arrival_note:$("#an").value.trim()}}); toast("Saved"); }catch(e){ fail(e); } });
  // doors
  $$("[data-lock]").forEach(card => { const id = card.dataset.lock, l = locks.find(x=>x.id===id);

        if(act==="save"){ const mi = $('[data-f="master"]',card), mc = mi ? mi.value.trim() : ""; await rpc("lock_update",{p_lock:id,p_name:$('[data-f="name"]',card).value.trim(),p_for_guests:$('[data-f="guests"]',card).checked,p_active:true,p_master:mc||null,

        if(act==="test"){ const code = String(Math.floor(1000+Math.random()*9000)); await command(null, id, "refresh", {code}); toast("Test code "+code+" is going on the lock (10 min)"); setTimeout(()=>homeView(pid), 15000); }
        if(act==="wipe"){ if(!confirm("Clear every code on this lock that isn't one of ours (old Brivo codes)? Our codes stay.")) return; await command(null, id, "wipe"); toast("Reading the lock… old codes will be cleared"); }

      }catch(e){ fail(e); } }; });

    $$(".chip[data-mode]",card).forEach(c=>c.onclick=()=>{ mode=c.dataset.mode; $$(".chip[data-mode]",card).forEach(x=>x.classList.toggle("on",x===c)); });
    card.onclick = async ev => { const b = ev.target.closest("[data-act]"); if(!b) return;
      try{
        if(b.dataset.act==="set"){ const h2=$('[data-f="heat"]',card).value, c2=$('[data-f="cool"]',card).value;
          await rpc("lock_climate",{p_thermostat:id,p_mode:mode||"heat",p_heat:h2?+h2:null,p_cool:c2?+c2:null}); hub && wake(hub.id); toast("Sent"); }
        if(b.dataset.act==="tsave"){ await rpc("lock_thermostat_update",{p_thermostat:id,p_name:$('[data-f="name"]',card).value,p_managed:$('[data-f="managed"]',card).checked}); toast("Saved"); }
      }catch(e){ fail(e); } }; });
  // rules
  $$("[data-reset]").forEach(b=>b.onclick=async()=>{ const k = b.dataset.reset, msg = t => $("#resetmsg").innerHTML = `<p class="pill green" style="margin-top:8px">${esc(t)}</p>`;
    const ask = {resend:"Send every code to this home's doors again?", wipe:"Clear every code on these doors that isn't ours (old Brivo codes)? Ours and the master stay.",
      backup:"Make new backup codes for every upcoming stay here? The old backup codes stop working.", master_new:"Make a new master code for "+dc(p.code)+"? You'll then change it on each door.",
      master_done:"Is the new master code set on EVERY door? The old one will be forgotten here.", master_cancel:"Cancel the new master code?"}[k];
    if(!confirm(ask)) return;
    try{
      if(k==="resend"){ const n = await rpc("lock_codes_resend",{p_property:pid}); hub && wake(hub.id); msg(n+" code"+(n===1?"":"s")+" going on the doors again"); }
      if(k==="wipe"){ for(const l of locks) await command(null, l.id, "wipe"); msg("Clearing old codes on "+locks.length+" door"+(locks.length===1?"":"s")); }
      if(k==="backup"){ const n = await rpc("lock_backup_reset",{p_property:pid}); hub && wake(hub.id); msg("New backup codes for "+n+" stay"+(n===1?"":"s")); }
      if(k.startsWith("master_")){ await rpc("lock_master_change",{p_property:pid,p_step:k.slice(7)}); await loadBase(); homeView(pid); }
    }catch(e){ fail(e); } });
  $("#rfollow") && ($("#rfollow").onclick = async ev => { ev.preventDefault(); try{ await rpc("lock_home_rules_reset",{p_property:pid}); toast("Back on the company-wide rules"); await loadBase(); homeView(pid); }catch(e){ fail(e); } });
  $("#rsave") && ($("#rsave").onclick = async () => { const r = {}; $$("[data-r]").forEach(i=>{ r[i.dataset.r] = i.value===""?null:i.value; });
    try{ await rpc("lock_home_rules",{p_property:pid,r}); toast("Rules saved"); loadBase(); }catch(e){ fail(e); } });
  // stays
  $$(".reveal").forEach(x => x.onclick = ev => { ev.stopPropagation(); x.outerHTML = `<div class="big" style="font-size:20px">${esc(x.dataset.c)}</div>`; });
  $$("[data-res]").forEach(row => row.onclick = async ev => { const b = ev.target.closest("[data-act]"); if(!b) return; const s = stays.find(x=>x.res_id===row.dataset.res);
    if(b.dataset.act==="link"){ const u = location.origin + location.pathname.replace(/locks(-desk)?\.html$/,"") + "stay.html#t=" + s.portal_token;
      try{ await navigator.clipboard.writeText(u); toast("Guest link copied"); }catch(e){ prompt("Guest link", u); } }
    if(b.dataset.act==="code"){ const c = prompt("New 4–6 digit code for "+(s.guest||"this guest"), s.code); if(!c) return;
      try{ await rpc("lock_stay_code",{p_res:s.res_id,p_code:c.trim()}); toast("Code changed - going on the lock"); homeView(pid); }catch(e){ fail(e); } }
    if(b.dataset.act==="backup") showBackup(s); });
}

/* backup (emergency) code: already on the guest doors for this stay's dates - give it when the lock/hub is offline */
async function showBackup(s){
  if(!confirm("Show the BACKUP code for "+(s.guest||"this guest")+"?\n\nUse it only when their normal code isn't working (lock or hub offline). This is logged.")) return;
  try{ const r = await rpc("lock_backup_give",{p_res:s.res_id}); const d = document.createElement("div"); d.className = "modal";
    const ok = (r.doors||[]).filter(x=>x.on).length, n = (r.doors||[]).length;
    d.innerHTML = `<div class="card" style="max-width:440px;margin:12vh auto;padding:20px"><b>🆘 Backup code - ${esc(s.guest||"Guest")}</b>
      <div style="font-size:40px;font-weight:900;letter-spacing:6px;margin:10px 0">${esc(r.code)}</div>
      <div class="muted">Works ${esc(when(r.starts_at))} → ${esc(when(r.ends_at))} only - the lock enforces the dates itself, even offline.</div>
      <div style="margin-top:8px">${(r.doors||[]).map(x=>`<span class="pill ${x.on?"green":"amber"}" style="margin:2px">${esc(x.door)}: ${x.on?"on the lock ✓":"not loaded yet"}</span>`).join("") || '<span class="muted">No guest doors yet.</span>'}</div>
      ${n && ok<n?'<div class="muted" style="margin-top:6px;color:var(--red)">Not on every door yet - it loads while the lock is online (up to 60 days before check-in).</div>':""}
      <button class="btn primary wide" style="margin-top:12px" data-close>Close</button></div>`;
    document.body.appendChild(d); d.onclick = e => { if(e.target===d || e.target.closest("[data-close]")) d.remove(); };
  }catch(e){ fail(e); } }

  drawCodes();

const ENTRY_KINDS = {unlock_code:"Entered - code", unlock_phone:"Entered - phone key", unlock_remote:"Unlocked from the app", unlock_manual:"Unlocked from inside",
  lock_keypad:"Left - locked from outside", lock_manual:"Locked from inside", lock_remote:"Locked from the app", lock_auto:"Auto-locked",
  door_open:"Door opened", door_closed:"Door closed", guest_arrived:"Guest arrived (first code use)", guest_out:"Guest left"};
const CLIMATE_BY = by => !by ? "" : by==="at the thermostat" ? "At the thermostat" : by==="first seen" ? "First seen" : /^warm/.test(by) ? "Warming for arrival" : /^vacant|^setback|out/.test(by) ? "Empty-home setback"
  : by==="heat_test" ? "Install heat test" : by==="heat_test_done" ? "After heat test" : by==="manual" ? "Office / app" : by==="admin" ? "Office / app" : by;
function csvDownload(name, rows){ const c = rows.map(r=>r.map(v=>{ v = v==null?"":String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([c],{type:"text/csv"})); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); }
async function reportsView(){
  if(!S.homes.length) await loadBase();
  const oursH = S.homes.filter(h=>h.section==="ours"), hoods = [...new Set(oursH.map(hoodOf))].sort((a,b)=>hoodName(a).localeCompare(hoodName(b)));
  const d0 = new Date(Date.now()-7*864e5).toISOString().slice(0,10), d1 = new Date().toISOString().slice(0,10);
  const tab = pref("rtab") || "entries";
  shell("reports", `<h2>Reports</h2>
    <div class="chips" style="margin-bottom:10px"><span class="chip ${tab==="entries"?"on":""}" data-rtab="entries">🚪 Entries &amp; exits</span><span class="chip ${tab==="climate"?"on":""}" data-rtab="climate">🌡️ Heating &amp; cooling</span><span class="chip ${tab==="cya"?"on":""}" data-rtab="cya">🛡️ CYA log</span></div>
    ${tab==="cya"?'<p class="muted" style="margin:-4px 0 8px">Everything that happened, in order: doors, codes (made, confirmed on the lock, changed), guest opened their link, backup codes given, office changes and who made them, alerts, Slack messages, heat/AC changes. Nothing here can be edited or deleted. Type a guest name or reservation # in Who for a full stay report.</p>':""}
    <div class="card row" style="gap:12px;flex-wrap:wrap">
      <label class="field" style="margin:0;min-width:150px"><span>From</span><input type="date" id="rf" value="${d0}"></label>

      <label class="field" style="margin:0;flex:1;min-width:170px"><span>Neighborhood</span><select id="rh"><option value="">All neighborhoods</option>${hoods.map(a=>`<option value="${esc(a)}">${esc(hoodName(a))}</option>`).join("")}</select></label>
      <label class="field" style="margin:0;flex:1;min-width:150px"><span>Home</span><select id="rp"></select></label>
      ${tab==="cya"?`<label class="field" style="margin:0;flex:2;min-width:200px"><span>Who / reservation</span><input id="rw" placeholder="Example: Pat Smith or 320982"></label>`:""}
      ${tab==="entries"?`<label class="field" style="margin:0;flex:1;min-width:150px"><span>Show</span><select id="rk"><option value="io">Entries &amp; exits</option><option value="all">Every door event</option></select></label>
        <label class="field" style="margin:0;flex:2;min-width:180px"><span>Who</span><input id="rw" placeholder="Example: Shelby, ABC Hot Tubs, guest name"></label>`:""}
      <button class="btn primary" id="rgo" style="align-self:flex-end">Show</button><button class="btn" id="rcsv" style="align-self:flex-end">⬇ CSV</button>${tab==="cya"?'<button class="btn" id="rprint" style="align-self:flex-end">🖨 Print</button>':""}</div>
    <div id="rout"><p class="muted">Loading…</p></div>`, "Reports", "Entries, exits, heating & cooling");

  fillHomes(); $("#rh").onchange = () => { fillHomes(); run(); };
  $$("[data-rtab]").forEach(c=>c.onclick=()=>{ pref("rtab", c.dataset.rtab); reportsView(); });
  const pids = () => { const hm = $("#rp").value, hd = $("#rh").value; return hm ? [hm] : oursH.filter(h=>!hd || hoodOf(h)===hd).map(h=>h.property_id); };
  const range = () => [new Date($("#rf").value+"T00:00:00").toISOString(), new Date($("#rt").value+"T23:59:59").toISOString()];
  const code = id => dc((S.props[id]||{}).code||id);

  const run = async () => { const [a,b] = range(), ids = pids(); $("#rout").innerHTML = '<p class="muted">Loading…</p>';

      csv = [["When","Home","Door","What","Who"], ...rows.map(e=>[new Date(e.at).toLocaleString(), code(e.property_id), door(e.lock_id), ENTRY_KINDS[e.kind]||e.kind, e.who||""])];
      const ins = rows.filter(e=>/^unlock_code|^unlock_phone|guest_arrived/.test(e.kind)).length, outs = rows.filter(e=>e.kind==="lock_keypad"||e.kind==="guest_out").length;
      $("#rout").innerHTML = `<div class="card"><div class="row" style="gap:18px"><div><div class="big">${rows.length}</div><span class="muted">events</span></div><div><div class="big">${ins}</div><span class="muted">entries</span></div><div><div class="big">${outs}</div><span class="muted">exits</span></div></div></div>
        <div class="card" style="overflow-x:auto"><table class="tbl"><tr><th>When</th><th>Home</th><th>Door</th><th>What</th><th>Who</th></tr>
        ${rows.slice(0,1000).map(e=>`<tr><td>${esc(when(e.at))}</td><td><a href="#/home/${encodeURIComponent(e.property_id)}">${esc(code(e.property_id))}</a></td><td>${esc(door(e.lock_id))}</td><td>${esc(ENTRY_KINDS[e.kind]||e.kind)}</td><td>${esc(e.who||"")}</td></tr>`).join("")
          || '<tr><td colspan="5" class="muted">Nothing in this range.</td></tr>'}</table>${rows.length>1000?'<p class="muted">Showing the first 1,000 - use CSV for all.</p>':""}</div>`;
    } else {
      const [log, th] = await Promise.all([q("lock_climate_log","at,property_id,thermostat_id,temp,mode,heat_sp,cool_sp,action,changed_by",x=>x.in("property_id",ids).gte("at",a).lte("at",b).order("at").limit(10000)),
        q("thermostats","id,name,property_id",x=>x.in("property_id",ids))]);
      const tname = id => ((th.find(x=>x.id===id)||{}).name)||"Thermostat", end = Math.min(Date.now(), new Date(b).getTime());
      const by = {}; log.forEach(r=>{ (by[r.thermostat_id] = by[r.thermostat_id] || []).push(r); });
      const sum = Object.entries(by).map(([tid, rs]) => { let heat = 0, cool = 0;
        rs.forEach((r,i)=>{ const t1 = i+1<rs.length ? new Date(rs[i+1].at).getTime() : end, dur = Math.max(0, t1 - new Date(r.at).getTime());
          if(r.action==="heating") heat += dur; if(r.action==="cooling") cool += dur; });
        const temps = rs.map(r=>r.temp).filter(x=>x!=null).map(Number);
        return { tid, pid: rs[0].property_id, low: temps.length?Math.min(...temps):null, high: temps.length?Math.max(...temps):null, heat: heat/36e5, cool: cool/36e5,
          atStat: rs.filter(r=>r.changed_by==="at the thermostat").length, changes: rs.filter(r=>r.changed_by).length, hasAction: rs.some(r=>r.action) }; })
        .sort((x,y)=>ck(code(x.pid)).localeCompare(ck(code(y.pid)),undefined,{numeric:true}));
      const changes = log.filter(r=>r.changed_by).reverse();
      csv = [["When","Home","Thermostat","Temp °F","Mode","Heat to","AC to","Running","Changed by"], ...log.map(r=>[new Date(r.at).toLocaleString(), code(r.property_id), tname(r.thermostat_id), r.temp, r.mode, r.heat_sp, r.cool_sp, r.action, CLIMATE_BY(r.changed_by)])];
      const hrs = x => x<0.05 ? "0" : x.toFixed(1);
      $("#rout").innerHTML = `<div class="card" style="overflow-x:auto"><b>By thermostat</b><table class="tbl" style="margin-top:6px"><tr><th>Home</th><th>Thermostat</th><th>Low</th><th>High</th><th>Heat ran</th><th>AC ran</th><th>Changed at the thermostat</th></tr>
        ${sum.map(x=>`<tr><td><a href="#/home/${encodeURIComponent(x.pid)}">${esc(code(x.pid))}</a></td><td>${esc(tname(x.tid))}</td><td>${x.low!=null?Math.round(x.low)+"°":"-"}</td><td>${x.high!=null?Math.round(x.high)+"°":"-"}</td>
          <td>${x.hasAction?hrs(x.heat)+" h":'<span class="muted">n/a</span>'}</td><td>${x.hasAction?hrs(x.cool)+" h":'<span class="muted">n/a</span>'}</td><td>${x.atStat}</td></tr>`).join("") || '<tr><td colspan="7" class="muted">No thermostat history in this range yet.</td></tr>'}</table>
        <p class="muted" style="font-size:12.5px;margin:6px 0 0">"Heat ran / AC ran" comes from the thermostat reporting when the furnace or AC is running (hub 1.5.1+). n/a = this thermostat doesn't report it.</p></div>
        <div class="card" style="overflow-x:auto"><b>Setting changes</b><table class="tbl" style="margin-top:6px"><tr><th>When</th><th>Home</th><th>Thermostat</th><th>Mode</th><th>Heat to</th><th>AC to</th><th>Temp then</th><th>Changed by</th></tr>
        ${changes.slice(0,500).map(r=>`<tr><td>${esc(when(r.at))}</td><td>${esc(code(r.property_id))}</td><td>${esc(tname(r.thermostat_id))}</td><td>${esc(r.mode||"")}</td><td>${r.heat_sp!=null?Math.round(r.heat_sp)+"°":""}</td><td>${r.cool_sp!=null?Math.round(r.cool_sp)+"°":""}</td><td>${r.temp!=null?Math.round(r.temp)+"°":""}</td><td>${esc(CLIMATE_BY(r.changed_by))}</td></tr>`).join("")
          || '<tr><td colspan="8" class="muted">No changes in this range.</td></tr>'}</table></div>`;
    } };
  const cya = async (a, b, ids) => {
    const t = ($("#rw").value||"").trim(), tl = t.toLowerCase(), all = !$("#rp").value && !$("#rh").value;
    // a stay report when Who matches a reservation
    let stay = null;
    if(t){ const ss = await q("lock_stays","res_id,property_id,guest,kind,status,starts_at,ends_at,code,code_source,agreement,backup_code,backup_given_at,backup_given_by,backup_used_at,out_at,out_how,created_at",
        x=>x.in("property_id",ids).or(`res_id.eq.${t.replace(/[^\w-]/g,"")},guest.ilike.*${t.replace(/[,()*]/g,"")}*`).order("starts_at",{ascending:false}).limit(1)).catch(()=>[]); stay = ss[0]||null; }
    const A = stay ? new Date(new Date(stay.created_at).getTime()-864e5).toISOString() : a, B = stay ? new Date(new Date(stay.ends_at).getTime()+2*864e5).toISOString() : b;
    const pidList = stay ? [stay.property_id] : ids;
    const [ev, au, al, cl, nt, lk, as] = await Promise.all([
      q("lock_events","at,property_id,lock_id,kind,who,who_kind,who_id,slot,detail",x=>x.in("property_id",pidList).gte("at",A).lte("at",B).order("at").limit(5000)).catch(()=>[]),
      q("lock_audit","at,property_id,tbl,op,ref,who,changes",x=>(all&&!stay ? x : x.in("property_id",pidList)).gte("at",A).lte("at",B).order("at").limit(5000)).catch(()=>[]),
      q("lock_alerts","kind,property_id,lock_id,opened_at,closed_at,detail,bw_task",x=>x.in("property_id",pidList).lte("opened_at",B).or(`closed_at.is.null,closed_at.gte.${A}`).limit(2000)).catch(()=>[]),
      q("lock_climate_log","at,property_id,temp,mode,heat_sp,cool_sp,action,changed_by",x=>x.in("property_id",pidList).gte("at",A).lte("at",B).not("changed_by","is",null).order("at").limit(3000)).catch(()=>[]),
      q("lock_notify","at,property_id,channel,text,sent_at,err",x=>x.in("property_id",pidList).gte("at",A).lte("at",B).limit(2000)).catch(()=>[]),
      q("locks","id,name,property_id",x=>x.in("property_id",pidList)).catch(()=>[]),
      stay ? q("lock_assign","lock_id,ref_kind,ref_id,slot,code,state,created_at,set_at,verified_at,cleared_at",x=>x.eq("ref_id",stay.res_id).in("ref_kind",["stay","backup"])).catch(()=>[]) : Promise.resolve([])]);
    const door = id => ((lk.find(l=>l.id===id)||{}).name)||"", R = [];
    const add = (at, pid, cat, what, who) => { if(at) R.push({at, pid, cat, what, who: who||""}); };
    const words = e => ({unlock_code:"Opened with a code", unlock_phone:"Opened with the guest's phone key", unlock_remote:"Unlocked from the app", unlock_manual:"Unlocked from inside",
      lock_keypad:"Locked from outside (left)", lock_manual:"Locked from inside", lock_remote:"Locked from the app", lock_auto:"Auto-locked", jammed:"Lock JAMMED",
      code_set:"Code put on the lock", code_cleared:"Code taken off the lock", code_failed:"Code FAILED to go on the lock", guest_arrived:"Guest arrived (first use of their code)",
      guest_out:"Guest left / ready to clean", guest_opened_link:"Guest opened their link", backup_given:"BACKUP code shown to the office", hub_online:"Hub back online", hub_offline:"Hub OFFLINE",
      remote_unlock_sent:"Remote unlock sent", remote_lock_sent:"Remote lock sent", master_made:"Master code made", keybox_spot:"Key box recorded", heat_test_pass:"Heat test passed", heat_test_fail:"Heat test FAILED", tamper:"Sensor pulled off / opened up", leak:"WATER detected", leak_clear:"Leak sensor dry again"}[e.kind] || e.kind.replace(/_/g," "));
    ev.forEach(e => { if(tl && !stay && !String(e.who||"").toLowerCase().includes(tl)) return;
      if(stay && e.who_id && e.who_id!==stay.res_id && /guest|stay|backup/.test(e.who_kind||"")) return;
      const extra = e.kind==="guest_opened_link" ? ((e.detail||{}).code_shown ? " - code was showing" : " - code NOT showing yet"+((e.detail||{}).held_for?" (waiting on the agreement)":"")) : e.kind==="backup_given" ? " by "+((e.detail||{}).by||"") : "";
      add(e.at, e.property_id, /code_|backup/.test(e.kind) ? "Codes" : /guest_/.test(e.kind) ? "Guest" : /hub_/.test(e.kind) ? "System" : "Door", words(e)+(e.lock_id?" - "+door(e.lock_id):(e.detail||{}).sensor?" - "+(e.detail||{}).sensor:"")+extra, e.who); });
    const lbl = {lock_stays:"Stay", lock_staff_codes:"Access code", lock_homes:"Home settings", locks:"Lock", lock_settings:"Company setting", lock_commands:"Command", property_access:"Guest info"};
    au.forEach(x => { if(stay && x.tbl!=="lock_stays" && x.tbl!=="lock_homes" && x.tbl!=="locks") return; if(stay && x.tbl==="lock_stays" && x.ref!==stay.res_id) return;
      if(tl && !stay && !(String(x.who).toLowerCase().includes(tl) || JSON.stringify(x.changes).toLowerCase().includes(tl))) return;
      const ch = Object.entries(x.changes||{}).map(([k,[o,n]]) => x.op==="insert" ? `${k}: ${n==null?"-":typeof n==="object"?JSON.stringify(n):n}` : `${k}: ${o==null?"-":typeof o==="object"?JSON.stringify(o):o} → ${n==null?"-":typeof n==="object"?JSON.stringify(n):n}`).join("; ");
      add(x.at, x.property_id, "Office / system change", `${lbl[x.tbl]||x.tbl} ${x.op==="insert"?"created":"changed"} (${x.ref}) - ${ch}`, x.who); });
    al.forEach(x => { add(x.opened_at, x.property_id, "Alert", "Alert opened: "+(x.detail||x.kind)+(x.bw_task?" (Breezeway task made)":""), "system");
      if(x.closed_at) add(x.closed_at, x.property_id, "Alert", "Alert closed: "+(x.detail||x.kind), "system"); });
    cl.forEach(x => add(x.at, x.property_id, "Heat / AC", `Thermostat set: ${x.mode||""} heat ${x.heat_sp??"-"}° / AC ${x.cool_sp??"-"}° (temp then ${x.temp!=null?Math.round(x.temp)+"°":"?"})`, CLIMATE_BY(x.changed_by)));
    nt.forEach(x => add(x.sent_at||x.at, x.property_id, "Slack", `${x.sent_at?"Sent":"NOT sent"} to #${x.channel}: ${x.text}${x.err?" ("+x.err+")":""}`, "system"));
    as.forEach(x => { add(x.verified_at, stay.property_id, "Codes", `${x.ref_kind==="backup"?"Backup":"Guest"} code ${x.code} CONFIRMED on ${door(x.lock_id)} (slot ${x.slot})`, "lock");
      if(x.cleared_at) add(x.cleared_at, stay.property_id, "Codes", `${x.ref_kind==="backup"?"Backup":"Guest"} code taken off ${door(x.lock_id)}`, "lock"); });
    R.sort((x,y)=>new Date(x.at)-new Date(y.at));
    csv = [["When","Home","Type","What happened","Who"], ...R.map(r=>[new Date(r.at).toLocaleString(), code(r.pid), r.cat, r.what, r.who])];
    let head = "";
    if(stay){ const vs = as.filter(x=>x.ref_kind==="stay" && x.verified_at).map(x=>new Date(x.verified_at)), first = vs.length ? new Date(Math.min(...vs)) : null;
      const opened = ev.find(e=>e.kind==="guest_opened_link" && e.who_id===stay.res_id), inn = ev.find(e=>(e.kind==="guest_arrived") && e.who_id===stay.res_id);
      const temps = (await q("lock_climate_log","temp",x=>x.eq("property_id",stay.property_id).gte("at",stay.starts_at).lte("at",stay.ends_at).limit(5000)).catch(()=>[])).map(r=>+r.temp).filter(x=>!isNaN(x));
      const line = (k,v,bad) => `<div class="row" style="padding:4px 0;border-top:1px solid var(--line)"><span class="grow muted">${k}</span><b style="${bad?"color:var(--red)":""}">${v}</b></div>`;
      head = `<div class="card"><b style="font-size:17px">Stay report - ${esc(stay.guest||"Guest")} · ${esc(code(stay.property_id))} · #${esc(stay.res_id)}</b>
        ${line("Stay", esc(when(stay.starts_at))+" → "+esc(when(stay.ends_at))+" ("+esc(stay.status)+")")}
        ${line("Guest code", esc(stay.code)+" ("+esc(stay.code_source)+")")}
        ${line("Rental agreement", esc(stay.agreement||"not sent"), !["received","not-needed"].includes(stay.agreement) && stay.kind==="guest")}
        ${line("Code confirmed on the lock", first ? esc(when(first))+(first < new Date(stay.starts_at) ? " ✓ before check-in" : " - AFTER check-in") : "never confirmed", !first || first >= new Date(stay.starts_at))}
        ${line("Backup code", stay.backup_code ? esc(stay.backup_code)+(as.some(x=>x.ref_kind==="backup"&&x.verified_at)?" (on the lock)":"")+(stay.backup_given_at?" · shown to "+esc(stay.backup_given_by||"office")+" "+esc(when(stay.backup_given_at)):"")+(stay.backup_used_at?" · USED "+esc(when(stay.backup_used_at)):"") : "-")}
        ${line("Guest opened their link", opened ? esc(when(opened.at)) : "not seen")}
        ${line("First entry", inn ? esc(when(inn.at)) : "no code entry recorded")}
        ${line("Left", stay.out_at ? esc(when(stay.out_at))+" ("+esc(stay.out_how||"")+")" : "-")}
        ${line("Inside temperature during the stay", temps.length ? Math.round(Math.min(...temps))+"° - "+Math.round(Math.max(...temps))+"°" : "no readings")}</div>`; }
    $("#rout").innerHTML = head + `<div class="card" style="overflow-x:auto"><table class="tbl"><tr><th>When</th><th>Home</th><th>Type</th><th>What happened</th><th>Who</th></tr>
      ${R.slice(-2000).reverse().map(r=>`<tr><td style="white-space:nowrap">${esc(when(r.at))}</td><td>${esc(code(r.pid))}</td><td>${esc(r.cat)}</td><td>${esc(r.what)}</td><td>${esc(r.who)}</td></tr>`).join("") || '<tr><td colspan="5" class="muted">Nothing in this range.</td></tr>'}</table>
      ${R.length>2000?'<p class="muted">Showing the latest 2,000 - use CSV for all.</p>':""}</div>`;
  };
  $("#rgo").onclick = run; $("#rp").onchange = run; $("#rf").onchange = run; $("#rt").onchange = run;
  if($("#rk")) $("#rk").onchange = run;
  if($("#rw")){ let tm; $("#rw").oninput = () => { clearTimeout(tm); tm = setTimeout(run, 300); }; }
  if($("#rprint")) $("#rprint").onclick = () => window.print();
  $("#rcsv").onclick = () => { if(!csv.length) return toast("Press Show first"); csvDownload(`moose-${tab==="entries"?"entries":tab==="cya"?"cya-log":"heating-cooling"}-${$("#rf").value}-to-${$("#rt").value}.csv`, csv); };
  run();
}
async function scoreView(){
  if(!S.homes.length) await loadBase();
  const [s] = await q("lock_scorecard","*");
  const ages = await q("locks","property_id,name,model,installed_on,replace_years,last_battery_change",x=>x.eq("active",true).order("installed_on"));
  const row = (k,v) => `<tr><td>${k}</td><td><b>${v??"-"}</b></td></tr>`;
  shell("score", `<h2>Scorecard (last 60 days)</h2><div class="card"><h3 style="margin-top:0">Ours</h3><table>
    ${row("Homes",s&&s.homes)}${row("Arrivals",s&&s.arrivals_60d)}${row("Code on the lock before check-in",s?`${s.code_ready_on_time} (${s.pct_ready_on_time??"-"}%)`:"-")}
    ${row("Hub offline alerts",s&&s.hub_offline_alerts_60d)}${row("Hours hubs were offline",s&&s.hub_offline_hours_60d)}${row("Lock offline alerts",s&&s.lock_offline_alerts_60d)}
    ${row("Keypad unlocks",s&&s.code_unlocks_60d)}${row("Phone-key taps",s&&s.phone_key_taps_60d)}</table></div>
    <div class="card"><h3 style="margin-top:0">Lock ages</h3><table><tr><th>Home</th><th>Door</th><th>Age</th><th>Replace by</th></tr>
    ${ages.map(l=>{ const by = l.installed_on? new Date(new Date(l.installed_on+"T12:00:00").setFullYear(+l.installed_on.slice(0,4)+l.replace_years)) : null;
      const soon = by && by - Date.now() < 90*864e5;
      return `<tr><td>${esc((S.props[l.property_id]||{}).code||"")}</td><td>${esc(l.name)}</td><td>${l.installed_on?ageTxt(l.installed_on):"?"}</td>
        <td>${by?`<span class="pill ${soon?"red":"grey"}">${by.toLocaleDateString(undefined,{month:"short",year:"numeric"})}</span>`:"set install date"}</td></tr>`; }).join("")}</table></div>
    <p class="muted">Lynx and Brivo columns come next: same measures, from their alerts and "can't get in" tickets per home.</p>
    ${await updatesCard()}`);
  wireUpdates();
}
async function updatesCard(){
  const [set, ups, hubs] = await Promise.all([
    q("lock_settings","key,value",x=>x.in("key",["auto_update","update_canary","update_wait_hours"])),
    q("lock_updates","hub_id,kind,title,entity,to_ver,started_at,done_at,ok,err",x=>x.order("id",{ascending:false}).limit(300)),
    q("lock_hubs","id,property_id",x=>x.eq("active",true))]);
  const v = Object.fromEntries(set.map(r=>[r.key,r.value])), on = (v.auto_update||"on")==="on", admin = S.me.role==="admin";
  const home = id => esc((S.props[(hubs.find(b=>b.id===id)||{}).property_id]||{}).code||"?");
  const open = ups.filter(u=>!u.done_at), bad = ups.filter(u=>u.ok===false && Date.now()-new Date(u.done_at) < 7*864e5);
  const done = ups.filter(u=>u.ok && Date.now()-new Date(u.done_at) < 30*864e5);
  return `<div class="card"><h3 style="margin-top:0">Hub updates</h3>
    <div class="row"><div class="grow"><b>Automatic updates ${on?"on":"off"}</b><div class="muted" style="font-size:12.5px">Home Assistant, hub system and add-ons install 2–5 am when nobody is in or arriving within 6 h.
      ${esc(v.update_canary||"BHL 1206")} goes first; the rest follow ${v.update_wait_hours||72} h later if it ran fine. A version that fails anywhere is skipped everywhere. Lock/thermostat firmware is never automatic.</div></div>
      ${admin?`<button class="btn small ${on?"":"go"}" id="u_toggle">${on?"Turn off":"Turn on"}</button>`:""}</div>
    <table style="margin-top:10px"><tr><th>Home</th><th>Update</th><th></th></tr>
      ${[...open, ...bad].map(u=>`<tr><td>${home(u.hub_id)}</td><td>${esc(u.title||u.entity)} <b>${esc(u.to_ver)}</b></td>
        <td style="text-align:right">${u.ok===false?`<span class="pill red" title="${esc(u.err||"")}">Failed</span>`:u.started_at?'<span class="pill amber">Installing</span>':UPD_AUTO.includes(u.kind)?'<span class="pill grey">Waiting</span>':'<span class="pill grey">Firmware</span>'}</td></tr>`).join("")
        || '<tr><td colspan="3" class="muted">Every hub is up to date.</td></tr>'}
    </table><p class="muted" style="font-size:12.5px">${done.length} update${done.length===1?"":"s"} installed in the last 30 days.</p></div>`;
}
function wireUpdates(){
  const b = $("#u_toggle"); if(!b) return;
  b.onclick = async () => { const on = b.textContent.includes("on"); try{ await rpc("lock_update_settings",{p_auto:on}); toast(on?"Automatic updates on":"Automatic updates off"); route(); }catch(e){ fail(e); } };
}

/* ------------------------------------------------ router */
async function route(){
  clearTimeout(S.timer);
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return loginView();
  if(!S.me){ const me = (await sb.rpc("my_desk_identity")).data; S.me = me && me[0]; }
  if(!S.me || !["admin","tech"].includes(S.me.role)) return shell("homes","<p>Lock setup is for the maintenance crew. Ask Brandon to add you.</p>");
  const h = location.hash.replace(/^#\/?/,"");
  try{
    if(h.startsWith("home/")) await homeView(decodeURIComponent(h.slice(5)));
    else if(h.startsWith("install/")) await installHome(decodeURIComponent(h.slice(8)));
    else if(h==="install") await installView();
    else if(h==="codes" && DESK) await codesView();
    else if(h==="stays" && DESK) await staysView();
    else if(h==="alerts") await alertsView();
    else if(h==="score" && DESK) await scoreView();
    else if(h==="reports" && DESK) await reportsView();
    else if(h==="account") await accountView();
    else if(h==="rules" && DESK) await rulesView();
    else await homesView();
  }catch(e){ fail(e, "Couldn't load"); }
  if(h.startsWith("home/") || h==="" || h.startsWith("install/")) S.timer = setTimeout(()=>{ if(!S.dirty && !document.querySelector("input:focus,details[open]:not(.guide):not(.sect)")) route(); }, h.startsWith("install/") || h.startsWith("home/") ? 15000 : 30000);
}
window.addEventListener("hashchange", route);
sb.auth.onAuthStateChange(ev => { if(ev==="SIGNED_IN"||ev==="SIGNED_OUT") route(); });
route();
})();
