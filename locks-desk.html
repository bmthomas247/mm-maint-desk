<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3c5f12">
<title>Moose Locks</title>
<link rel="icon" href="moose-logo.png">
<link rel="apple-touch-icon" href="moose-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --moose:#88B535; --moose-2:#A6CE39; --moose-ink:#2f4710; --moose-soft:#eef5e0;
  --forest:#3c5f12; --forest-2:#5b8a1e; --pine:#4f7a18; --pine-soft:#eaf3da;
  --ground:#f5f7f0; --card:#ffffff; --ink:#15201a; --ink-2:#3d4a42; --muted:#6b776f; --line:#e1e7de; --line-2:#cfd8cb;
  --red:#c8382b; --red-soft:#fbe7e4; --amber:#b5770a; --amber-soft:#fbf0d9; --blue:#2463a0; --blue-soft:#e3edf8;
  --radius:18px; --tap:48px; --shadow:0 1px 2px rgba(20,40,25,.06), 0 4px 14px rgba(20,40,25,.06);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-feature-settings:"tnum" 1;
  color:var(--ink); background:var(--ground);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --pine-soft:#173026; --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d;
  --shadow:0 1px 2px rgba(0,0,0,.3); } }
:root[data-theme="dark"]{ --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --pine-soft:#173026; --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d; --shadow:0 1px 2px rgba(0,0,0,.3); }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
a{color:var(--pine)}
/* header */
header.top{position:sticky;top:0;z-index:6;color:#fff;background:linear-gradient(135deg,var(--forest),var(--forest-2));
  padding:14px 16px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 2px 12px rgba(10,30,20,.18)}
.top .bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top .mark{width:38px;height:38px;border-radius:12px;background:var(--moose);display:grid;place-items:center;flex:none}
.top .mark svg{width:22px;height:22px;color:#16220a}
.logo{position:relative;width:46px;height:46px;flex:none}
.logo img{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 2px 8px rgba(0,0,0,.25);display:block}
.logo .lk{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--moose);display:grid;place-items:center;box-shadow:0 0 0 2px var(--forest)}
.logo .lk svg{width:11px;height:11px;color:#16220a}
.login .logo{width:84px;height:84px;margin:0 auto 12px}.login .logo img{width:84px;height:84px}
.login .logo .lk{width:28px;height:28px;box-shadow:0 0 0 3px #fff}.login .logo .lk svg{width:15px;height:15px}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.top .sub{font-size:13px;opacity:.75;font-weight:600}
.top .grow{flex:1;min-width:0}
.top .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;text-decoration:none}
.top .iconbtn svg{width:20px;height:20px}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:4px 0 12px;font-weight:800;letter-spacing:-.02em}
h3{font-size:13px;margin:22px 2px 10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
b,strong{font-weight:800}
/* chips */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;background:var(--pine-soft);color:var(--pine);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.pill.plain::before{display:none}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--moose-soft);color:var(--moose-ink)} .pill.grey{background:var(--line);color:var(--ink-2)}
@media (prefers-color-scheme: dark){ .pill{color:#c5e38a} }
/* buttons */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:14px;min-height:var(--tap);padding:0 16px;
  font:inherit;font-weight:800;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .05s, filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--forest-2);border-color:var(--forest-2);color:#fff}
.btn.go{background:var(--moose);border-color:var(--moose);color:#16220a}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.small{min-height:36px;font-size:13.5px;padding:0 12px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
/* forms */
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:700}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:var(--tap);border:1px solid var(--line-2);border-radius:13px;padding:10px 13px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--moose-soft);border-color:var(--moose)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--forest-2)}
.big{font-size:28px;letter-spacing:5px;font-weight:800;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.list>div{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--card);user-select:none}
.chip.on{background:var(--forest-2);color:#fff;border-color:var(--forest-2)}
details summary{cursor:pointer;font-weight:800;padding:4px 0;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
details[open] summary{margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:9px 4px;border-top:1px solid var(--line);text-align:left} th{color:var(--muted);font-weight:700}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}
.stat.warn .n{color:var(--red)}
/* home cards */
.home{display:block;text-decoration:none;color:inherit;position:relative;overflow:hidden;padding-left:20px}
.home::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line-2)}
.home.ok::before{background:var(--moose)} .home.bad::before{background:var(--red)} .home.todo::before{background:var(--amber)}
.home .code{font-size:20px;font-weight:800;letter-spacing:-.01em}
.home .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.batt{display:inline-block;width:22px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.batt i{position:absolute;left:1px;top:1px;bottom:1px;border-radius:1px;background:var(--moose)}
.batt.low i{background:var(--red)}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--moose),var(--moose-2));border-radius:99px}
/* doors */
.door .state{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--moose-soft);color:var(--moose-ink)}
.door .state.open{background:var(--amber-soft);color:var(--amber)} .door .state.off{background:var(--red-soft);color:var(--red)}
.door .state svg{width:24px;height:24px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.temp{font-size:34px;font-weight:800;letter-spacing:-.03em}
/* install stepper */
.step{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:4px}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--ink-2);display:grid;place-items:center;font-weight:800;font-size:14px}
.step.done .n{background:var(--moose);color:#16220a}
.step.now .n{background:var(--forest-2);color:#fff;box-shadow:0 0 0 4px var(--pine-soft)}
.step .t{font-weight:800}
.step.done .t{color:var(--muted)}
.step .body{margin-top:8px}
.who{font-size:12px;color:var(--muted);font-weight:700}
.check{display:flex;gap:10px;align-items:center;padding:6px 0;font-weight:600}
.syncbar{display:flex;align-items:center;gap:12px}
.syncbar .ic{width:40px;height:40px;border-radius:12px;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center;flex:none}
.syncbar .ic svg{width:20px;height:20px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;padding:4px 4px env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:800;position:relative;border-radius:12px}
nav.tabs a.on{color:var(--forest-2)}
nav.tabs a.on svg{background:var(--moose-soft);border-radius:10px}
nav.tabs svg{width:42px;height:28px;padding:3px 9px}
nav.tabs .badge{position:absolute;top:3px;left:calc(50% + 8px);background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
@media (prefers-color-scheme: dark){ nav.tabs a.on{color:var(--moose)} }
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:14px;font-weight:800;z-index:20;max-width:90vw;box-shadow:var(--shadow)}
.login{max-width:420px;margin:60px auto;padding:0 16px;text-align:center}
.login .mark{width:64px;height:64px;border-radius:20px;background:var(--moose);display:grid;place-items:center;margin:0 auto 10px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
/* ---- office desk version (locks-desk.html): wide, tabs on top, codes + stays */
body.desk{padding-bottom:30px}
.desk .top .bar,.desk main{max-width:1240px}
.desk nav.tabs{position:sticky;top:76px;bottom:auto;z-index:5;max-width:none;margin:0;border:0;border-bottom:1px solid var(--line);background:var(--ground);backdrop-filter:none;gap:6px;padding:12px max(16px,calc((100vw - 1240px)/2 + 16px));flex-wrap:wrap}
.desk nav.tabs a{flex:none;flex-direction:row;gap:8px;padding:9px 16px 9px 10px;font-size:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.desk nav.tabs a.on{background:var(--forest-2);color:#fff;border-color:var(--forest-2)}
.desk nav.tabs a.on svg{background:transparent}
.desk nav.tabs svg{width:22px;height:22px;padding:0}
.desk nav.tabs .badge{position:static;margin-left:2px}
.desk .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.desk .tile-grid>.card{margin:0}
.desk .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.desk .stats{grid-template-columns:repeat(4,1fr)}
.desk .toast{bottom:30px}
@media (max-width:900px){ .desk .cols{grid-template-columns:1fr} }
.tbl td,.tbl th{padding:10px 8px}.tbl tr:hover td{background:var(--ground)}
.code-chip{font-weight:800;letter-spacing:2px;font-size:16px}
details.sect{margin:18px 0 6px} details.sect>summary{padding:6px 2px;border-bottom:1px solid var(--line);margin-bottom:10px} details.sect>summary h3{display:inline}
.reveal{cursor:pointer;border:1px dashed var(--line-2);border-radius:9px;padding:3px 9px;font-weight:800;color:var(--ink-2);background:var(--ground)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
const C = window.MM_CONFIG;
const sb = supabase.createClient(C.url, C.anonKey, { auth:{ persistSession:true, detectSessionInUrl:true, flowType:"implicit" } });
const app = document.getElementById("app");
const S = { me:null, homes:[], props:{}, timer:null };
// Two versions of one page: locks.html = field (phone, no code lists) · locks-desk.html = office desk (codes, stays, scorecard)
const DESK = /locks-desk\.html$/.test(location.pathname) || window.LOCKS_DESK === true;
if(DESK) document.body.classList.add("desk");
const SELF = DESK ? "locks-desk.html" : "locks.html";
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOOR_NAMES = ["Front door","Garage door","Side door","Back door","Lockoff door","Owner closet"];
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function fail(e,w){ console.error(e); toast((w||"Didn't work")+": "+(e&&e.message||e)); }
function ago(ts){ if(!ts) return "never"; const m=(Date.now()-new Date(ts))/6e4; if(m<1) return "just now"; if(m<60) return Math.round(m)+" min ago"; if(m<1440) return Math.round(m/60)+" h ago"; return Math.round(m/1440)+" d ago"; }
function when(ts){ return ts? new Date(ts).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : ""; }
function ageTxt(d){ const y=(Date.now()-new Date(d+"T12:00:00"))/3.156e10; return y<1? Math.max(1,Math.round(y*12))+" mo" : y.toFixed(1)+" yr"; }
const online = h => h && h.last_seen && (Date.now()-new Date(h.last_seen)) < 10*6e4;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function rpc(fn, args){ const { data, error } = await sb.rpc(fn, args); if(error) throw error; return data; }
async function q(table, sel, f){ let x = sb.from(table).select(sel); if(f) x = f(x); const { data, error } = await x; if(error) throw error; return data||[]; }
async function wake(hubId){ try{ await fetch(C.url+"/realtime/v1/api/broadcast",{method:"POST",headers:{"content-type":"application/json",apikey:C.anonKey,authorization:"Bearer "+((await sb.auth.getSession()).data.session||{}).access_token},body:JSON.stringify({messages:[{topic:"hub-"+hubId,event:"wake",payload:{}}]})}); }catch(e){} }
/* "Sync with Track now": the ThinkStation picks it up within a minute (new last-minute booking, code change...) */
async function syncBar(){
  const rows = await q("lock_settings","key,value",x=>x.in("key",["sync_last_run","sync_requested_at"]));
  const v = Object.fromEntries(rows.map(r=>[r.key,r.value]));
  const waiting = v.sync_requested_at && (!v.sync_last_run || new Date(v.sync_requested_at) > new Date(v.sync_last_run));
  return `<div class="card syncbar"><div class="ic">${ICON.sync}</div><div class="grow"><b>Track sync</b><div class="muted">${waiting?"Running within a minute…":"Last synced "+ago(v.sync_last_run)}</div></div>
    <button class="btn go small" id="syncnow" ${waiting?"disabled":""}>Sync now</button></div>`;
}
function wireSync(){
  const b = $("#syncnow"); if(!b) return;
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Asked…";
    try{
      const asked = new Date(await rpc("lock_request_sync"));
      toast("Syncing with Track - about a minute");
      for(let i=0;i<60;i++){ await sleep(5000);
        const r = (await q("lock_settings","value",x=>x.eq("key","sync_last_run")))[0];
        if(r && new Date(r.value) >= asked){ toast("Synced with Track ✓ - codes and Door Codes are updated"); return route(); } }
      toast("Still running - the ThinkStation may be off. Check it.");
    }catch(e){ fail(e); }
    b.disabled = false; b.textContent = "Sync with Track now";
  };
}
// Field page: no codes at all (guest, crew, vendor). Codes live on the office desk version.
function stayCode(s){
  if(DESK) return `<div class="big" style="font-size:20px">${esc(s.code)}</div>`;
  return "";     // guest codes live on the office desk only
}
/* whole-home controls: every door at once, every thermostat at once */
const bars = rssi => rssi==null || rssi===127 ? "" : (() => { const n = rssi >= -65 ? 4 : rssi >= -75 ? 3 : rssi >= -85 ? 2 : 1, c = n>=3 ? "var(--moose)" : n===2 ? "var(--amber)" : "var(--red)";
  return `<span title="Signal ${rssi} dBm" style="display:inline-flex;gap:1.5px;align-items:flex-end;vertical-align:middle">${[1,2,3,4].map(i=>`<i style="width:3px;height:${3+i*2.5}px;border-radius:1px;background:${i<=n?c:"var(--line-2)"}"></i>`).join("")}</span>`; })();
async function allDoors(ls, act, code){
  if(!ls.length) return toast("No doors paired here yet");
  if(act==="unlock" && !confirm(`Unlock all ${ls.length} door${ls.length>1?"s":""} at ${code}? Only do this when someone is there or about to be.`)) return;
  toast((act==="lock"?"Locking ":"Unlocking ") + ls.length + " door" + (ls.length>1?"s":"") + "…");
  const ids = await Promise.all(ls.map(l => command(l.hub_id, l.id, act)));
  const res = await Promise.all(ids.map(id => waitCmd(id, 40)));
  const ok = res.filter(r => r && r.ok).length, bad = ls.filter((l,i) => !(res[i] && res[i].ok)).map(l=>l.name);
  toast(ok === ls.length ? (act==="lock" ? "All doors locked ✓" : "All doors unlocked ✓") : `${ok} of ${ls.length} done - no answer from ${bad.join(", ")}`);
}
async function setHomeTemp(ts, mode, heat, cool){
  if(!ts.length) return toast("No thermostats paired here yet");
  const hubsSeen = new Set();
  for(const t of ts){ await rpc("lock_climate",{p_thermostat:t.id,p_mode:mode,p_heat:heat,p_cool:cool}); if(t.hub_id) hubsSeen.add(t.hub_id); }
  hubsSeen.forEach(h=>wake(h));
  toast(`Sent to ${ts.length} thermostat${ts.length>1?"s":""} ✓ (the home's limits still apply)`);
}
/* stays: Track links + what the lock pill means */
const TRACK = "https://moosemanagement.trackhs.com";
const folioLink = s => `<a class="btn small" href="${TRACK}/pms/guest-folio/view/?id=${encodeURIComponent(s.res_id)}" target="_blank" rel="noopener" title="Open this stay's folio in Track">Folio ↗</a>`;
const resLink = s => `${TRACK}/pms/reservations/view/${encodeURIComponent(s.res_id)}`;
function stayPill(s, state, home){
  const pre = (home && home.preload_days) || 3, goes = new Date(new Date(s.starts_at) - pre*864e5);
  if(state==="on") return `<span class="pill green" title="The code is on the door now. It works from 1 hour before check-in to 1 hour after check-out.">on lock</span>`;
  if(s.kind==="guest" && !["received","not-needed"].includes(s.agreement)) return `<span class="pill red" title="The code goes on the door once the rental agreement is back in Track (now: ${esc(s.agreement||"not sent")}).">needs agreement</span>`;
  if(goes > Date.now()) return `<span class="pill grey" title="The code goes on the door on ${goes.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})} (${pre} days before check-in). The door only accepts it from 1 hour before check-in.">on ${goes.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span>`;
  return `<span class="pill amber" title="The hub is putting the code on the door now.">sending</span>`;
}

async function loadBase(){
  const homes = await q("lock_homes","*,properties(id,code,name,address,area,bw_home_id)");
  S.homes = homes.filter(h=>h.properties).sort((a,b)=>a.properties.code.localeCompare(b.properties.code));
  S.props = Object.fromEntries(S.homes.map(h=>[h.property_id,h.properties]));
  const al = await q("lock_alerts","id,property_id",x=>x.is("closed_at",null));
  const ours = new Set(S.homes.filter(h=>h.section==="ours").map(h=>h.property_id));
  S.alertCount = al.filter(a=>ours.has(a.property_id)).length;
}
/* neighborhoods (office desk): Track area code (RJ, BHV...) + the name the homes share ("Retreat at Jordanelle") */
const hoodOf = h => (h.properties && (h.properties.area || (h.properties.code||"").split(" ")[0])) || "Other";
function hoodName(area){
  const names = S.homes.filter(h=>hoodOf(h)===area).map(h=>String(h.properties.name||"")
    .replace(/\s*\(.*\)\s*$/,"").replace(/\s+PF$/i,"").replace(/\s+(unit\s+)?#?[\w-]*\d[\w-]*$/i,"").trim()).filter(Boolean);
  const top = Object.entries(names.reduce((m,n)=>(m[n]=(m[n]||0)+1,m),{})).sort((a,b)=>b[1]-a[1])[0];
  return top ? top[0] : area;
}

function signal(rssi){

  return `<span title="${rssi} dBm" style="display:inline-flex;gap:2px;align-items:flex-end;vertical-align:middle">${[1,2,3,4].map(i=>`<i style="width:4px;height:${4+i*3}px;border-radius:1px;background:${i<=bars?col:"var(--line-2)"}"></i>`).join("")}</span> <span class="muted" style="font-size:12px">${rssi}</span>`;
}

const UPD_AUTO = ["core","os","supervisor","addon"];
function updatesBlock(hub){

  return `<h4 style="margin:14px 0 4px">Updates</h4><table><tr><th>What</th><th>Version</th><th></th></tr>

      <td>${esc(u.from_ver||"?")} → <b>${esc(u.to_ver)}</b></td><td style="text-align:right">${state(u)}</td></tr>`).join("")}</table>
    ${open.some(u=>!UPD_AUTO.includes(u.kind))?'<p class="muted" style="font-size:12.5px">Firmware updates are never automatic. Run them when the home is empty: a lock can take 10–30 min and may need fresh batteries.</p>':""}`;

async function loadUpdates(hub){

    .filter(u => !u.done_at || (u.ok===false && new Date(u.done_at) > wk));

function wireTools(hub, after){
  if(!hub || !$("#tools")) return;
  const out = m => { $("#t_out").textContent = m; };
  const run = async (kind, lock, args, label) => {
    out(label + "…");
    try{ const r = await waitCmd(await command(hub.id, lock, kind, args||{}), kind==="include"||kind==="exclude" ? 300 : 40);
      out(r ? ((r.ok?"✓ ":"✗ ") + ((r.result||{}).msg || (r.ok?"done":"failed"))) : "No answer from the hub yet."); if(after) setTimeout(after, 1500);
    }catch(e){ fail(e); } };
  $$("[data-ping]").forEach(b=>b.onclick=()=>run("ping", null, {node:+b.dataset.ping}, "Pinging node "+b.dataset.ping));
  $("#t_heal").onclick = () => { if(confirm("Rebuild Z-Wave routes? Takes a few minutes; locks keep working.")) run("heal", null, {}, "Rebuilding routes"); };
  $("#t_add").onclick = () => run("include", null, {}, "Add mode on for 5 minutes - put the device in join mode");
  $("#t_remove").onclick = () => run("exclude", null, {}, "Remove mode on for 5 minutes - put the device in remove mode");
  $$("[data-upd]").forEach(b=>b.onclick=()=>{ if(confirm("Start this update now? Only do this when the home is empty.")) run("update", null, {entity:b.dataset.upd, to:b.dataset.to}, "Starting update"); });
  $("#t_restart").onclick = () => { if(confirm("Restart the hub? It's back in about a minute; codes keep working on the locks.")) run("restart", null, {}, "Restarting"); };
}

const STEPS = [
  {k:"prep",   t:"Before you go",            auto:null},
  {k:"hub",    t:"Plug in the hub",          auto:"hub"},
  {k:"brivo",  t:"Take the locks off Brivo", auto:null},
  {k:"locks",  t:"Pair and name each door",  auto:"locks"},
  {k:"climate",t:"Pair thermostats & sensors",auto:null},
  {k:"test",   t:"Test every door",          auto:"test"},
  {k:"wipe",   t:"Clear old Brivo codes",    auto:"wipe"},
  {k:"guest",  t:"Check what guests see",    auto:"guest"},
  {k:"track",  t:"Switch Track off Brivo",   auto:null},
];
function installProgress(h, facts){
  const st = h.install || {};
  const done = STEPS.filter(s => st[s.k] || (facts && facts[s.k])).length;
  return { done: h.installed_at ? STEPS.length : done, total: STEPS.length };
}

        <div class="grid2" style="margin-top:8px"><button class="btn" data-act="test">Test code</button><button class="btn" data-act="wipe">Clear old codes</button></div>
        <button class="btn danger wide" style="margin-top:8px" data-act="remove">Remove from hub</button>
      </details>
      <details><summary>Codes on this lock (${as.filter(a=>a.state==="verified").length} confirmed)</summary><div class="list">
        ${as.map(a=>`<div><span class="grow">${esc(a.label||a.ref_id)} <span class="muted">slot ${a.slot}</span></span>
          <span class="pill ${a.state==="verified"?"green":a.state==="failed"?"red":"amber"}">${a.state==="verified"?"✓ on lock":a.state==="clearing"?"removing":a.state==="failed"?"retrying":"sending"}</span></div>`).join("")||'<div class="muted">None yet</div>'}
      </div></details></div>`;
  };
  const thermoCard = t => `<div class="card" data-th="${t.id}">
    <div class="row"><div class="grow"><b>${esc(t.name)}</b><div class="muted">${esc(t.model||"")} ${t.managed?"":"· not managed"}</div></div>
      <div class="temp">${t.temp!=null?Math.round(t.temp)+"°":"?"}</div></div>
    <div class="muted">${esc(t.mode||"?")} · heat ${t.heat_sp!=null?Math.round(t.heat_sp)+"°":"-"} · cool ${t.cool_sp!=null?Math.round(t.cool_sp)+"°":"-"}</div>
    <div class="chips" style="margin-top:6px"><span class="pill grey plain">${signal(t.rssi)}</span>${t.battery!=null?`<span class="pill ${t.battery<=30?"red":"grey"}">🔋 ${t.battery}%</span>`:'<span class="pill grey plain">wired power</span>'}${t.online===false?'<span class="pill red">Not answering</span>':""}</div>
    <details><summary>Change</summary>
      <div class="chips" style="margin:6px 0">${["heat","cool","auto","off"].map(m=>`<span class="chip ${t.mode===m?"on":""}" data-mode="${m}">${m}</span>`).join("")}</div>
      <div class="grid2"><label class="field"><span>Heat to</span><input data-f="heat" inputmode="numeric" value="${t.heat_sp!=null?Math.round(t.heat_sp):""}"></label>
      <label class="field"><span>Cool to</span><input data-f="cool" inputmode="numeric" value="${t.cool_sp!=null?Math.round(t.cool_sp):""}"></label></div>
      <button class="btn primary wide" data-act="set">Send to thermostat</button>
      <label class="field"><span>Name</span><input data-f="name" value="${esc(t.name)}"></label>
      <label class="row"><input type="checkbox" data-f="managed" ${t.managed?"checked":""}> <span>Follow the home's rules (warm-up, set-back, limits)</span></label>
      <button class="btn wide" style="margin-top:8px" data-act="tsave">Save</button></details></div>`;
  const pcode = id => (S.props[id]||{}).code || id;
  const parents = links.filter(x=>x.child_id===pid).map(x=>x.parent_id), kids = links.filter(x=>x.parent_id===pid).map(x=>x.child_id);
  const family = `<details class="card" ${parents.length||kids.length?"open":""}><summary>Parent / child homes</summary>
    ${parents.length?`<p>Part of: <b>${parents.map(pcode).map(esc).join(", ")}</b> <span class="muted">(bookings there get a code on this home's doors; this home's guests get the parent's shared doors)</span></p>`:""}
    ${kids.length?`<p>Units under this home: <b>${kids.map(pcode).map(esc).join(", ")}</b> <span class="muted">(a booking here gets a code on all of them; their guests get this home's shared doors)</span></p>`:""}
    ${!parents.length&&!kids.length?'<p class="muted">Not linked. Use this for combo listings and buildings with a shared entry door.</p>':""}
    ${S.me.role==="admin"?`<div class="grid2"><label class="field"><span>Parent home (code) - this home is part of it</span><input id="par"></label>
      <label class="field"><span>Child unit (code) - part of this home</span><input id="kid"></label></div><button class="btn primary wide" id="lsave">Link</button>`:""}</details>`;
  const rules = `<details class="card"><summary>Rules for this home</summary>
    <div class="grid2">
      <label class="field"><span>Warm to (°F) for arrival</span><input data-r="warm_to" inputmode="numeric" value="${h.warm_to}"></label>

      <label class="field"><span>Arrival AC to (summer)</span><input data-r="cool_to" inputmode="numeric" value="${h.cool_to??""}"></label>
      <label class="field"><span>Limit: heat no higher than</span><input data-r="heat_max" inputmode="numeric" value="${h.heat_max??""}"></label>
      <label class="field"><span>Limit: heat no lower than</span><input data-r="heat_min" inputmode="numeric" value="${h.heat_min??""}"></label>
      <label class="field"><span>Limit: AC no lower than</span><input data-r="cool_min" inputmode="numeric" value="${h.cool_min??""}"></label>
      <label class="field"><span>Alert below (°F)</span><input data-r="too_cold" inputmode="numeric" value="${h.too_cold}"></label>

      <label class="field"><span>After-hours from</span><input type="time" data-r="after_hours_from" value="${String(h.after_hours_from).slice(0,5)}"></label>

  const stayList = `<div class="card"><h3 style="margin-top:0">Next stays</h3>${stays.length?STAY_KEY:""}<div class="list">${stays.map(s=>{

        <div style="text-align:right;display:grid;gap:6px;justify-items:end">${stayCode(s)}${stayPill(s, state, h)}
        <div>${folioLink(s)}${DESK?' <button class="btn small" data-act="link">Guest link</button> <button class="btn small" data-act="code">Change</button>':""}</div></div></div>`;}).join("")||'<div class="muted">No upcoming stays from Track yet.</div>'}</div></div>`;
  const hist = `<details class="card"><summary>History</summary><div class="list">${events.map(e=>`<div><span class="grow">${esc(e.kind.replace(/_/g," "))}${e.who?" · "+esc(e.who):""}${e.lock_id?' <span class="muted">'+esc(lockName(e.lock_id))+'</span>':""}</span><span class="muted">${when(e.at)}</span></div>`).join("")}</div></details>`;

  const bar = await syncBar();
  shell("homes", `<p><a href="#/">← Homes</a></p><h2>${esc(p.code)} <span class="muted" style="font-weight:400">${esc(p.name)}</span></h2>${bar}
    ${alerts.map(a=>`<div class="card" style="border-color:var(--red)"><b style="color:var(--red)">${esc(a.kind.replace(/_/g," "))}</b><div>${esc(a.detail||"")}</div>${a.bw_task&&a.bw_task.startsWith("http")?`<a href="${esc(a.bw_task)}">Breezeway task</a>`:""}</div>`).join("")}
    ${h.section==="ours"? setup : `<div class="card">This home is in the ${h.section==="lynx"?"Lynx":"Brivo"} section. Codes here are handled there.</div>`}
    <div class="${DESK?"cols":""}"><div>
    ${(locks.length||thermos.length) && hub ? `<div class="card" id="whole"><h3 style="margin-top:0">Whole home</h3>
      ${locks.length?`<div class="muted" style="margin-bottom:8px">${locks.length} door${locks.length>1?"s":""} · ${locks.every(l=>l.state==="locked")?"all locked":locks.filter(l=>l.state!=="locked").map(l=>esc(l.name)+" "+esc(l.state||"?")).join(", ")}
        ${locks.some(l=>l.slots_used!=null)?` · codes on the doors: <b>${locks.reduce((n,l)=>n+(l.slots_used||0),0)}</b> of ${locks.reduce((n,l)=>n+(l.slots||0),0)||"?"} spaces`:""}</div>
        <div class="grid2"><button class="btn primary" data-all="lock">${ICON.lock} Lock all doors</button><button class="btn" data-all="unlock">Unlock all doors</button></div>`:""}
      ${thermos.length?`<div class="muted" style="margin:14px 0 6px">${thermos.map(t=>esc(t.name)+" "+(t.temp!=null?Math.round(t.temp)+"°":"?")).join(" · ")}</div>
        <div class="chips" id="wmode">${["heat","cool","off"].map(m=>`<span class="chip ${m==="heat"?"on":""}" data-m="${m}">${m}</span>`).join("")}</div>
        <div class="grid2"><label class="field"><span>Heat to (°F)</span><input id="wheat" inputmode="numeric" value="${(thermos.find(t=>t.heat_sp!=null)||{}).heat_sp!=null?Math.round(thermos.find(t=>t.heat_sp!=null).heat_sp):68}"></label>
          <label class="field"><span>Cool to (°F)</span><input id="wcool" inputmode="numeric" value="${(thermos.find(t=>t.cool_sp!=null)||{}).cool_sp!=null?Math.round(thermos.find(t=>t.cool_sp!=null).cool_sp):""}"></label></div>
        <button class="btn primary wide" id="wset">Set all ${thermos.length} thermostat${thermos.length>1?"s":""}</button>
        <div class="muted" style="font-size:12.5px;margin-top:6px">The home's limits still apply, and the automatic warm-up / set-back takes over again at the next arrival or check-out.</div>`:""}
    </div>`:""}
    ${locks.length?`<h3>Doors</h3>${locks.map(doorCard).join("")}`:""}
    ${thermos.length?`<h3>Thermostats</h3>${thermos.map(thermoCard).join("")}`:""}
    ${sensors.length?`<h3>Sensors</h3><div class="card list">${sensors.map(x=>`<div><span class="grow">${esc(x.name)}</span><span class="pill ${x.state==="wet"?"red":"grey"}">${esc(x.state||"ok")}</span>${x.battery!=null?`<span class="pill grey">🔋 ${x.battery}%</span>`:""}</div>`).join("")}</div>`:""}
    </div><div>${DESK?"<h3>Guests</h3>":""}
    ${stayList}${toolsCard(hub, [...locks.map(l=>({...l,kind:"lock"})), ...thermos.map(t=>({...t,kind:"thermo"})), ...sensors.map(x=>({...x,kind:"sensor"}))])}${DESK?family+rules:""}${hist}
    </div></div>`, p.code, p.name);
  wireTools(hub, null);
  $$("[data-all]").forEach(b => b.onclick = async () => { b.disabled = true; try{ await allDoors(locks.map(l=>({...l, hub_id:l.hub_id||(hub&&hub.id)})), b.dataset.all, p.code); }catch(e){ fail(e); } b.disabled = false; setTimeout(()=>homeView(pid), 2000); });
  let wmode = "heat";
  $$("#wmode .chip").forEach(c => c.onclick = () => { wmode = c.dataset.m; $$("#wmode .chip").forEach(x=>x.classList.toggle("on", x===c)); });
  $("#wset") && ($("#wset").onclick = async () => { const h2 = $("#wheat").value, c2 = $("#wcool").value;
    try{ await setHomeTemp(thermos, wmode, h2?+h2:null, c2?+c2:null); }catch(e){ fail(e); } });
  $("#lsave") && ($("#lsave").onclick = async () => {
    try{ const find = async c => c ? ((await q("properties","id",x=>x.eq("code",c)))[0]||{}).id : null;
      const kid = await find($("#kid").value.trim()), par = await find($("#par").value.trim());
      if(!kid && !par) return toast("Type a home code");
      if(kid) await rpc("lock_home_link",{p_parent:pid,p_child:kid,p_on:true});
      if(par){ await rpc("lock_home_link",{p_parent:par,p_child:pid,p_on:true}); }
      toast("Linked"); loadBase(); homeView(pid); }catch(e){ fail(e); } });

  wireSync();
  // hub
  const find = $("#find"); if(find) find.onclick = async () => {
    try{ const hs = await rpc("lock_find_hubs"); $("#found").innerHTML = hs.length ? hs.map(x=>`<button class="btn primary wide" style="margin-top:8px" data-hub="${x.id}">Add the hub found here (seen ${ago(x.last_seen)})</button>`).join("")
        : '<p class="muted">No new hub on this connection yet. Is the phone on the home\'s Wi-Fi (not cell data)? Give the hub 5 minutes after plugging in.</p>';
      $$("[data-hub]").forEach(b=>b.onclick=async()=>{ try{ await rpc("lock_claim_hub",{p_hub:b.dataset.hub,p_pair:null,p_property:pid,p_name:"Hub "+p.code}); toast("Hub added to "+p.code); homeView(pid);}catch(e){fail(e);} });
    }catch(e){ fail(e); } };
  const claim = $("#claim"); if(claim) claim.onclick = async () => { try{ await rpc("lock_claim_hub",{p_hub:null,p_pair:$("#pc").value.trim(),p_property:pid,p_name:"Hub "+p.code}); toast("Hub added"); homeView(pid);}catch(e){fail(e);} };
  // pairing
  const pair = $("#pair"); if(pair) pair.onclick = async () => {
    const pin = $("#pin").value.trim(); const m = $("#pairmsg");
    pair.disabled = true; m.innerHTML = '<p><b>Pairing is on for 5 minutes.</b> Put the lock or thermostat in join mode now…</p><button class="btn small" id="stop">Stop</button>';
    $("#stop").onclick = () => command(hub.id, null, "stop");
    try{ const id = await command(hub.id, null, "include", pin?{pin}:{}); const r = await waitCmd(id, 300);
      m.innerHTML = r ? (r.ok? '<p class="pill green">Added. Name it below.</p>' : `<p class="pill red">${esc((r.result||{}).msg||"Didn't pair")}</p>`) : '<p class="muted">No answer yet. Check the door list in a minute.</p>';
      setTimeout(()=>homeView(pid), 4000);
    }catch(e){ fail(e); } pair.disabled = false; };
  // wifi
  $("#wsave") && ($("#wsave").onclick = async () => {
    const { error } = await sb.from("property_access").upsert({ property_id:pid, wifi_name:$("#wn").value.trim()||null, wifi_password:$("#wp").value.trim()||null,
      gate_code:$("#gc").value.trim()||null, garage_code:$("#gg").value.trim()||null });
    if(error) return fail(error);
    try{ await rpc("lock_home_rules",{p_property:pid,r:{arrival_note:$("#an").value.trim()}}); toast("Saved"); }catch(e){ fail(e); } });
  // doors
  $$("[data-lock]").forEach(card => { const id = card.dataset.lock, l = locks.find(x=>x.id===id);
    $$(".chip[data-name]", card).forEach(c=>c.onclick=()=>{ $('[data-f="name"]',card).value=c.dataset.name; $$(".chip[data-name]",card).forEach(x=>x.classList.toggle("on",x===c)); });
    card.onclick = async ev => { const b = ev.target.closest("[data-act]"); if(!b) return; const act = b.dataset.act;
      try{
        if(act==="unlock"||act==="lock"){ b.disabled=true; const r = await waitCmd(await command(l.hub_id||(hub&&hub.id), id, act), 30); toast(r? (r.ok? (act==="unlock"?"Unlocked":"Locked") : "The lock didn't answer") : "No answer from the hub"); b.disabled=false; }
        if(act==="save"){ const mi = $('[data-f="master"]',card), mc = mi ? mi.value.trim() : ""; await rpc("lock_update",{p_lock:id,p_name:$('[data-f="name"]',card).value.trim(),p_for_guests:$('[data-f="guests"]',card).checked,p_active:true,p_master:mc||null,
          p_installed:$('[data-f="installed"]',card).value||null,p_replace_years:+$('[data-f="years"]',card).value||null,p_shared:$('[data-f="shared"]',card).checked}); toast("Saved"); homeView(pid); }
        if(act==="test"){ const code = String(Math.floor(1000+Math.random()*9000)); await command(null, id, "refresh", {code}); toast("Test code "+code+" is going on the lock (10 min)"); setTimeout(()=>homeView(pid), 15000); }
        if(act==="wipe"){ if(!confirm("Clear every code on this lock that isn't one of ours (old Brivo codes)? Our codes stay.")) return; await command(null, id, "wipe"); toast("Reading the lock… old codes will be cleared"); }
        if(act==="remove"){ if(!confirm("Remove "+l.name+" from the hub? Put the lock in remove mode after you tap OK.")) return; await command(hub.id, id, "exclude"); toast("Remove mode on for 5 minutes"); }
      }catch(e){ fail(e); } }; });
  // thermostats
  $$("[data-th]").forEach(card => { const id = card.dataset.th; let mode = (thermos.find(t=>t.id===id)||{}).mode;
    $$(".chip[data-mode]",card).forEach(c=>c.onclick=()=>{ mode=c.dataset.mode; $$(".chip[data-mode]",card).forEach(x=>x.classList.toggle("on",x===c)); });
    card.onclick = async ev => { const b = ev.target.closest("[data-act]"); if(!b) return;
      try{
        if(b.dataset.act==="set"){ const h2=$('[data-f="heat"]',card).value, c2=$('[data-f="cool"]',card).value;
          await rpc("lock_climate",{p_thermostat:id,p_mode:mode||"heat",p_heat:h2?+h2:null,p_cool:c2?+c2:null}); hub && wake(hub.id); toast("Sent"); }
        if(b.dataset.act==="tsave"){ await rpc("lock_thermostat_update",{p_thermostat:id,p_name:$('[data-f="name"]',card).value,p_managed:$('[data-f="managed"]',card).checked}); toast("Saved"); }
      }catch(e){ fail(e); } }; });
  // rules
  $("#rsave") && ($("#rsave").onclick = async () => { const r = {}; $$("[data-r]").forEach(i=>{ r[i.dataset.r] = i.value===""?null:i.value; });
    try{ await rpc("lock_home_rules",{p_property:pid,r}); toast("Rules saved"); loadBase(); }catch(e){ fail(e); } });
  // stays
  $$(".reveal").forEach(x => x.onclick = ev => { ev.stopPropagation(); x.outerHTML = `<div class="big" style="font-size:20px">${esc(x.dataset.c)}</div>`; });
  $$("[data-res]").forEach(row => row.onclick = async ev => { const b = ev.target.closest("[data-act]"); if(!b) return; const s = stays.find(x=>x.res_id===row.dataset.res);
    if(b.dataset.act==="link"){ const u = location.origin + location.pathname.replace(/locks(-desk)?\.html$/,"") + "stay.html#t=" + s.portal_token;
      try{ await navigator.clipboard.writeText(u); toast("Guest link copied"); }catch(e){ prompt("Guest link", u); } }
    if(b.dataset.act==="code"){ const c = prompt("New 4–6 digit code for "+(s.guest||"this guest"), s.code); if(!c) return;
      try{ await rpc("lock_stay_code",{p_res:s.res_id,p_code:c.trim()}); toast("Code changed - going on the lock"); homeView(pid); }catch(e){ fail(e); } } });
}

/* ------------------------------------------------ desk: every upcoming stay at our homes, with codes */
async function staysView(){
  if(!S.homes.length) await loadBase();
  const ours = S.homes.filter(h=>h.section==="ours").map(h=>h.property_id);
  const [stays, assigns, locks] = await Promise.all([
    q("lock_stays","res_id,property_id,guest,kind,status,starts_at,ends_at,code,code_source,agreement,portal_token",x=>x.in("property_id",ours).gte("ends_at",new Date().toISOString()).neq("status","cancelled").order("starts_at").limit(300)),
    q("lock_assign","lock_id,ref_kind,ref_id,state,wanted",x=>x.eq("ref_kind","stay").neq("state","cleared")),
    q("locks","id,property_id,name",x=>x.eq("active",true))]);
  const cleared = s => s.kind!=="guest" || ["received","not-needed"].includes(s.agreement);
  const onLock = s => { const a = assigns.filter(x=>x.ref_id===s.res_id && x.wanted); return !a.length ? null : a.every(x=>x.state==="verified") ? "on" : "sending"; };
  const inHouse = stays.filter(s=>new Date(s.starts_at)<=Date.now()).length;
  shell("stays", `<h2>Stays &amp; guest codes</h2>
    <div class="stats"><div class="stat"><div class="n">${stays.length}</div><div class="l">Upcoming stays</div></div>
      <div class="stat"><div class="n">${inHouse}</div><div class="l">In the home now</div></div>
      <div class="stat ${stays.some(s=>!cleared(s))?"warn":""}"><div class="n">${stays.filter(s=>!cleared(s)).length}</div><div class="l">Agreement not back</div></div>
      <div class="stat"><div class="n">${stays.filter(s=>onLock(s)==="on").length}</div><div class="l">Codes on the lock</div></div></div>
    ${STAY_KEY}<div class="card" style="overflow-x:auto"><table class="tbl"><tr><th>Home</th><th>Guest</th><th>Check-in</th><th>Check-out</th><th>Agreement</th><th>Code</th><th>Lock</th><th></th></tr>
    ${stays.map(s=>{ const ol = onLock(s); return `<tr data-res="${esc(s.res_id)}"><td><a href="#/home/${encodeURIComponent(s.property_id)}"><b>${esc((S.props[s.property_id]||{}).code||"")}</b></a></td>
      <td><b><a href="${resLink(s)}" target="_blank" rel="noopener" style="color:inherit">${esc(s.guest||"Guest")}</a></b><div class="muted" style="font-size:12px">${esc(s.kind)} · ${esc(s.res_id)}</div></td>
      <td>${when(s.starts_at)}</td><td>${when(s.ends_at)}</td>
      <td>${cleared(s)?'<span class="pill green">OK</span>':`<span class="pill red">${esc(s.agreement||"not sent")}</span>`}</td>
      <td><span class="code-chip">${esc(s.code)}</span><div class="muted" style="font-size:12px">${s.code_source==="phone"?"last 4 of phone":esc(s.code_source)}</div></td>
      <td>${stayPill(s, ol, S.homes.find(x=>x.property_id===s.property_id))}</td>
      <td style="white-space:nowrap;text-align:right">${folioLink(s)} <button class="btn small" data-act="link">Guest link</button> <button class="btn small" data-act="code">Change</button></td></tr>`; }).join("")
      || '<tr><td colspan="8" class="muted">No upcoming stays from Track.</td></tr>'}</table></div>
    <p class="muted">Codes go live (lock, guest page, Track Door Code) once the rental agreement is back. Owner and lease stays don't need one.</p>`, "Moose Locks", "Office desk · stays and codes");
  $$("[data-res]").forEach(row => row.onclick = async ev => { const b = ev.target.closest("[data-act]"); if(!b) return; const s = stays.find(x=>x.res_id===row.dataset.res);
    if(b.dataset.act==="link"){ const u = location.origin + location.pathname.replace(/locks(-desk)?\.html$/,"") + "stay.html#t=" + s.portal_token;
      try{ await navigator.clipboard.writeText(u); toast("Guest link copied"); }catch(e){ prompt("Guest link", u); } }
    if(b.dataset.act==="code"){ const c = prompt("New 4–6 digit code for "+(s.guest||"this guest"), s.code); if(!c) return;
      try{ await rpc("lock_stay_code",{p_res:s.res_id,p_code:c.trim()}); toast("Code changed - going on the lock"); staysView(); }catch(e){ fail(e); } } });
}

/* ------------------------------------------------ employee / vendor / backup codes */
async function codesView(){
  if(!S.homes.length) await loadBase();
  const [codes, masters, brivoM] = await Promise.all([q("lock_staff_codes","*",x=>x.order("kind").order("label")),
    q("locks","property_id,name,master_code",x=>x.eq("active",true).order("property_id")), rpc("lock_brivo_masters").then(r=>r||[]).catch(()=>[])]);
  const ours = S.homes.filter(h=>h.section==="ours");
  const homeNames = (ids, areas) => (!ids || !ids.length) && (!areas || !areas.length) ? "All our homes"
    : [...(areas||[]).map(a=>hoodName(a)+" (all)"), ...(ids||[]).map(i=>(S.props[i]||{}).code||i)].join(", ");
  const timeTxt = c => [c.days&&c.days.length?c.days.map(d=>DAYS[d]).join(" "):"Every day", c.time_from?`${c.time_from.slice(0,5)}–${c.time_to.slice(0,5)}`:"all day",
    c.ends_at?"until "+new Date(c.ends_at).toLocaleDateString():""].filter(Boolean).join(" · ");
  const groups = {employee:"Employees",housekeeping:"Housekeepers",vendor:"Vendors",owner:"Owners",hoa:"HOA contacts",county:"County officials",backup:"Backup codes"};   // backup last: they rotate
  const topName = c => c.person || c.company || c.label;
  const subName = c => [c.person && c.company ? c.company : null, c.role].filter(Boolean).join(" · ");
  const SHOW = {all:["employee","housekeeping","vendor","owner","hoa","county","backup"], crew:["employee"], housekeeping:["housekeeping"], backup:["backup"], vendor:["vendor"], owner:["owner"], hoa:["hoa"], county:["county"]};
  const HINT = {employee:"", backup:"Spare codes that rotate (e.g. a new one each month). Set an end date so the old one comes off by itself.", vendor:"Set days and hours so vendors only get in during their window.", owner:"Pick the owner's home(s). Owner codes work any time unless you set days or dates.",
    hoa:"HOA managers and board contacts - usually just their neighborhood.", housekeeping:"Our housekeeping team and outside cleaners.", county:"Health department and other county inspectors."};
  shell("codes", `<h2>Access codes</h2>
    <div class="card row" style="gap:12px">
      <div class="grow"><span class="muted" style="font-weight:700">Show</span><div class="chips" id="cshow" style="margin-top:6px">
        ${[["all","All"],["crew","Crew"],["housekeeping","Housekeepers"],["vendor","Vendors"],["owner","Owners"],["hoa","HOA"],["county","County"],["backup","Backup"]].map(([k,t])=>`<span class="chip" data-show="${k}">${t} (${codes.filter(c=>c.active&&SHOW[k].includes(c.kind)).length})</span>`).join("")}</div></div>
      <label class="field" style="margin:0;min-width:200px"><span>Sort</span><select id="csort"><option value="az">Name A → Z</option><option value="za">Name Z → A</option><option value="home">By home</option></select></label>
      <label class="field" style="margin:0;min-width:200px"><span>Find</span><input id="cfind" placeholder="Name or code"></label>
      <button class="btn go" id="new">+ Add a code</button></div>
    <div id="form"></div>
    <div id="clist"></div>
    <details class="sect" open><summary><h3 style="margin:0">Lock master codes</h3></summary><div class="card"><table class="tbl"><tr><th>Home</th><th>Door</th><th>Master code</th><th>From</th></tr>
      ${ours.slice().sort((a,b)=>a.properties.code.localeCompare(b.properties.code,undefined,{numeric:true})).map(h => {
          const ls = masters.filter(m=>m.property_id===h.property_id && m.master_code), bs = brivoM.filter(b=>b.property_id===h.property_id && !ls.some(m=>m.master_code===b.master_code));
          const rows = [...ls.map(m=>[m.name, m.master_code, "Lock"]), ...bs.map(b=>[b.door||"Home", b.master_code, "Brivo"])];
          return rows.length ? rows.map(r=>`<tr><td><b>${esc(h.properties.code)}</b></td><td>${esc(r[0])}</td><td><span class="code-chip">${esc(r[1])}</span></td><td class="muted">${r[2]}</td></tr>`).join("")
            : `<tr><td><b>${esc(h.properties.code)}</b></td><td></td><td><span class="muted" style="color:var(--red)">not on file - get it from Brivo</span></td><td></td></tr>`; }).join("")}</table></div></details>`, "Moose Locks", "Office · access codes");
  const firstHome = c => c.property_ids && c.property_ids.length ? ((S.props[c.property_ids[0]]||{}).code||"") : "~";
  const drawCodes = () => {
    const show = pref("cshow") || "all", srt = $("#csort").value, t = $("#cfind").value.trim().toLowerCase();
    pref("csort", srt);
    $$("#cshow .chip").forEach(x=>x.classList.toggle("on", x.dataset.show===show));
    const cmp = (a,b) => srt==="home" ? firstHome(a).localeCompare(firstHome(b), undefined, {numeric:true}) || topName(a).localeCompare(topName(b))
      : (srt==="za"?-1:1) * topName(a).localeCompare(topName(b));
    $("#clist").innerHTML = SHOW[show].map(k => { const cs = codes.filter(c=>c.kind===k && (!t || [c.label,c.person,c.company,c.role,c.code].join(" ").toLowerCase().includes(t))).sort(cmp);
      const shut = (pref("closed")||"").split(",").includes(k);
      return `<details class="sect" data-sect="${k}" ${shut?"":"open"}><summary><h3 style="margin:0">${groups[k]} (${cs.filter(c=>c.active).length})</h3></summary>${HINT[k]&&!cs.length?`<p class="muted">${HINT[k]}</p>`:""}
        ${cs.length?`<div class="tile-grid">${cs.map(c=>`<div class="card row" data-id="${c.id}" style="cursor:pointer;${c.active?"":"opacity:.5"}">
          <div class="grow"><b style="font-size:16px">${esc(topName(c))}</b>${subName(c)?`<div style="font-weight:700;color:var(--ink-2);font-size:13.5px">${esc(subName(c))}</div>`:""}
            <div class="muted" style="font-size:12.5px;margin-top:3px">${esc(homeNames(c.property_ids, c.areas))} · ${esc(timeTxt(c))}</div></div>
          <div class="big" style="font-size:20px">${esc(c.code)}</div></div>`).join("")}</div>`:`<p class="muted">None yet${t?" matching":""}.</p>`}</details>`; }).join("");
    $$("#clist details.sect").forEach(d => d.addEventListener("toggle", () => {
      const closed = new Set((pref("closed")||"").split(",").filter(Boolean)); d.open ? closed.delete(d.dataset.sect) : closed.add(d.dataset.sect); pref("closed", [...closed].join(",")); }));
    $$("#clist [data-id]").forEach(x=>x.onclick=()=>form(codes.find(c=>c.id==x.dataset.id)));
  };
  const ps = pref("csort"); if(ps) $("#csort").value = ps;
  $$("#cshow .chip").forEach(x=>x.onclick=()=>{ pref("cshow", x.dataset.show); drawCodes(); });
  $("#csort").onchange = drawCodes; $("#cfind").oninput = drawCodes;
  const form = c => {
    c = c || {kind:"employee",days:null};
    $("#form").innerHTML = `<div class="card">
      <div class="chips">${Object.entries(groups).map(([k,t])=>`<span class="chip ${c.kind===k?"on":""}" data-kind="${k}">${({employee:"Employee",housekeeping:"Housekeeper",backup:"Backup",vendor:"Vendor",owner:"Owner",hoa:"HOA",county:"County"})[k]}</span>`).join("")}</div>
      <label class="field"><span>First and last name</span><input id="f_person" value="${esc(c.person||"")}" placeholder="Shelby Huffaker"></label>
      <div class="grid2"><label class="field"><span>Company (vendors)</span><input id="f_company" value="${esc(c.company||"")}" placeholder="ABC Hot Tubs"></label>
        <label class="field"><span>Trade / job</span><input id="f_role" value="${esc(c.role||"")}" placeholder="Hot tubs, Maintenance, Owner…"></label></div>
      <label class="field"><span>Code (same as Brivo)</span><input id="f_code" inputmode="numeric" class="big" value="${esc(c.code||"")}"></label>
      <span class="muted"><b>Where can they get in?</b></span>
      <div class="chips" style="margin:6px 0" id="f_scope">
        <span class="chip ${!(c.property_ids||[]).length && !(c.areas||[]).length ? "on":""}" data-scope="all">All properties</span>
        <span class="chip ${(c.property_ids||[]).length || (c.areas||[]).length ? "on":""}" data-scope="pick">Pick neighborhoods / homes</span></div>
      <div id="f_pick" style="${(c.property_ids||[]).length || (c.areas||[]).length ? "" : "display:none"}">
        <span class="muted">Neighborhoods <span style="font-size:12px">(every home there, including ones added later)</span></span>
        <div class="chips" style="margin:6px 0">${[...new Set(S.homes.map(hoodOf))].sort((a,b)=>hoodName(a).localeCompare(hoodName(b))).map(a=>`<span class="chip ${(c.areas||[]).includes(a)?"on":""}" data-area="${esc(a)}">${esc(hoodName(a))}</span>`).join("")}</div>
        <span class="muted">Homes</span>
        <input id="f_hfind" placeholder="Find a home" style="margin:6px 0">
        <div class="chips" style="margin:6px 0;max-height:220px;overflow:auto" id="f_homes">${S.homes.filter(h=>h.section==="ours" || (c.property_ids||[]).includes(h.property_id))
          .sort((a,b)=>a.properties.code.localeCompare(b.properties.code,undefined,{numeric:true}))
          .map(h=>`<span class="chip ${(c.property_ids||[]).includes(h.property_id)?"on":""}" data-home="${esc(h.property_id)}">${esc(h.properties.code)}</span>`).join("")}</div></div>
      <span class="muted"><b>Days</b> (none picked = every day)</span>
      <div class="chips" style="margin:6px 0">${DAYS.map((d,i)=>`<span class="chip ${(c.days||[]).includes(i)?"on":""}" data-day="${i}">${d}</span>`).join("")}</div>
      <div class="grid2"><label class="field"><span>From (time)</span><input type="time" id="f_tf" value="${c.time_from?c.time_from.slice(0,5):""}"></label>
      <label class="field"><span>To (time)</span><input type="time" id="f_tt" value="${c.time_to?c.time_to.slice(0,5):""}"></label>
      <label class="field"><span>Start date</span><input type="date" id="f_sd" value="${c.starts_at?c.starts_at.slice(0,10):""}"></label>
      <label class="field"><span>End date</span><input type="date" id="f_ed" value="${c.ends_at?c.ends_at.slice(0,10):""}"></label></div>
      <button class="btn primary wide" id="f_save">Save</button>
      ${c.id?`<button class="btn danger wide" style="margin-top:8px" id="f_off">${c.active?"Turn off":"Turn back on"}</button>`:""}</div>`;
    let kind = c.kind;
    $$("[data-kind]").forEach(x=>x.onclick=()=>{ kind=x.dataset.kind; $$("[data-kind]").forEach(y=>y.classList.toggle("on",y===x)); });
    $$("[data-home],[data-day],[data-area]").forEach(x=>x.onclick=()=>x.classList.toggle("on"));
    $$("[data-scope]").forEach(x=>x.onclick=()=>{ $$("[data-scope]").forEach(y=>y.classList.toggle("on",y===x)); $("#f_pick").style.display = x.dataset.scope==="pick" ? "" : "none"; });
    $("#f_hfind").oninput = () => { const t = $("#f_hfind").value.trim().toLowerCase(); $$("#f_homes [data-home]").forEach(x=>x.style.display = !t || x.textContent.toLowerCase().includes(t) ? "" : "none"); };
    const save = async active => {
      const tf=$("#f_tf").value, tt=$("#f_tt").value; if((tf&&!tt)||(!tf&&tt)) return toast("Set both times or neither");
      const day = (d, end) => d ? new Date(d+(end?"T23:59:00":"T00:00:00")).toISOString() : null;
      const person = $("#f_person").value.trim(), company = $("#f_company").value.trim(), role = $("#f_role").value.trim();
      const r = { id:c.id||null, kind, person, company, role, label:[role?role.toUpperCase():"", person, company?"("+company+")":""].filter(Boolean).join(" ") || c.label || "", code:$("#f_code").value.trim(),
        property_ids: $("[data-scope='pick']").classList.contains("on") ? $$("[data-home].on").map(x=>x.dataset.home) : [],
        areas: $("[data-scope='pick']").classList.contains("on") ? $$("[data-area].on").map(x=>x.dataset.area) : [], days:$$("[data-day].on").map(x=>+x.dataset.day),
        time_from:tf||null, time_to:tt||null, starts_at:day($("#f_sd").value), ends_at:day($("#f_ed").value,true), active };
      if(!person && !company) return toast("Add a name or a company");
      if($("[data-scope='pick']").classList.contains("on") && !r.property_ids.length && !r.areas.length) return toast("Pick at least one neighborhood or home - or choose All properties");
      if(kind==="owner" && !r.property_ids.length) return toast("Pick the owner's home(s)");
      try{ await rpc("lock_staff_code",{r}); toast("Saved - going on the locks"); codesView(); }catch(e){ fail(e); } };
    $("#f_save").onclick = () => save(c.id ? c.active : true);
    const off = $("#f_off"); if(off) off.onclick = () => save(!c.active);
    $("#form").scrollIntoView({behavior:"smooth"});
  };
  $("#new").onclick = () => form();
  drawCodes();
}

/* ------------------------------------------------ alerts */
async function alertsView(){
  if(!S.homes.length) await loadBase();
  const ours = new Set(S.homes.filter(h=>h.section==="ours").map(h=>h.property_id));
  const al = (await q("lock_alerts","*",x=>x.is("closed_at",null).order("opened_at",{ascending:false}))).filter(a=>ours.has(a.property_id));
  shell("alerts", `<h2>Open alerts (${al.length})</h2>${al.map(a=>`<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/home/${encodeURIComponent(a.property_id||"")}">
    <div class="row"><b class="grow">${esc(a.kind.replace(/_/g," "))}</b><span class="muted">${ago(a.opened_at)}</span></div>
    <div>${esc((S.props[a.property_id]||{}).code||"")} · ${esc(a.detail||"")}</div>
    ${a.bw_task&&a.bw_task.startsWith("http")?'<span class="pill">Breezeway task made</span>':""}</a>`).join("")||'<p class="muted">All clear.</p>'}`);
}

/* ------------------------------------------------ scorecard: ours vs Lynx vs Brivo */
async function scoreView(){
  if(!S.homes.length) await loadBase();
  const [s] = await q("lock_scorecard","*");
  const ages = await q("locks","property_id,name,model,installed_on,replace_years,last_battery_change",x=>x.eq("active",true).order("installed_on"));
  const row = (k,v) => `<tr><td>${k}</td><td><b>${v??"-"}</b></td></tr>`;
  shell("score", `<h2>Scorecard (last 60 days)</h2><div class="card"><h3 style="margin-top:0">Ours</h3><table>
    ${row("Homes",s&&s.homes)}${row("Arrivals",s&&s.arrivals_60d)}${row("Code on the lock before check-in",s?`${s.code_ready_on_time} (${s.pct_ready_on_time??"-"}%)`:"-")}
    ${row("Hub offline alerts",s&&s.hub_offline_alerts_60d)}${row("Hours hubs were offline",s&&s.hub_offline_hours_60d)}${row("Lock offline alerts",s&&s.lock_offline_alerts_60d)}
    ${row("Keypad unlocks",s&&s.code_unlocks_60d)}${row("Phone-key taps",s&&s.phone_key_taps_60d)}</table></div>
    <div class="card"><h3 style="margin-top:0">Lock ages</h3><table><tr><th>Home</th><th>Door</th><th>Age</th><th>Replace by</th></tr>
    ${ages.map(l=>{ const by = l.installed_on? new Date(new Date(l.installed_on+"T12:00:00").setFullYear(+l.installed_on.slice(0,4)+l.replace_years)) : null;
      const soon = by && by - Date.now() < 90*864e5;
      return `<tr><td>${esc((S.props[l.property_id]||{}).code||"")}</td><td>${esc(l.name)}</td><td>${l.installed_on?ageTxt(l.installed_on):"?"}</td>
        <td>${by?`<span class="pill ${soon?"red":"grey"}">${by.toLocaleDateString(undefined,{month:"short",year:"numeric"})}</span>`:"set install date"}</td></tr>`; }).join("")}</table></div>
    <p class="muted">Lynx and Brivo columns come next: same measures, from their alerts and "can't get in" tickets per home.</p>
    ${await updatesCard()}`);
  wireUpdates();
}
async function updatesCard(){
  const [set, ups, hubs] = await Promise.all([
    q("lock_settings","key,value",x=>x.in("key",["auto_update","update_canary","update_wait_hours"])),
    q("lock_updates","hub_id,kind,title,entity,to_ver,started_at,done_at,ok,err",x=>x.order("id",{ascending:false}).limit(300)),
    q("lock_hubs","id,property_id",x=>x.eq("active",true))]);
  const v = Object.fromEntries(set.map(r=>[r.key,r.value])), on = (v.auto_update||"on")==="on", admin = S.me.role==="admin";
  const home = id => esc((S.props[(hubs.find(b=>b.id===id)||{}).property_id]||{}).code||"?");
  const open = ups.filter(u=>!u.done_at), bad = ups.filter(u=>u.ok===false && Date.now()-new Date(u.done_at) < 7*864e5);
  const done = ups.filter(u=>u.ok && Date.now()-new Date(u.done_at) < 30*864e5);
  return `<div class="card"><h3 style="margin-top:0">Hub updates</h3>
    <div class="row"><div class="grow"><b>Automatic updates ${on?"on":"off"}</b><div class="muted" style="font-size:12.5px">Home Assistant, hub system and add-ons install 2–5 am when nobody is in or arriving within 6 h.
      ${esc(v.update_canary||"BHL 1206")} goes first; the rest follow ${v.update_wait_hours||72} h later if it ran fine. A version that fails anywhere is skipped everywhere. Lock/thermostat firmware is never automatic.</div></div>
      ${admin?`<button class="btn small ${on?"":"go"}" id="u_toggle">${on?"Turn off":"Turn on"}</button>`:""}</div>
    <table style="margin-top:10px"><tr><th>Home</th><th>Update</th><th></th></tr>
      ${[...open, ...bad].map(u=>`<tr><td>${home(u.hub_id)}</td><td>${esc(u.title||u.entity)} <b>${esc(u.to_ver)}</b></td>
        <td style="text-align:right">${u.ok===false?`<span class="pill red" title="${esc(u.err||"")}">Failed</span>`:u.started_at?'<span class="pill amber">Installing</span>':UPD_AUTO.includes(u.kind)?'<span class="pill grey">Waiting</span>':'<span class="pill grey">Firmware</span>'}</td></tr>`).join("")
        || '<tr><td colspan="3" class="muted">Every hub is up to date.</td></tr>'}
    </table><p class="muted" style="font-size:12.5px">${done.length} update${done.length===1?"":"s"} installed in the last 30 days.</p></div>`;
}
function wireUpdates(){
  const b = $("#u_toggle"); if(!b) return;
  b.onclick = async () => { const on = b.textContent.includes("on"); try{ await rpc("lock_update_settings",{p_auto:on}); toast(on?"Automatic updates on":"Automatic updates off"); route(); }catch(e){ fail(e); } };
}

/* ------------------------------------------------ router */
async function route(){
  clearTimeout(S.timer);
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return loginView();
  if(!S.me){ const me = (await sb.rpc("my_desk_identity")).data; S.me = me && me[0]; }
  if(!S.me || !["admin","tech"].includes(S.me.role)) return shell("homes","<p>Lock setup is for the maintenance crew. Ask Brandon to add you.</p>");
  const h = location.hash.replace(/^#\/?/,"");
  try{
    if(h.startsWith("home/")) await homeView(decodeURIComponent(h.slice(5)));
    else if(h.startsWith("install/")) await installHome(decodeURIComponent(h.slice(8)));
    else if(h==="install") await installView();
    else if(h==="codes" && DESK) await codesView();
    else if(h==="stays" && DESK) await staysView();
    else if(h==="alerts") await alertsView();
    else if(h==="score" && DESK) await scoreView();
    else await homesView();
  }catch(e){ fail(e, "Couldn't load"); }
  if(h.startsWith("home/") || h==="" || h==="stays") S.timer = setTimeout(()=>{ if(!document.querySelector("input:focus,details[open]")) route(); }, 30000);
}
window.addEventListener("hashchange", route);
sb.auth.onAuthStateChange(ev => { if(ev==="SIGNED_IN"||ev==="SIGNED_OUT") route(); });
route();
})();
</script>
