<style>
:root{
  --moose:#88B535; --moose-soft:#eef5e0; --moose-ink:#2f4710; --forest:#3c5f12; --forest-2:#5b8a1e; --pine:#4f7a18;

  --radius:16px; --tap:44px; --shadow:0 1px 2px rgba(20,40,25,.06), 0 4px 14px rgba(20,40,25,.06);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--ground);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d; --shadow:0 1px 2px rgba(0,0,0,.3); } }
:root[data-theme="dark"]{
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d; --shadow:0 1px 2px rgba(0,0,0,.3); }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 2px;font-weight:800;letter-spacing:-.01em}
.vtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap} .vtop .btn{margin-top:6px;text-decoration:none;display:inline-flex;align-items:center}
h2{font-size:17px;margin:26px 0 8px;font-weight:800}

.btn{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:10px;min-height:36px;padding:0 12px;

.btn.primary{background:var(--forest-2);border-color:var(--forest-2);color:#fff} .btn:disabled{opacity:.5;cursor:default}

.pill.green{background:var(--moose-soft);color:var(--moose-ink)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.red{background:var(--red-soft);color:var(--red)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
button.pill{border:2px solid transparent;cursor:pointer;font-family:inherit;line-height:1.5} button.pill:hover{filter:brightness(.95)}
button.pill.on{border-color:currentColor;box-shadow:0 0 0 2px var(--bg,#fff) inset} .tfnote{font-size:12.5px;margin:0 0 6px}

.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px} .meter i{display:block;height:100%;background:var(--moose)}
.meter.amber i{background:var(--amber)} .meter.red i{background:var(--red)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}

td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}

dialog{border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:calc(100% - 32px);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlgx{position:sticky;top:-8px;float:right;margin:-8px -8px 0 8px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--card);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer;display:grid;place-items:center}
.dlgx:hover{background:var(--line)}
dialog label{display:block;margin:10px 0;font-size:13px;font-weight:800;color:var(--ink-2)}
dialog input:where(:not([type=checkbox],[type=radio])){display:block;width:100%;font:inherit;font-size:16px;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;margin-top:4px;background:var(--card);color:var(--ink)}
.err{color:var(--red);font-size:13px;min-height:1em}

.evl{display:flex;gap:6px;align-items:flex-start;justify-content:space-between;border-top:1px dashed var(--line);padding:5px 0}
.evl:first-of-type{border-top:0} .evl .ea{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.evl .btn{min-height:28px;padding:0 8px;font-size:12px}
.mil{background:var(--red-soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}
.mil .cd{font-weight:800}
.lnk{background:none;border:0;padding:0;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
#rmap,.tmap{height:430px;border-radius:14px;border:1px solid var(--line);z-index:0}
.tmap{height:360px}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px} @media (max-width:820px){.rgrid{grid-template-columns:1fr}}
.rlist{max-height:430px;overflow:auto}
.rrow{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.rrow:hover,.rrow.on{background:var(--moose-soft)} .rdot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px}
.drv{font-size:13px} .drv .why{color:var(--muted);font-size:12px}
</style>

<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<dialog id="dlg"></dialog>
<script src="confirm.js?v=20261120c"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const C = window.MM_CONFIG;
const sb = supabase.createClient(C.url, C.anonKey, { auth:{ persistSession:true, detectSessionInUrl:true, flowType:"implicit" } });
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmtDT = d => d ? new Date(d).toLocaleString("en-US", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }) : "";
const fmtD = d => d ? new Date(String(d).length === 10 ? d + "T12:00:00" : d).toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }) : "";
const mi = n => n == null ? "" : Math.round(n).toLocaleString();
const dur = s => { if(s == null) return ""; s = Math.round(s / 60); return s < 60 ? s + " min" : Math.floor(s / 60) + " h " + (s % 60) + " min"; };
const errText = e => ((e && (e.message || e.error_description)) || String(e)).replace(/^.*?ERROR:\s*/, "");

const OIL_EVERY = 5000, OIL_WARN = 4000;          // Brandon 2026-10-29: change every 5,000 miles, plan it at 4,000
const S = { days: 7, limit: 75, veh: "", tf: "", vehicles: [], places: [], oil: {}, trips: [], visits: [], events: [], mil: [], drv: {}, rv: "", rday: "", rsel: "" };

function vname(v){ return [v.year, v.make, v.model].filter(Boolean).join(" ") || v.nickname || ("Tracker " + String(v.imei).slice(-4)); }   // Brandon 2026-11-02: year, make, model on every card

/* ---------- distance + Bouncie polyline (precision 5; falls back to 6 if the points land off the map) ---------- */
function meters(a, b, c, d){ const R = 6371000, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
  const h = Math.sin(x / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function decode(str, p){
  const out = []; let i = 0, lat = 0, lng = 0, f = Math.pow(10, p);
  while(i < str.length){
    for(const k of [0, 1]){ let b, s = 0, r = 0; do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while(b >= 32 && i <= str.length);
      const d = (r & 1) ? ~(r >> 1) : (r >> 1); if(k === 0) lat += d; else lng += d; }
    out.push({ lat: lat / f, lon: lng / f });
  }
  return out;
}
function route(t){
  if(!t.gps || t.gps === "null") return [];
  if(/^\s*\{\s*"/.test(t.gps)){   // geojson, if ever stored that way (a polyline can also start with "{" or "[", so only real JSON counts)
    try { const g = JSON.parse(t.gps), cs = g.coordinates || (g.geometry && g.geometry.coordinates) || []; if(cs.length) return cs.map(c => ({ lat: c[1], lon: c[0] })); } catch {}
  }
  let pts = decode(t.gps, 5);
  if(pts.some(p => Math.abs(p.lat) > 90 || Math.abs(p.lon) > 180) || (pts[0] && Math.abs(pts[0].lat) < 1)) pts = decode(t.gps, 6);
  return pts;
}

/* ---------- time at places: parked stops (trip ends inside a place until the next trip starts) + slow drive-throughs from live points ---------- */
function computeVisits(){
  const byV = {}, live = {};
  for(const p of S.points){ for(const x of (p.points || [])){
      const g = x.gps || {}; if(g.lat == null) continue;
      (live[p.transaction_id] = live[p.transaction_id] || new Map()).set(x.timestamp, { t: Date.parse(x.timestamp), lat: +g.lat, lon: +g.lon, mph: x.speed == null ? null : +x.speed }); } }
  for(const t of S.trips) (byV[t.imei] = byV[t.imei] || []).push(t);
  const ivs = [];   // {imei, key, a, b, parked}
  const where = (lat, lon) => S.places.find(pl => meters(lat, lon, pl.lat, pl.lon) <= pl.radius_m);
  for(const [imei, ts] of Object.entries(byV)){
    ts.sort((a, b) => Date.parse(a.started_at) - Date.parse(b.started_at));
    ts.forEach((t, i) => {
      const pts = live[t.transaction_id] ? [...live[t.transaction_id].values()].sort((a, b) => a.t - b.t) : null;
      // where it parked: the trip's full route (REST polyline) first; live points can be partial
      const first = x => { const r = route(x); if(r.length) return r[0]; const l = live[x.transaction_id]; return l ? [...l.values()].sort((a, b) => a.t - b.t)[0] : null; };
      const poly = route(t), rt = poly.length ? poly : (pts || []), next = ts[i + 1];
      const end = rt[rt.length - 1], nstart = next ? first(next) : null;
      const pl = (end && where(end.lat, end.lon)) || (nstart && where(nstart.lat, nstart.lon));
      if(pl && t.ended_at){
        // parked longer than 12 h (overnight, weekend) isn't "time at" a place; a stop with no later trip counts up to now while under 12 h
        const a = Date.parse(t.ended_at), b = next ? Date.parse(next.started_at) : Date.now();
        if(b > a && b - a <= 12 * 3600000) ivs.push({ imei, key: pl.key, a, b, parked: true, open: !next });
      }
      if(pts){   // engine running inside a place at walking pace (car wash tunnel, a quick stop with the engine on)
        let run = null;
        for(const p of pts){
          const at = where(p.lat, p.lon), slow = p.mph == null || p.mph <= 10;
          if(at && slow && run && run.key === at.key) run.b = p.t;
          else { if(run && run.b - run.a >= 60000) ivs.push(run); run = at && slow ? { imei, key: at.key, a: p.t, b: p.t } : null; }
        }
        if(run && run.b - run.a >= 60000) ivs.push(run);
      }
    });
  }
  ivs.sort((x, y) => (x.imei + x.key).localeCompare(y.imei + y.key) || x.a - y.a);
  const out = [];
  for(const v of ivs){ const last = out[out.length - 1];
    if(last && last.imei === v.imei && last.key === v.key && v.a - last.b <= 5 * 60000){ last.b = Math.max(last.b, v.b); last.open = last.open || v.open; }
    else out.push({ ...v }); }
  const from = Date.now() - S.days * 86400000;
  S.visits = out.filter(v => v.b - v.a >= 60000 && v.b >= from);
}

/* ---------- data ---------- */
async function load(){
  const from = new Date(Date.now() - (S.days + 1) * 86400000).toISOString();
  const [v, p, o, t, sv, sf, mp, ev, vd, pp, ml] = await Promise.all([
    sb.from("bouncie_vehicles").select("*").order("nickname"),
    sb.from("vehicle_places").select("*").eq("off", false),
    sb.from("vehicle_oil").select("*").order("entered_at", { ascending: false }),
    sb.from("bouncie_trips").select("*").gte("started_at", from).order("started_at", { ascending: false }).limit(2000),
    sb.from("vehicle_service").select("*").eq("off", false).order("done_on", { ascending: false, nullsFirst: false }).order("id", { ascending: false }).limit(2000),
    sb.from("vehicle_service_files").select("id,service_id,path,file_name,mime,uploaded_name,uploaded_at").eq("off", false).limit(5000),
    sb.from("vehicle_maint_plan").select("*").eq("off", false).order("sort"),
    sb.from("vehicle_events").select("*").eq("off", false).gte("day", new Date(Date.now() - 400 * 86400000).toISOString().slice(0, 10)).order("day").limit(2000),
    sb.from("vehicle_drivers").select("*").eq("off", false),
    sb.rpc("vehicle_driver_people"),
    sb.from("bouncie_events").select("imei,received_at,payload").eq("event_type", "mil").gte("received_at", new Date(Date.now() - 365 * 86400000).toISOString()).order("received_at").limit(10000)]);
  const bad = [v, p, o, t, sv, sf, mp, ev, vd, pp, ml].find(x => x.error); if(bad) throw bad.error;
  S.vdrv = vd.data; S.people = pp.data;
  S.events = ev.data; S.mil = ml.data;
  S.service = sv.data; S.files = sf.data; S.plan = mp.data;
  S.vehicles = v.data; S.places = p.data; S.trips = t.data; S.oil = {};
  for(const r of o.data) if(!S.oil[r.imei]) S.oil[r.imei] = r;   // newest per vehicle
  S.points = [];
  const ids = S.trips.map(x => x.transaction_id);
  for(let i = 0; i < ids.length; i += 80){
    const r = await sb.from("bouncie_points").select("transaction_id,points").in("transaction_id", ids.slice(i, i + 80)).limit(5000);
    if(r.error) throw r.error; S.points.push(...r.data);
  }
  computeVisits();
  await loadDrivers();
}

/* ---------- page ---------- */
function oilBlock(v){
  const o = S.oil[v.imei];
  if(!o) return `<dt>Oil change</dt><dd><button class="btn" data-oil="${esc(v.imei)}">+ Add last oil change</button></dd>`;
  const since = !(v.odometer > 0) ? null : v.odometer - o.odometer, cls = since == null ? "" : since >= OIL_EVERY ? "red" : since >= OIL_WARN ? "amber" : "";
  const pct = since == null ? 0 : Math.max(0, Math.min(100, since / OIL_EVERY * 100));
  const word = since == null ? "waiting for the odometer" : since >= OIL_EVERY ? `<span class="pill red">Due now</span> ${mi(since)} mi since the last change`
    : since >= OIL_WARN ? `<span class="pill amber">Plan it</span> ${mi(since)} mi since · due in ${mi(OIL_EVERY - since)} mi` : `${mi(since)} mi since · due in ${mi(OIL_EVERY - since)} mi`;
  return `<dt>Oil change</dt><dd>${word}<div class="meter ${cls}"><i style="width:${pct}%"></i></div>
    <span class="muted">Last: ${mi(o.odometer)} mi${o.done_on ? " on " + fmtD(o.done_on) : ""} · entered by ${esc((o.entered_name || "").split(" ")[0])}</span>
    <button class="btn" data-oil="${esc(v.imei)}" style="margin-top:6px">+ New oil change</button></dd>`;
}
function lastAt(imei, kind){
  const keys = S.places.filter(p => p.kind === kind).map(p => p.key);
  return S.visits.filter(x => x.imei === imei && keys.includes(x.key)).sort((a, b) => b.b - a.b)[0];
}
function render(){
  const vs = S.vehicles;
  let h = `<div class="vtop"><div><h1>Vehicles</h1><p class="muted">Bouncie trackers · check engine, scheduled visits, routes, possible driver, trips, time at places, oil changes</p></div>` +
    (S.mgr ? `<a class="btn primary" href="https://www.bouncie.app/" target="_blank" rel="noopener">Bouncie log in ↗</a>` : "") + `</div>`;
  if(!vs.length){
    $("#app").innerHTML = h + `<div class="note">Waiting for the trackers. Once they're plugged in, added in the Bouncie app and authorized for the Moose Hub,
      each vehicle shows up here with its trips.</div>`; return;
  }
  h += `<div class="bar">${[7, 30, 90].map(d => `<button class="chip${S.days === d ? " on" : ""}" data-days="${d}">Last ${d} days</button>`).join("")}
    <label>Vehicle <select id="veh"><option value="">All</option>${vs.map(v => `<option value="${esc(v.imei)}"${S.veh === v.imei ? " selected" : ""}>${esc(vname(v))}</option>`).join("")}</select></label>
    <label>Flag trips over <input id="lim" type="number" min="30" max="120" step="5" value="${S.limit}"> mph</label></div>`;

  h += `<div class="cards">` + vs.filter(v => !S.veh || v.imei === S.veh).map(v => {
    const wash = lastAt(v.imei, "car_wash");
    return `<div class="card"><h3>${esc(vname(v))}</h3>
      <div>${v.is_running ? `<span class="pill green">Driving${v.speed ? " · " + Math.round(v.speed) + " mph" : ""}</span>` : `<span class="pill">Parked</span>`}
        ${milNow(v).on ? `<span class="pill red">Check engine</span>` : ""}${v.battery && !/normal/i.test(v.battery) ? `<span class="pill amber">Battery: ${esc(v.battery)}</span>` : ""}</div>
      <dl class="kv"><dt>Odometer</dt><dd>${v.odometer > 0 ? mi(v.odometer) + " mi" : `<span class="muted">waiting for the tracker</span>`}</dd>
        <dt>Last seen</dt><dd>${fmtDT(v.last_seen)}${v.last_address ? "<br><span class='muted'>" + esc(v.last_address) + "</span>" : ""}</dd>
        <dt>Car wash</dt><dd>${wash ? fmtDT(wash.a) : `<span class="muted">none in the last ${S.days} days</span>`}</dd>
        ${oilBlock(v)}<dt>Usually driven by</dt><dd>${usualHtml(v)}</dd><dt>Last driver</dt><dd>${lastDriverHtml(v)}</dd></dl>${milBlock(v)}${eventsBlock(v)}${maintBlock(v)}
      <div class="bar" style="margin:10px 0 0"><button class="btn" data-hist="${esc(v.imei)}">📋 Service history (${S.service.filter(s => s.imei === v.imei).length})</button>
        <button class="btn" data-svc="${esc(v.imei)}">+ Add service / invoice</button>
        <button class="btn" data-route="${esc(v.imei)}">🗺 Routes</button></div></div>`;
  }).join("") + `</div>`;

  // time at places
  const rows = [];
  for(const v of vs.filter(v => !S.veh || v.imei === S.veh)) for(const p of S.places){
    const vis = S.visits.filter(x => x.imei === v.imei && x.key === p.key);

/* ---------- maker's recommended maintenance (vehicle_maint_plan, sourced owner's manuals) + service history (Brandon 2026-11-02) ---------- */
const KINDS = [["oil_change","Oil change"],["service","Scheduled service"],["tires","Tires"],["brakes","Brakes"],["battery","Battery"],["repair","Repair"],
  ["recall","Recall"],["inspection","Inspection"],["registration","Registration"],["insurance","Insurance"],["other","Other"]];
const KIND = Object.fromEntries(KINDS);
const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
function planFor(v){
  const rows = S.plan.filter(p => norm(p.make) === norm(v.make) && norm(p.model) === norm(v.model) && (!v.year || (v.year >= p.year_from && v.year <= p.year_to)));
  const by = {};   // one line per item: the severe-use schedule when the maker has one (Park City = cold, mountains, dust, short trips)
  for(const p of rows) if(!by[p.item] || (p.severe && !by[p.item].severe)) by[p.item] = p;
  return Object.values(by).sort((a, b) => a.sort - b.sort);
}
function lastDone(imei, item){
  return S.service.filter(s => s.imei === imei && (s.items || []).includes(item)).sort((a, b) =>
    (b.odometer ?? -1) - (a.odometer ?? -1) || String(b.done_on || "").localeCompare(String(a.done_on || "")))[0];
}
function dueOf(v, p){
  const last = lastDone(v.imei, p.item), odo = v.odometer > 0 ? +v.odometer : null;
  let left = null, days = null;
  if(p.every_miles && last && last.odometer != null && odo != null) left = (+last.odometer + p.every_miles) - odo;
  if(p.every_months && last && last.done_on){ const d = new Date(last.done_on + "T12:00:00"); d.setMonth(d.getMonth() + p.every_months); days = Math.round((d - Date.now()) / 86400000); }
  const st = !last ? "none" : (left != null && left <= 0) || (days != null && days <= 0) ? "due" : (left != null && left <= 1000) || (days != null && days <= 30) ? "soon" : "ok";
  return { last, left, days, st };
}
function dueText(p, d){
  const every = [p.every_miles ? mi(p.every_miles) + " mi" : "", p.every_months ? p.every_months + " months" : ""].filter(Boolean).join(" or ");
  const when = d.st === "none" ? "no record yet" : [d.left != null ? (d.left <= 0 ? mi(-d.left) + " mi overdue" : "in " + mi(d.left) + " mi") : "",
    d.days != null ? (d.days <= 0 ? -d.days + " days overdue" : "by " + fmtD(new Date(Date.now() + d.days * 86400000))) : ""].filter(Boolean).join(" · ");
  const pill = d.st === "due" ? `<span class="pill red">Due</span> ` : d.st === "soon" ? `<span class="pill amber">Soon</span> ` : d.st === "none" ? `<span class="pill">No record</span> ` : `<span class="pill green">OK</span> `;
  return { every, when, pill };
}
function maintBlock(v){
  const plan = planFor(v);
  if(!plan.length) return `<p class="muted" style="margin:10px 0 0">Maker's maintenance schedule: not loaded yet for this vehicle.</p>`;
  const rank = { due: 0, soon: 1, none: 2, ok: 3 };
  const list = plan.map(p => ({ p, d: dueOf(v, p) })).sort((a, b) => rank[a.d.st] - rank[b.d.st] || a.p.sort - b.p.sort);
  const top = list.filter(x => x.d.st === "due" || x.d.st === "soon").slice(0, 4), none = list.filter(x => x.d.st === "none").length;

    ${!top.length && none < list.length ? `<div style="font-size:13px;margin-top:3px"><span class="pill green">OK</span> nothing due soon</div>` : ""}
    ${none ? `<div class="muted" style="font-size:12.5px;margin-top:3px">${none} item${none === 1 ? "" : "s"} with no service record yet</div>` : ""}
    <button class="btn" data-plan="${esc(v.imei)}" style="margin-top:6px">See the full schedule (${plan.length})</button></div>`;

async function shrink(f){   // phone photos are often 5-12 MB; an invoice stays readable at 2,400 px
  if(!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 2.5 * 1024 * 1024) return f;
  try {
    const img = await createImageBitmap(f), k = Math.min(1, 2400 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const b = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
    return b ? new File([b], f.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" }) : f;
  } catch { return f; }
}
async function uploadFiles(imei, serviceId, files){
  let bad = 0;
  for(let f of files){
    f = await shrink(f);
    if(f.size > 25 * 1024 * 1024){ bad++; continue; }
    const ext = (f.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 5) || "bin";
    const path = `v/${imei}/${new Date().toISOString().slice(0, 7)}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const up = await sb.storage.from("vehicle-docs").upload(path, f, { contentType: f.type || undefined, upsert: false });
    if(up.error){ bad++; continue; }
    const fr = await sb.from("vehicle_service_files").insert({ service_id: serviceId, path, file_name: f.name.slice(0, 200), mime: f.type || "", size_bytes: f.size });
    if(fr.error) bad++;
  }
  return bad;
}

    if(files.some(f => f.size > 25 * 1024 * 1024)){ $("#se", d).textContent = "A file is over 25 MB."; return; }
    $("#ss", d).disabled = true; $("#se", d).textContent = "Saving…";
    const r = await sb.from("vehicle_service").insert({ imei, kind: $("#sk", d).value, items, done_on: $("#sd", d).value || null, odometer: odo,
      vendor: $("#sv", d).value.trim(), cost, invoice_no: $("#si", d).value.trim(), note: $("#sn", d).value.trim() }).select("id").single();
    if(r.error){ $("#se", d).textContent = errText(r.error); $("#ss", d).disabled = false; return; }
    const bad = await uploadFiles(imei, r.data.id, files);
    if(pre.ev){ const e = S.events.find(x => x.id === pre.ev);
      if(e) await sb.rpc("vehicle_event_save", evArgs(e, { p_status: "done", p_service: r.data.id })); }
    await load(); render(); histDialog(imei);
    if(bad) await mmAlert(bad + " file(s) didn't upload. The record is saved; add the file again with a new record.");
  };
}


/* ---------- check engine light: reason (trouble codes) + on/off history from Bouncie's MIL alerts (Brandon 2026-11-18) ---------- */
// Meanings of the codes our trucks have sent; add more here with a source. Unknown codes get a "look it up" link.
const DTC_SRC = { ore: ["O'Reilly Auto Parts", "https://www.oreillyauto.com/how-to-hub/check-engine-light-code-p0171-and-p0174-fuel-trim-system-lean"],
  ym: ["YourMechanic", "https://YourMechanic.com/article/p0011-obd-ii-trouble-code-camshaft-position-a-timing-over-advanced-or-system-performance-bank-1-by-jay-safford"] };
const DTC = {
  P0171: ["Engine running too lean (bank 1): too much air or too little fuel", "vacuum leak, dirty or bad airflow (MAF) sensor, weak fuel pump or clogged fuel filter", "ore"],
  P0174: ["Engine running too lean (bank 2): too much air or too little fuel", "vacuum leak, dirty or bad airflow (MAF) sensor, weak fuel pump or clogged fuel filter", "ore"],
  P0011: ["Intake camshaft timing more advanced than the engine computer asked for (bank 1)", "low or old engine oil, stuck oil control (valve timing) solenoid, worn cam phaser, wiring at the solenoid", "ym"] };
function milRows(imei){
  return S.mil.filter(e => e.imei === imei).map(e => { const m = (e.payload || {}).mil || {};
    return { t: Date.parse(m.timestamp || e.received_at), on: String(m.value).toUpperCase() === "ON", codes: String(m.codes || "").split(",").map(c => c.trim()).filter(Boolean) }; })
    .filter(x => x.t).sort((a, b) => a.t - b.t);
}
function milStretches(imei){   // Bouncie re-sends the light's state at most engine starts; keep only the changes
  const out = [];
  for(const r of milRows(imei)){
    const last = out[out.length - 1], key = r.on + "|" + r.codes.join(",");
    if(last && last.key === key){ last.seen = r.t; continue; }
    if(last) last.to = r.t;
    out.push({ key, on: r.on, codes: r.codes, from: r.t, seen: r.t, to: null });
  }
  return out;
}
function milNow(v){
  const st = milStretches(v.imei), last = st[st.length - 1];
  const rawT = Date.parse(((((v.raw || {}).stats || {}).mil) || {}).lastUpdated || "") || 0;
  if(last && last.seen >= rawT) return { on: last.on, codes: last.codes, since: firstOn(st), st };
  return { on: !!v.mil_on, codes: [], since: null, st };
}
function firstOn(st){   // when the light came on for this stretch (codes can change while it stays on)
  let i = st.length - 1; if(i < 0 || !st[i].on) return null;
  while(i > 0 && st[i - 1].on) i--; return st[i].from;
}
function codeLine(c, v){
  const d = DTC[c], q = encodeURIComponent(c + " " + [v.year, v.make, v.model].filter(Boolean).join(" ") + " code");
  if(!d) return `<div><span class="cd">${esc(c)}</span> <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">look it up ↗</a></div>`;
  const s = DTC_SRC[d[2]];
  return `<div><span class="cd">${esc(c)}</span> · ${esc(d[0])}<br><span class="muted">Common causes: ${esc(d[1])} · <a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])} ↗</a></span></div>`;
}
function milBlock(v){
  const m = milNow(v), n = m.st.filter(x => x.on).length;
  if(m.on) return `<div class="mil"><b>⚠ Check engine light is ON</b>${m.since ? " since " + fmtDT(m.since) : ""}
    ${m.codes.length ? m.codes.map(c => codeLine(c, v)).join("") : `<div class="muted">No trouble code sent yet.</div>`}
    <button class="lnk" data-mil="${esc(v.imei)}">On/off history (${m.st.length})</button></div>`;
  const lastOn = [...m.st].reverse().find(x => x.on);
  return `<div class="sec"><b>Check engine</b> <span class="pill green">Off</span>${lastOn ? ` <span class="muted">· last on ${fmtD(new Date(lastOn.from))}</span>` : ""}
    ${m.st.length ? ` <button class="lnk" data-mil="${esc(v.imei)}">History (${n} time${n === 1 ? "" : "s"} on)</button>` : ""}</div>`;
}
function milDialog(imei){
  const v = S.vehicles.find(x => x.imei === imei), d = $("#dlg"), st = milStretches(imei).reverse();
  d.style.maxWidth = "760px";
  d.innerHTML = `<h3 style="margin:0 0 4px">Check engine history · ${esc(vname(v))}</h3>
    <p class="muted" style="margin:0 0 8px">From Bouncie's check engine alerts (sent when the light or its codes change, and at most engine starts). Newest first.</p>
    ${st.length ? `<div class="box"><table><thead><tr><th>Light</th><th>From</th><th>Until</th><th class="n">How long</th><th>Codes</th></tr></thead><tbody>${st.map(x =>
      `<tr><td>${x.on ? `<span class="pill red">ON</span>` : `<span class="pill green">Off</span>`}</td><td>${fmtDT(x.from)}</td><td>${x.to ? fmtDT(x.to) : "now"}</td>
       <td class="n">${durL(((x.to || Date.now()) - x.from) / 1000)}</td><td style="white-space:normal;min-width:220px">${x.codes.length ? x.codes.map(c => codeLine(c, v)).join("") : `<span class="muted">none</span>`}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="muted">No check engine alerts from this tracker yet.</p>`}
    <p class="muted">Code meanings are the standard (generic) ones; a dealer or shop scan can say more for this exact engine.</p>
    <div class="bar"><button class="btn primary" data-evnew="${esc(imei)}" data-evtitle="Check engine light${st[0] && st[0].on && st[0].codes.length ? " (" + st[0].codes.join(", ") + ")" : ""}" data-evkind="repair">📅 Schedule a shop visit</button>
      <button class="btn" id="mc">Close</button></div>`;
  if(!d.open) d.showModal(); $("#mc", d).onclick = () => { d.close(); d.style.maxWidth = ""; };
}

/* ---------- routes (Brandon 2026-11-18): Leaflet + OpenStreetMap, one colour per trip ---------- */
const COLORS = ["#2463a0", "#c8382b", "#3c5f12", "#b5770a", "#7b3fa0", "#0f8a8a", "#d1497b", "#5b6b2a", "#444"];
const pcDay = t => new Date(t).toLocaleDateString("en-CA", { timeZone: "America/Denver" });
function tripPts(t){
  const r = route(t); if(r.length > 1) return r;
  const p = S.points.filter(x => x.transaction_id === t.transaction_id).flatMap(x => x.points || [])
    .map(x => ({ t: Date.parse(x.timestamp), lat: x.gps && +x.gps.lat, lon: x.gps && +x.gps.lon })).filter(x => x.lat && x.lon).sort((a, b) => a.t - b.t);
  return p;
}
function routesSection(vs){
  if(typeof L === "undefined") return `<h2>Routes</h2><div class="note">The map didn't load. Check your signal and reload.</div>`;
  const withRt = S.trips.find(t => t.ended_at && tripPts(t).length > 1);
  if(!S.rv || !vs.some(v => v.imei === S.rv)) S.rv = S.veh || (withRt && withRt.imei) || (S.trips[0] && S.trips[0].imei) || vs[0].imei;
  const vt = S.trips.filter(t => t.imei === S.rv), days = [...new Set(vt.map(t => pcDay(t.started_at)))];
  if(!days.includes(S.rday)){ const f = vt.find(t => t.ended_at && tripPts(t).length > 1); S.rday = f ? pcDay(f.started_at) : (days[0] || ""); }
  const trips = vt.filter(t => pcDay(t.started_at) === S.rday).sort((a, b) => Date.parse(a.started_at) - Date.parse(b.started_at));

  return `<h2 id="routes">Routes</h2>
    <div class="bar"><label>Vehicle <select id="rv">${vs.map(v => `<option value="${esc(v.imei)}"${S.rv === v.imei ? " selected" : ""}>${esc(vname(v))}</option>`).join("")}</select></label>
      <label>Day <select id="rday">${days.length ? days.map(d => `<option value="${d}"${d === S.rday ? " selected" : ""}>${esc(new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }))} · ${(n => n + (n === 1 ? " trip" : " trips"))(vt.filter(t => pcDay(t.started_at) === d).length)}</option>`).join("") : `<option>No trips in the last ${S.days} days</option>`}</select></label></div>
    ${trips.length ? `<div class="rgrid"><div id="rmap"></div><div class="box rlist">${trips.map((t, i) => `<div class="rrow${S.rsel === t.transaction_id ? " on" : ""}" data-rsel="${esc(t.transaction_id)}">
        <span class="rdot" style="background:${COLORS[i % COLORS.length]}"></span><div><b>${new Date(t.started_at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}${t.ended_at ? " – " + new Date(t.ended_at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : " · driving now"}</b>
        <br><span class="muted">${t.miles == null ? "" : (+t.miles).toFixed(1) + " mi · "}${dur(t.trip_s)}${t.max_mph ? " · top " + Math.round(t.max_mph) + " mph" : ""}</span>
        ${tripPts(t).length > 1 ? "" : `<br><span class="muted">no route yet</span>`}<div class="drv">${drvShort(t)}</div></div></div>`).join("")}</div></div>
      <p class="muted">Tap a trip to show only it. Map: © OpenStreetMap contributors. Route = Bouncie's trip path (live points while a trip is still going).</p>`
      : `<div class="empty box">No trips to show.</div>`}`;
}
let RMAP = null;
function drawLines(map, trips){
  const all = [];

    L.circleMarker(p[p.length - 1], { radius: 6, color: "#fff", weight: 2, fillColor: "#c8382b", fillOpacity: 1 }).addTo(map).bindTooltip(t.ended_at ? "Parked " + fmtDT(t.ended_at) : "Latest point");

/* ---------- possible last driver (Brandon 2026-11-18): vehicle_driver_guess() scores clock-ins, Breezeway tasks and crew phones near where a trip left / parked ---------- */
async function loadDrivers(){
  const from = Date.now() - S.days * 86400000;
  const ts = S.trips.filter(t => Date.parse(t.started_at) >= from).slice(0, 400), T = [];
  for(const t of ts){ const p = tripPts(t), a = p[0], b = p[p.length - 1];
    T.push({ tx: t.transaction_id, imei: t.imei, a: t.started_at, b: t.ended_at || null, slat: a ? a.lat : null, slon: a ? a.lon : null, elat: t.ended_at && b ? b.lat : null, elon: t.ended_at && b ? b.lon : null }); }
  S.drv = {};
  for(let i = 0; i < T.length; i += 80){
    const r = await sb.rpc("vehicle_driver_guess", { p_trips: T.slice(i, i + 80) });
    if(r.error) { S.drvErr = errText(r.error); break; }
    for(const x of r.data || []) S.drv[x.tx] = x.people || [];
  }
}
function drvShort(t){
  const g = S.drv[t.transaction_id]; if(!g || !g.length) return `<span class="muted">—</span>`;
  const top = g[0], strong = top.pts >= 2, tie = g[1] && g[1].pts === top.pts;
  return `<span title="${esc(g.slice(0, 4).map(p => p.who + ": " + p.why.join("; ")).join("\n"))}">${strong ? "" : "maybe "}${esc(top.who)}${tie ? " or " + esc(g[1].who) : ""}</span>`;
}
function lastDriverHtml(v){
  const t = S.trips.filter(x => x.imei === v.imei).sort((a, b) => Date.parse(b.started_at) - Date.parse(a.started_at))[0];
  if(!t) return `<span class="muted">no trips in the last ${S.days} days</span>`;
  const g = S.drv[t.transaction_id] || [];
  if(!g.length) return `<span class="muted">no clues</span> <span class="muted">· trip ${fmtDT(t.started_at)}</span>`;
  return `${drvShort(t)} <span class="muted">· trip ${fmtDT(t.started_at)}</span><br><span class="muted" style="font-size:12px">${esc(g[0].why.slice(0, 2).join("; "))}</span>`;
}
function driversSection(vs){
  const rows = vs.filter(v => !S.veh || v.imei === S.veh).map(v => ({ v, ts: S.trips.filter(t => t.imei === v.imei).sort((a, b) => Date.parse(b.started_at) - Date.parse(a.started_at)).slice(0, 5) }));
  return `<h2>Possible last driver</h2>${S.drvErr ? `<div class="note">Couldn't work out drivers: ${esc(S.drvErr)}</div>` : ""}
    <div class="box"><table><thead><tr><th>Vehicle</th><th>Trip</th><th>Best guess</th><th>Why</th></tr></thead><tbody>${rows.map(({ v, ts }) => ts.length ? ts.map((t, i) => {
      const g = S.drv[t.transaction_id] || [];
      return `<tr${i ? ` style="opacity:.75"` : ""}><td>${i ? "" : `<b>${esc(vname(v))}</b>`}</td><td><a href="#" data-trip="${esc(t.transaction_id)}">${fmtDT(t.started_at)}</a>${t.miles ? ` <span class="muted">${(+t.miles).toFixed(1)} mi</span>` : ""}</td>
        <td>${drvShort(t)}${g[1] && !(g[1].pts === g[0].pts) ? `<br><span class="muted" style="font-size:12px">then ${esc(g[1].who)}</span>` : ""}</td>
        <td style="white-space:normal;min-width:240px;font-size:12.5px" class="muted">${esc(g.length ? g[0].why.join("; ") : "")}</td></tr>`; }).join("")
      : `<tr><td><b>${esc(vname(v))}</b></td><td colspan="3" class="muted">No trips in the last ${S.days} days</td></tr>`).join("")}</tbody></table></div>
    <p class="muted">A best guess, never proof: who usually drives it, clocking in near where the vehicle left or out where it parked, a Breezeway maintenance or inspection task finished right before it left that home or started right after it parked at one, a crew phone at the vehicle, and who was on the clock. Phones add the strongest clue once the crew's phone GPS is sending.</p>`;
}

/* ---------- who usually drives each vehicle (Brandon 2026-11-18) ---------- */
const pname = id => (S.people.find(p => p.id === id) || {}).name || "someone";
function usualHtml(v){
  const ds = (S.vdrv || []).filter(x => x.imei === v.imei);
  return (ds.length ? ds.map(x => esc(pname(x.user_id)) + (x.how === "assigned" ? ` <span class="pill green">their vehicle</span>` : "")).join(", ") : `<span class="muted">not set</span>`)
    + ` <button class="lnk" data-usual="${esc(v.imei)}">✎</button>`;
}
function usualDialog(imei){
  const v = S.vehicles.find(x => x.imei === imei), d = $("#dlg"), ds = (S.vdrv || []).filter(x => x.imei === imei);
  const sel = "display:block;width:100%;font:inherit;font-size:16px;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;margin-top:4px;background:var(--card);color:var(--ink)";
  d.style.maxWidth = "480px";
  d.innerHTML = `<h3 style="margin:0 0 4px">Who drives it · ${esc(vname(v))}</h3>
    <p class="muted" style="margin:0">Helps the "possible driver" guess: their vehicle counts more than "usually drives it". It never decides on its own.</p>
    ${ds.length ? ds.map(x => `<div class="evl"><div><b>${esc(pname(x.user_id))}</b> · ${x.how === "assigned" ? "their vehicle" : "usually drives it"}${x.note ? `<br><span class="muted">${esc(x.note)}</span>` : ""}</div>
      <div class="ea"><button class="btn" data-uoff="${esc(x.user_id)}">Take off</button></div></div>`).join("") : `<p class="muted">Nobody set yet.</p>`}
    <label>Add someone<select id="uu" style="${sel}"><option value="">Pick a person…</option>${S.people.filter(p => !ds.some(x => x.user_id === p.id)).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label>
    <label>How<select id="uh" style="${sel}"><option value="often">Usually drives it</option><option value="assigned">It's their vehicle</option></select></label>
    <div class="err" id="ue"></div>
    <div class="bar"><button class="btn primary" id="us">Add</button><button class="btn" id="uc">Close</button></div>`;
  if(!d.open) d.showModal();
  $("#uc", d).onclick = () => { d.close(); d.style.maxWidth = ""; };
  const go = async (user, how, off) => {
    const r = await sb.rpc("vehicle_driver_set", { p_imei: imei, p_user: user, p_how: how, p_note: "", p_off: off });
    if(r.error){ $("#ue", d).textContent = errText(r.error); return; }
    await load(); render(); usualDialog(imei);
  };
  $("#us", d).onclick = () => { const u = $("#uu", d).value; if(!u){ $("#ue", d).textContent = "Pick a person."; return; } go(u, $("#uh", d).value, false); };
  $$("[data-uoff]", d).forEach(b => b.onclick = () => go(b.dataset.uoff, "often", true));
}

async function refresh(){
  try { await load(); render(); }
  catch(e){ $("#app").innerHTML = `<h1>Vehicles</h1><div class="note">Couldn't load: ${esc(errText(e))}</div>`; }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tf],[data-days],[data-oil],[data-hist],[data-svc],[data-file],[data-hide],[data-plan],[data-addph],[data-mil],[data-evnew],[data-evedit],[data-evdone],[data-trip],[data-rsel],[data-route],[data-usual]"); if(!b) return;
  if(b.dataset.file || b.dataset.tf != null || b.dataset.trip) e.preventDefault();
  if(b.dataset.mil){ milDialog(b.dataset.mil); return; }
  if(b.dataset.usual){ usualDialog(b.dataset.usual); return; }
  if(b.dataset.evnew){ if($("#dlg").open) $("#dlg").close(); evDialog(b.dataset.evnew, null, { title: b.dataset.evtitle || "", kind: b.dataset.evkind || "" }); return; }
  if(b.dataset.evedit){ const ev = S.events.find(x => x.id === +b.dataset.evedit); if(ev) evDialog(ev.imei, ev); return; }
  if(b.dataset.evdone){ evDone(+b.dataset.evdone); return; }
  if(b.dataset.trip){ tripDialog(b.dataset.trip); return; }
  if(b.dataset.rsel){ S.rsel = S.rsel === b.dataset.rsel ? "" : b.dataset.rsel; $$(".rrow").forEach(r => r.classList.toggle("on", r.dataset.rsel === S.rsel)); drawRoutes(); return; }
  if(b.dataset.route){ S.rv = b.dataset.route; S.rday = ""; S.rsel = ""; render(); const r = $("#routes"); if(r) r.scrollIntoView({ behavior: "smooth" }); return; }
  if(b.dataset.tf != null){ S.tf = (S.tf === b.dataset.tf ? "" : b.dataset.tf); render(); }
  else if(b.dataset.days){ S.days = +b.dataset.days; refresh(); }
  else if(b.dataset.oil) oilDialog(b.dataset.oil);
  else if(b.dataset.hist) histDialog(b.dataset.hist);
  else if(b.dataset.svc) svcDialog(b.dataset.svc);
  else if(b.dataset.file) openFile(b.dataset.file);
  else if(b.dataset.hide) hideSvc(+b.dataset.hide);
  else if(b.dataset.plan) planDialog(b.dataset.plan);
  else if(b.dataset.addph) addPhoto(+b.dataset.addph);
});
document.addEventListener("change", e => {
  if(e.target.id === "veh"){ S.veh = e.target.value; if(S.veh) S.rv = S.veh; S.rday = ""; render(); }
  if(e.target.id === "lim"){ S.limit = Math.max(30, Math.min(120, +e.target.value || 75)); render(); }
  if(e.target.id === "rv"){ S.rv = e.target.value; S.rday = ""; S.rsel = ""; render(); $("#routes").scrollIntoView(); }
  if(e.target.id === "rday"){ S.rday = e.target.value; S.rsel = ""; render(); $("#routes").scrollIntoView(); }
});

// every pop-up: ✕ in the top right + a click outside closes it (Brandon 2026-11-03)
(function dlgClose(){
  const d = $("#dlg"), shut = () => { const m = d.querySelector(".leaflet-container"); if(m && m._leaflet_id) d.innerHTML = ""; d.close(); d.style.maxWidth = ""; };
  const addX = () => { if(!d.querySelector(":scope > .dlgx")) d.insertAdjacentHTML("afterbegin", `<button type="button" class="dlgx" aria-label="Close" title="Close">✕</button>`); };
  new MutationObserver(addX).observe(d, { childList: true });
  d.addEventListener("click", e => {
    if(e.target.closest(".dlgx")) return shut();
    if(e.target !== d) return;
    const r = d.getBoundingClientRect();
    if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) shut();
  });
})();
(async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("#app").innerHTML = `<h1>Please sign in</h1><p><a class="btn primary" href="hub.html" target="_top">Go to the Moose Hub</a></p>`; return; }
  const ok = await sb.rpc("bouncie_can_read");
  if(ok.error){ $("#app").innerHTML = `<h1>Vehicles</h1><p class="muted">Couldn't load. Check your signal and reload the page.</p>`; return; }
  if(ok.error || ok.data !== true){ $("#app").innerHTML = `<h1>Vehicles</h1><p class="muted">Nothing to show.</p>`; return; }
  // Bouncie log-in button: managers + admins only (Brandon 2026-11-03)
  const [ad, mg] = await Promise.all([sb.rpc("hub_is_admin"), sb.rpc("hub_is_manager")]);
  S.mgr = ad.data === true || mg.data === true;
  refresh();
})();
window.__veh = { S, decode, meters, computeVisits, render, milStretches, milNow };   // for the stub test
</script>
