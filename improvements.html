<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3c5f12">
<title>Improvements</title>
<link rel="icon" href="moose-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Improvements (hub_improvements.sql, improvements_sync.py; Brandon 2026-11-02). Maintenance ▸ Improvements = ?area=maintenance
     (desk maint_improve), Housekeeping ▸ Improvements = ?area=housekeeping (desk hk_improve), &tab=cleaners = who cleaned before a bad cleaning
     review (hk_improve only). Access is enforced in Supabase: the RPCs return null for anyone who can't open it. Nothing is deleted. -->
<style>
:root{
  --moose:#88B535; --moose-soft:#eef5e0; --moose-ink:#2f4710; --forest:#3c5f12; --forest-2:#5b8a1e;
  --ground:#f5f7f0; --card:#ffffff; --ink:#15201a; --ink-2:#3d4a42; --muted:#6b776f; --line:#e1e7de; --line-2:#cfd8cb;
  --red:#c8382b; --red-soft:#fbe7e4; --amber:#b5770a; --amber-soft:#fbf0d9; --blue:#2463a0; --blue-soft:#e3edf8; --violet:#6b4bb0; --violet-soft:#eee8f8;
  --radius:16px; --shadow:0 1px 2px rgba(20,40,25,.06), 0 4px 14px rgba(20,40,25,.06);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--ground);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d; --violet-soft:#241c36; --shadow:0 1px 2px rgba(0,0,0,.3); } }
:root[data-theme="dark"]{
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d; --violet-soft:#241c36; --shadow:0 1px 2px rgba(0,0,0,.3); }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 2px;font-weight:800;letter-spacing:-.01em}
h2{font-size:16px;margin:0;font-weight:800}
.muted{color:var(--muted);font-size:13.5px}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;padding:0 12px;
  font:inherit;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--forest-2);border-color:var(--forest-2);color:#fff} .btn.sm{min-height:32px;padding:0 9px;font-size:12.5px} .btn:disabled{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--ink-2);white-space:nowrap}
.pill.clean{background:var(--moose-soft);color:var(--moose-ink)} .pill.dirty{background:var(--amber-soft);color:var(--amber)} .pill.in_use{background:var(--blue-soft);color:var(--blue)}
.pill.needs_repair,.pill.low{background:var(--red-soft);color:var(--red)} .pill.in_storage{background:var(--violet-soft);color:var(--violet)}
.tabs{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.tab{border:1px solid var(--line-2);background:var(--card);color:var(--ink);padding:7px 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;min-height:40px}
.tab.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.tile b{display:block;font-size:22px;font-weight:800;line-height:1.2} .tile span{font-size:12.5px;color:var(--muted);font-weight:700}
.tile.on{outline:2px solid var(--forest-2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
.bar input,.bar select{font:inherit;font-size:14px;border:1px solid var(--line-2);border-radius:10px;padding:6px 9px;background:var(--card);color:var(--ink);min-height:38px}
.bar input[type=search]{flex:1;min-width:170px}
.bar label{font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.grp>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.grp>header .muted{margin-left:auto}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm{font-weight:800;overflow-wrap:anywhere} .row .nt{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.qty{display:inline-flex;align-items:center;gap:4px} .qty b{min-width:44px;text-align:center;font-size:16px}
.qty .btn{width:34px;padding:0;justify-content:center;font-size:18px}
.loc{font-size:13.5px;overflow-wrap:anywhere} .loc small{display:block;color:var(--muted);font-size:11.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts select{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line-2);border-radius:10px;padding:4px 6px;background:var(--card);color:var(--ink);min-height:32px}
.empty{padding:22px;color:var(--muted);font-size:14px;text-align:center}
.start{background:var(--card);border:1px dashed var(--line-2);border-radius:var(--radius);padding:18px}
.start .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{background:var(--blue-soft);border-radius:12px;padding:10px 14px;font-size:13.5px;margin:10px 0}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;max-width:480px;width:calc(100% - 24px);background:var(--card);color:var(--ink);max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form,dialog .dbody{padding:18px 20px;overflow:auto;max-height:calc(100vh - 100px)}
dialog h3{margin:0 0 6px;font-size:18px}
dialog label{display:block;margin:10px 0;font-size:13px;font-weight:800;color:var(--ink-2)}
dialog input,dialog select,dialog textarea{display:block;width:100%;font:inherit;font-size:16px;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;margin-top:4px;background:var(--card);color:var(--ink)}
dialog textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);background:var(--card);position:sticky;bottom:0}
.err{color:var(--red);font-size:13px;min-height:1em}
.hist{font-size:13.5px} .hist li{margin:6px 0} .hist small{color:var(--muted)}
@media (max-width:700px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .loc{grid-column:1} .row .acts{grid-column:1 / -1;justify-content:flex-start}
  .two{grid-template-columns:1fr}
}
body.inhub .wrap{padding-top:10px}
.btn.primary{background:var(--forest);border-color:var(--forest)}
.icard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;padding:14px 16px}
.icard .top{display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap}
.icard .top b{font-size:17px} .icard .top .muted{margin-left:auto}
.rv{border-left:3px solid var(--line-2);padding:4px 0 4px 10px;margin:8px 0;font-size:14px}
.rv small{color:var(--muted);font-weight:700}
.st-new{background:var(--amber-soft);color:var(--amber)} .st-planned{background:var(--blue-soft);color:var(--blue)} .st-scheduled{background:var(--violet-soft);color:var(--violet)}
.st-done{background:var(--moose-soft);color:var(--moose-ink)} .st-not_doing{background:var(--line);color:var(--muted)}
.ia{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ia select,.ia input,.ia textarea{font:inherit;font-size:14px;border:1px solid var(--line-2);border-radius:10px;padding:6px 9px;background:var(--card);color:var(--ink);min-height:38px}
.ia textarea{flex:1;min-width:200px;min-height:38px;resize:vertical}
.log{font-size:12.5px;color:var(--muted);margin-top:8px} .log div{margin:2px 0}
table.ct{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card)} .ct th,.ct td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ct th{font-size:12px;color:var(--muted);font-weight:800;cursor:pointer;white-space:nowrap} .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}
.who button{text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer}
.who button.on{outline:2px solid var(--forest-2)} .who b{display:block;font-size:15px} .who span{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const C = window.MM_CONFIG;
const sb = supabase.createClient(C.url, C.anonKey, { auth:{ persistSession:true, detectSessionInUrl:true, flowType:"implicit" } });
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const day = d => d ? new Date(String(d).slice(0, 10) + "T12:00").toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }) : "";
const when = d => d ? new Date(d).toLocaleString("en-US", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }) : "";
const errText = e => ((e && (e.message || e.error_description)) || String(e)).replace(/^.*?ERROR:\s*/, "");
const tmr = () => { const d = new Date(Date.now() + 864e5); return d.toISOString().slice(0, 10); };
const base = h => String(h || "").replace(/^(2H-|L-)/, "").toUpperCase();
const free = (home, n = 4) => { const out = []; for(let i = 1; i <= 45 && out.length < n; i++){ const d = new Date(Date.now() + i * 864e5).toISOString().slice(0, 10);
  if(!(S.stays || []).some(x => base(x.unit) === base(home) && x.in <= d && d < x.out)) out.push(d); } return out; };
const pick = id => `<select data-pp="${id}" title="Assign to">${(S.ppl || []).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("") || `<option value="">Chris Robinson</option>`}</select>`;
if(window.top !== window) document.body.classList.add("inhub");
const P = new URLSearchParams(location.search);
const AREA = P.get("area") === "housekeeping" ? "housekeeping" : "maintenance";
const SL = { new:"New", planned:"Planned", scheduled:"Scheduled", done:"Done", not_doing:"Not doing" };
const S = { tab:P.get("tab") === "cleaners" ? "cleaners" : "list", rows:[], cl:null, q:"", topic:"", st:"open", stars:"", since:"", who:"", open:{} };

async function load(){
  const r = await sb.rpc("improvements_list", { p_area:AREA });
  if(r.error) throw r.error;
  S.rows = r.data;                                                    // null = can't open
  if(AREA === "housekeeping"){ const c = await sb.rpc("review_cleaners_list", { p_since:null }); S.cl = c.error ? null : c.data; }
  if(AREA === "maintenance" && S.rows && !S.ppl){       // "Assign to" + next empty days (Brandon 2026-11-02)
    const iso = d => d.toISOString().slice(0, 10);
    const [pp, st] = await Promise.all([sb.rpc("maint_people"), sb.rpc("cal_stays", { p_from:iso(new Date()), p_to:iso(new Date(Date.now() + 45 * 864e5)) })]);
    S.ppl = pp.data || []; S.stays = (st.data && st.data.stays) || []; }
}

function render(){
  const app = $("#app");
  if(S.rows === null){ app.innerHTML = `<p class="empty">Nothing to show here.</p>`; return; }
  const tabs = S.cl ? `<div class="tabs"><button class="tab${S.tab === "list" ? " on" : ""}" data-tab="list">Improvements</button>
      <button class="tab${S.tab === "cleaners" ? " on" : ""}" data-tab="cleaners">Cleaning reviews by cleaner</button></div>` : "";
  app.innerHTML = `<div class="head"><div><h1>${AREA === "maintenance" ? "Maintenance" : "Housekeeping"} · Improvements</h1>
      <div class="muted">Anything guests mention in 2 or more separate reviews at the same home in the last year. Quotes are the guests' public words.</div></div>
      ${AREA === "housekeeping" ? `<a class="btn sm" href="housekeeping.html">← Housekeeping board</a>` : ""}</div>
    ${tabs}<div id="pane"></div>`;
  $$("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  if(S.tab === "cleaners" && S.cl) return cleaners($("#pane"));
  list($("#pane"));
}

function list(el){
  const rows = S.rows;
  const cnt = k => rows.filter(r => r.status === k).length;
  const topics = [...new Set(rows.map(r => r.topic))].sort();
  const q = S.q.toLowerCase();
  const show = rows.filter(r => (!S.topic || r.topic === S.topic)
    && (S.st === "all" || (S.st === "open" ? !["done", "not_doing"].includes(r.status) : r.status === S.st))
    && (!S.stars || (r.reviews || []).some(x => +x.stars <= +S.stars))
    && (!S.since || (r.last_review || "") >= S.since)
    && (!q || (r.home + " " + r.topic + " " + (r.note || "") + " " + (r.reviews || []).map(x => x.quote || "").join(" ")).toLowerCase().includes(q)));
  el.innerHTML = `<div class="tiles">${["new", "planned", "scheduled", "done", "not_doing"].map(k =>
      `<button class="tile${S.st === k ? " on" : ""}" data-tile="${k}"><b>${cnt(k)}</b><span>${SL[k]}</span></button>`).join("")}</div>
    <div class="bar"><input type="search" id="q" placeholder="Search home, topic, what guests wrote, notes" value="${esc(S.q)}">
      <label>Topic <select id="ft"><option value="">All</option>${topics.map(t => `<option${t === S.topic ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
      <label>Status <select id="fs">${[["open", "Still open"], ["all", "All"], ...Object.entries(SL)].map(([k, l]) => `<option value="${k}"${k === S.st ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <label>Stars <select id="fr"><option value="">Any</option>${[1, 2, 3, 4].map(n => `<option value="${n}"${String(n) === S.stars ? " selected" : ""}>${n}★ or less</option>`).join("")}</select></label>
      <label>Last review since <input type="date" id="fd" value="${esc(S.since)}"></label></div>
    ${show.length ? show.map(card).join("") : `<div class="empty">${rows.length ? "Nothing matches these filters." : "Nothing yet. Items show up when 2 separate reviews mention the same thing at a home."}</div>`}`;
  $("#q").oninput = e => { S.q = e.target.value; const p = e.target.selectionStart; list(el); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  $("#ft").onchange = e => { S.topic = e.target.value; list(el); };
  $("#fs").onchange = e => { S.st = e.target.value; list(el); };
  $("#fr").onchange = e => { S.stars = e.target.value; list(el); };
  $("#fd").onchange = e => { S.since = e.target.value; list(el); };
  $$("[data-tile]").forEach(b => b.onclick = () => { S.st = S.st === b.dataset.tile ? "open" : b.dataset.tile; list(el); });
  $$("[data-save]").forEach(b => b.onclick = async () => {
    const id = +b.dataset.save, st = $(`[data-st="${id}"]`).value, nt = $(`[data-nt="${id}"]`).value.trim(), r = rows.find(x => x.id === id);
    if(st === r.status && !nt) return;
    b.disabled = true; const x = await sb.rpc("improvement_set", { p_id:id, p_status:st === r.status ? null : st, p_note:nt || null });
    if(x.error){ alert("Couldn't save: " + errText(x.error)); b.disabled = false; return; }
    await load(); list(el); });
  $$("[data-sch]").forEach(b => b.onclick = async () => {
    const id = +b.dataset.sch, due = $(`[data-due="${id}"]`).value, pp = $(`[data-pp="${id}"]`);
    b.disabled = true; const x = await sb.rpc("improvement_schedule", { p_id:id, p_due:due, p_person:pp && pp.value ? +pp.value : null });
    if(x.error){ alert(errText(x.error)); b.disabled = false; return; }
    await load(); list(el); poll(el); });
  $$("[data-more]").forEach(b => b.onclick = () => { S.open[b.dataset.more] = !S.open[b.dataset.more]; list(el); });
  $$("[data-fd]").forEach(b => b.onclick = () => { const i = $(`[data-due="${b.dataset.fd}"]`); if(i) i.value = b.dataset.day; });
}
let pollT;
function poll(el){ clearTimeout(pollT); if(S.rows && S.rows.some(r => r.sched === "queued")) pollT = setTimeout(async () => { await load(); if(S.tab === "list") list(el); poll(el); }, 20e3); }

function card(r){
  const rv = r.reviews || [], more = S.open[r.id], n = more ? rv.length : 3;
  const sched = AREA !== "maintenance" ? "" : r.sched === "queued" ? `<span class="pill st-scheduled">Making the Breezeway task for ${day(r.due)}…</span>`
    : r.sched === "scheduled" ? `<span class="pill st-scheduled">In Breezeway ${day(r.due)}${r.person ? " · " + esc(((S.ppl || []).find(p => p.id === r.person) || {}).name || "") : ""}</span>${r.bw_url ? ` <a href="${esc(r.bw_url)}" target="_blank" rel="noopener">Open task ↗</a>` : ""}`
    : `${r.sched === "failed" ? `<span style="color:var(--red);font-size:13px">Couldn't schedule: ${esc(r.sched_note || "")}</span>` : ""}
       <label class="muted">Breezeway task on <input type="date" data-due="${r.id}" value="${free(r.home, 1)[0] || tmr()}"></label> for ${pick(r.id)}
       <button class="btn primary" data-sch="${r.id}">Schedule in Breezeway</button><span style="flex-basis:100%"></span>
       ${free(r.home).length ? `<span class="muted">Next empty:</span> ${free(r.home).map(d => `<button type="button" class="btn sm" data-fd="${r.id}" data-day="${d}">${day(d)}</button>`).join(" ")}` : ""}`;
  return `<div class="icard"><div class="top"><b>${esc(r.home)}</b><span>${esc(r.topic)}</span><span class="pill st-${r.status}">${SL[r.status] || r.status}</span>
      <span class="muted">${r.review_count} reviews · last ${day(r.last_review)}</span></div>
    ${rv.slice(0, n).map(x => `<div class="rv"><small>${day(x.date)} · ${(+x.stars).toLocaleString()}★${x.channel ? " · " + esc(x.channel) : ""}</small>
      <div>${x.quote ? "“" + esc(x.quote) + "”" : `<span class="muted">(no public words on this, from the stars or a private note)</span>`}</div></div>`).join("")}
    ${rv.length > 3 ? `<button class="btn ghost sm" data-more="${r.id}">${more ? "Show fewer" : `Show all ${rv.length}`}</button>` : ""}
    ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
    <div class="ia"><select data-st="${r.id}">${Object.entries(SL).map(([k, l]) => `<option value="${k}"${k === r.status ? " selected" : ""}>${l}</option>`).join("")}</select>
      <textarea data-nt="${r.id}" placeholder="Add a note for the team (what you found, the plan…)"></textarea><button class="btn primary" data-save="${r.id}">Save</button></div>
    ${sched ? `<div class="ia">${sched}</div>` : ""}
    ${(r.log || []).length ? `<div class="log">${r.log.slice(0, 5).map(l => `<div>${when(l.at)} · ${esc(l.by || "")}: ${esc(l.what)}${l.note ? " — " + esc(l.note) : ""}</div>`).join("")}</div>` : ""}</div>`;
}

/* Who cleaned before a bad cleaning review (housekeeping manager + admins: review_cleaners_list is null for anyone else) */
function cleaners(el){
  const rows = S.cl || [], q = S.q.toLowerCase();
  const by = {}; rows.forEach(r => (r.cleaners && r.cleaners.length ? r.cleaners : ["(no clean found)"]).forEach(c => { (by[c] = by[c] || { n:0, homes:new Set(), last:"" }).n++; by[c].homes.add(r.home); if((r.submitted_at || "") > by[c].last) by[c].last = r.submitted_at; }));
  const who = Object.entries(by).sort((a, b) => b[1].n - a[1].n);
  const show = rows.filter(r => (!S.who || (S.who === "(no clean found)" ? !(r.cleaners || []).length : (r.cleaners || []).includes(S.who)))
    && (!q || (r.home + " " + (r.quote || "") + " " + (r.cleaners || []).join(" ") + " " + (r.clean_name || "")).toLowerCase().includes(q)));
  el.innerHTML = `<div class="note">Every review in the last 2 years that complains about cleaning (cleanliness 3★ or less, or words like dirty / hair / dust), and the last
      finished Breezeway clean at that home in the 14 days before check-in. It's the clean before the stay, not proof of who missed it. Only the housekeeping manager and admins see this page.</div>
    <div class="who">${who.map(([c, v]) => `<button class="${S.who === c ? "on" : ""}" data-who="${esc(c)}"><b>${esc(c)}</b><span>${v.n} review${v.n === 1 ? "" : "s"} · ${v.homes.size} home${v.homes.size === 1 ? "" : "s"} · last ${day(v.last)}</span></button>`).join("")}</div>
    <div class="bar"><input type="search" id="q" placeholder="Search home, cleaner, what guests wrote" value="${esc(S.q)}"><button class="btn" id="csv">Download CSV</button></div>
    <div class="tw"><table class="ct"><thead><tr><th>Review</th><th>Home</th><th>Stars</th><th>Clean ★</th><th>Guest wrote</th><th>Clean before the stay</th><th>Cleaned by</th></tr></thead><tbody>
    ${show.map(r => `<tr><td>${day(r.submitted_at)}</td><td><b>${esc(r.home)}</b><br><small class="muted">check-in ${day(r.check_in)}</small></td><td>${(+r.stars).toLocaleString()}★</td>
      <td>${r.cleanliness == null ? "—" : (+r.cleanliness).toLocaleString() + "★"}</td><td>${r.quote ? "“" + esc(r.quote) + "”" : `<span class="muted">—</span>`}</td>
      <td>${r.clean_task ? `${esc(r.clean_name || "")}<br><small class="muted">${when(r.cleaned_at)}</small> <a href="https://app.breezeway.io/task/${r.clean_task}" target="_blank" rel="noopener">↗</a>` : `<span class="muted">No finished clean found in Breezeway</span>`}</td>
      <td>${(r.cleaners || []).map(esc).join(", ") || "—"}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">Nothing matches.</td></tr>`}</tbody></table></div>`;
  $("#q").oninput = e => { S.q = e.target.value; const p = e.target.selectionStart; cleaners(el); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  $$("[data-who]").forEach(b => b.onclick = () => { S.who = S.who === b.dataset.who ? "" : b.dataset.who; cleaners(el); });
  $("#csv").onclick = () => {
    const c = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const t = [["Review date", "Home", "Check-in", "Stars", "Cleanliness", "Guest wrote", "Clean", "Cleaned at", "Cleaned by"].map(c).join(",")]
      .concat(show.map(r => [r.submitted_at, r.home, r.check_in, r.stars, r.cleanliness, r.quote, r.clean_name, r.cleaned_at, (r.cleaners || []).join("; ")].map(c).join(",")));
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t.join("\n")], { type:"text/csv" })); a.download = "cleaning-reviews-by-cleaner.csv"; a.click();
  };
}

(async () => {
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ $("#app").innerHTML = `<p class="empty">Please sign in to the Moose Hub first.</p>`; return; }
    await load(); render(); poll($("#pane"));
  } catch(e){ $("#app").innerHTML = `<p class="empty">Couldn't load: ${esc(errText(e))}</p>`; }
})();
window.__impr = { S, render };   // for the stub test
</script>
