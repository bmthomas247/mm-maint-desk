<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3c5f12">
<title>Moose Hub</title>
<link rel="icon" href="moose-logo.png">
<link rel="apple-touch-icon" href="moose-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --moose:#88B535; --moose-2:#A6CE39; --moose-ink:#2f4710; --moose-soft:#eef5e0;
  --forest:#3c5f12; --forest-2:#5b8a1e; --pine:#4f7a18; --pine-soft:#eaf3da;
  --ground:#f5f7f0; --card:#ffffff; --ink:#15201a; --ink-2:#3d4a42; --muted:#6b776f; --line:#e1e7de; --line-2:#cfd8cb;
  --red:#c8382b; --red-soft:#fbe7e4; --amber:#b5770a; --amber-soft:#fbf0d9; --blue:#2463a0; --blue-soft:#e3edf8;
  --radius:18px; --tap:48px; --shadow:0 1px 2px rgba(20,40,25,.06), 0 4px 14px rgba(20,40,25,.06); --rail:232px;
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-feature-settings:"tnum" 1;
  color:var(--ink); background:var(--ground);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --pine-soft:#173026; --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d;
  --shadow:0 1px 2px rgba(0,0,0,.3); } }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);-webkit-font-smoothing:antialiased}
a{color:var(--pine)}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:14px;min-height:var(--tap);padding:0 16px;
  font:inherit;font-weight:800;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.98)} .btn.primary{background:var(--forest-2);border-color:var(--forest-2);color:#fff}
.btn.small{min-height:36px;font-size:13.5px;padding:0 12px;border-radius:11px} .btn.wide{width:100%} .btn:disabled{opacity:.5}
.field{display:block;margin:10px 0;text-align:left} .field span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:700}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:var(--tap);border:1px solid var(--line-2);border-radius:13px;padding:10px 13px;background:var(--card);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--moose-soft);border-color:var(--moose)}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink-2)}
.pill.green{background:var(--moose-soft);color:var(--moose-ink)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.red{background:var(--red-soft);color:var(--red)} .pill.blue{background:var(--blue-soft);color:var(--blue)}

/* layout */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh;height:100dvh}
aside.rail{background:linear-gradient(180deg,var(--forest),#2e4a0e);color:#fff;display:flex;flex-direction:column;min-height:0;
  padding:14px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.logo{position:relative;width:42px;height:42px;flex:none}
.logo img{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 2px 8px rgba(0,0,0,.25);display:block}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{font-size:12.5px;opacity:.75;font-weight:600}
nav.desks{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px;padding-right:2px}
.dk{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 10px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px;opacity:.88}
.dk:hover{background:rgba(255,255,255,.08);opacity:1}
.dk.on{background:rgba(255,255,255,.16);opacity:1;box-shadow:inset 3px 0 0 var(--moose-2)}
.dk .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.dk.on .ic{background:var(--moose);color:#16220a}
.dk .ic svg{width:17px;height:17px}
.dk .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk .soon{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.65}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;opacity:.55;margin:12px 10px 4px}
.foot{border-top:1px solid rgba(255,255,255,.14);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:3px}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13.5px}
.me .av{width:30px;height:30px;border-radius:50%;background:var(--moose);color:#16220a;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.me .nm{flex:1;min-width:0;line-height:1.2} .me .nm small{display:block;opacity:.7;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me button{background:none;border:0;color:#fff;opacity:.7;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
main.view{min-width:0;min-height:0;display:flex;flex-direction:column}
iframe.desk{border:0;width:100%;flex:1;background:var(--ground)}
.page{max-width:760px;margin:0 auto;padding:24px 16px;width:100%;overflow:auto}
h2{font-size:24px;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
.topbar{display:none}
/* phones: rail becomes a slide-out drawer */
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  aside.rail{position:fixed;inset:0 auto 0 0;width:min(84vw,300px);z-index:20;transform:translateX(-102%);transition:transform .2s ease;box-shadow:4px 0 24px rgba(0,0,0,.3)}
  body.open aside.rail{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;display:none} body.open .scrim{display:block}
  .topbar{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--forest),var(--forest-2));color:#fff;
    padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
  .topbar b{font-size:17px;font-weight:800}
}
.login{max-width:420px;margin:60px auto;padding:0 16px;text-align:center}
.login .logo{width:84px;height:84px;margin:0 auto 12px}.login .logo img{width:84px;height:84px}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex} .modal .card{width:min(520px,100%);margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px} .seg button{flex:1;min-width:110px}
.seg button.on{background:var(--moose-soft);border-color:var(--moose);color:var(--moose-ink)}
.fb{border-top:1px solid var(--line);padding:12px 0}.fb:first-child{border-top:0}
.fb .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.fb p{margin:6px 0 0;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const C = window.MM_CONFIG;
const sb = supabase.createClient(C.url, C.anonKey, { auth:{ persistSession:true, detectSessionInUrl:true, flowType:"implicit" } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");
const I = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  lock: I('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  key: I('<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M16 7l3 3M14 9l2 2"/>'),
  wrench: I('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>'),
  calendar: I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'),
  chart: I('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  home: I('<path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/>'),
  badge: I('<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/>'),
  dollar: I('<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
  target: I('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
  megaphone: I('<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1zM17 9a4 4 0 0 1 0 6"/>'),
  chat: I('<path d="M21 12a8 8 0 0 1-11.8 7L4 20l1-4.6A8 8 0 1 1 21 12z"/>'),
  spark: I('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>'),
  bug: I('<rect x="7" y="7" width="10" height="13" rx="5"/><path d="M12 7V4M9 4l1.5 2M15 4l-1.5 2M3 12h4M17 12h4M4 18l3-2M20 18l-3-2M4 7l3 2M20 7l-3 2"/>'),
  list: I('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
  menu: I('<path d="M4 6h16M4 12h16M4 18h16"/>'),
  grid: I('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>')
};
let ME = null, DESKS = [];

/* ---------- sign in (same accounts as Moose Locks and the Maintenance site) */
function loginView(msg){
  app.innerHTML = `<div class="login"><div class="logo"><img src="moose-logo.png" alt="Moose Management"></div><h2>Moose Hub</h2>
    <p class="muted">Same sign-in as Moose Locks.</p>
    <label class="field"><span>Email</span><input type="email" id="em" autocomplete="username"></label>
    <label class="field"><span>Password</span><input type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn primary wide" id="go">Sign in</button>
    <button class="btn wide" id="link" style="margin-top:8px">First time or forgot it? Email me a code</button>
    <div id="codebox" style="display:none;margin-top:10px"><label class="field"><span>Code from the email</span><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Example: 123456" style="font-size:24px;letter-spacing:6px;text-align:center"></label>
      <button class="btn primary wide" id="otpgo">Sign in with code</button></div>
    <p id="msg" class="muted">${esc(msg||"")}</p></div>`;
  const fixEm = () => { let e = $("#em").value.trim().toLowerCase().replace(/\s+/g,"");
    e = e.replace(/@m[o0]+s[e]?m[a-z]*ment\.c[o0]m?$/, "@moosemanagement.com"); $("#em").value = e; return e; };
  $("#go").onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email:fixEm(), password:$("#pw").value });
    if(error) $("#msg").textContent = "Wrong email or password."; else boot(); };
  $("#pw").addEventListener("keydown", e => { if(e.key === "Enter") $("#go").click(); });
  $("#link").onclick = async () => { const email = fixEm(); if(!email) return $("#msg").textContent = "Type your email first.";
    $("#msg").textContent = "Sending…";
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } });
    if(!error){ $("#codebox").style.display = "block"; $("#otp").focus(); }
    $("#msg").textContent = !error ? "Code sent to " + email + "." : "Couldn't send the code (" + error.message + ")."; };
  $("#otpgo").onclick = async () => { const { error } = await sb.auth.verifyOtp({ email:$("#em").value.trim().toLowerCase(), token:$("#otp").value.replace(/\D/g,""), type:"email" });
    if(error) $("#msg").textContent = "That code didn't work - send a new one."; else boot(); };
}

/* ---------- shell */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return loginView();
  const me = await sb.rpc("hub_me");
  if(me.error || !me.data) return noAccess(me.error ? me.error.message : "");
  ME = me.data; ME.canNews = !!(await sb.rpc("hub_can_post_news")).data;
  const d = await sb.rpc("hub_my_desks"); DESKS = d.data || [];
  shell(); route();
}
function noAccess(err){
  app.innerHTML = `<div class="login"><div class="logo"><img src="moose-logo.png" alt=""></div><h2>No hub access yet</h2>
    <p class="muted">Your sign-in worked, but you're not on a hub team. Ask Brandon or Kim to add you.</p>
    <button class="btn wide" id="out">Sign out</button><p class="muted">${esc(err)}</p></div>`;
  $("#out").onclick = async () => { await sb.auth.signOut(); loginView(); };
}
function shell(){
  const live = DESKS.filter(x => x.status === "live"), soon = DESKS.filter(x => x.status !== "live");
  const item = (k, label, icon, extra="") => `<a class="dk" data-k="${k}" href="#/${k}"><span class="ic">${ICON[icon]||ICON.grid}</span><span class="lb">${esc(label)}</span>${extra}</a>`;
  const teams = (ME.teams||[]).map(t => t.replace(/_/g," ")).join(" · ");
  app.innerHTML = `<div class="topbar"><button id="menu" aria-label="Desks">${ICON.menu}</button><b id="ttl">Moose Hub</b></div>
  <div class="scrim" id="scrim"></div>
  <div class="shell">
    <aside class="rail">
      <div class="brand"><div class="logo"><img src="moose-logo.png" alt=""></div><div><b>Moose Hub</b><small>crew.moosemanagement.com</small></div></div>
      <nav class="desks">
        ${live.map(x => item(x.key, x.label, x.icon)).join("")}
        ${soon.length ? `<div class="grp">Coming soon</div>` + soon.map(x => item(x.key, x.label, x.icon, `<span class="soon">soon</span>`)).join("") : ""}
      </nav>
      <div class="foot">
        ${ME.admin ? item("reports", "Bugs & upgrades", "list") : item("reports", "My reports", "list")}
        <a class="dk" href="#" id="fbopen"><span class="ic">${ICON.bug}</span><span class="lb">Report a bug / upgrade</span></a>
        <div class="me"><span class="av">${esc(ME.initials || (ME.name||"?").slice(0,2))}</span><span class="nm">${esc(ME.name)}<small>${esc(teams)}</small></span><button id="out">Sign out</button></div>
      </div>
    </aside>
    <main class="view" id="view"></main>
  </div>
  <div class="modal" id="fb"><div class="card">
    <h2 style="font-size:20px">Tell Brandon</h2>
    <div class="seg" id="kind"><button class="btn small on" data-v="bug">🐞 Something's broken</button><button class="btn small" data-v="upgrade">⬆️ Upgrade I want</button><button class="btn small" data-v="idea">💡 Idea</button></div>
    <label class="field"><span>What happened, or what would help?</span><textarea id="fbtext" placeholder="Example: On Locks · Office the Alerts tab won't load on my phone."></textarea></label>
    <p class="muted" style="margin:0 0 10px">Goes to Brandon in Slack and saves to the hub list. Don't type codes or passwords here.</p>
    <div style="display:flex;gap:8px"><button class="btn" id="fbcancel">Cancel</button><button class="btn primary" style="flex:1" id="fbsend">Send</button></div>
    <p class="muted" id="fbmsg"></p></div></div>`;
  $("#out").onclick = async () => { await sb.auth.signOut(); location.hash = ""; loginView(); };
  $("#menu").onclick = () => document.body.classList.toggle("open");
  $("#scrim").onclick = () => document.body.classList.remove("open");
  let kind = "bug";
  document.querySelectorAll("#kind button").forEach(b => b.onclick = () => { kind = b.dataset.v;
    document.querySelectorAll("#kind button").forEach(x => x.classList.toggle("on", x === b)); });
  $("#fbopen").onclick = e => { e.preventDefault(); $("#fbmsg").textContent = ""; $("#fb").classList.add("on"); $("#fbtext").focus(); };
  $("#fbcancel").onclick = () => $("#fb").classList.remove("on");
  $("#fbsend").onclick = async () => {
    const body = $("#fbtext").value.trim(); if(body.length < 3) return $("#fbmsg").textContent = "Write a little more first.";
    $("#fbsend").disabled = true; $("#fbmsg").textContent = "Sending…";
    const cur = DESKS.find(x => x.key === current());
    const r = await sb.functions.invoke("hub-feedback", { body:{ kind, body, desk: cur ? cur.key : "", deskLabel: cur ? cur.label : "", page: location.href } });
    $("#fbsend").disabled = false;
    if(r.error || !r.data || !r.data.ok){ $("#fbmsg").textContent = "Couldn't send: " + ((r.data && r.data.error) || (r.error && r.error.message) || "try again"); return; }
    $("#fbtext").value = ""; $("#fbmsg").textContent = "Sent - thanks! Brandon will see it." ;
    setTimeout(() => $("#fb").classList.remove("on"), 1200);
  };
}
const current = () => (location.hash.replace(/^#\/?/, "").split("/")[0]) || "";
function route(){
  if(!ME) return;
  document.body.classList.remove("open");
  let k = current();
  if(!k){ const first = DESKS.find(x => x.status === "live"); k = first ? first.key : "reports"; history.replaceState(null, "", "#/" + k); }
  document.querySelectorAll(".dk[data-k]").forEach(a => a.classList.toggle("on", a.dataset.k === k));
  const v = $("#view"), d = DESKS.find(x => x.key === k);
  $("#ttl").textContent = d ? d.label : (k === "reports" ? "Bugs & upgrades" : "Moose Hub");
  if(k === "reports") return reportsView(v);
  if(k === "sync") return syncView(v);
  if(k === "home") return homeView(v);
  if(!d){ v.innerHTML = `<div class="page"><div class="card"><h2>No access</h2><p class="muted">This desk isn't on your teams. Ask Brandon or Kim.</p></div></div>`; return; }
  if(d.status !== "live" || !d.url){ v.innerHTML = `<div class="page"><div class="card"><span class="pill amber">Coming soon</span><h2 style="margin-top:10px">${esc(d.label)}</h2>
      <p class="muted">This desk is being moved into the hub. Want something on it? Use <b>Report a bug / upgrade</b> at the bottom of the sidebar.</p></div></div>`; return; }
  v.innerHTML = `<iframe class="desk" id="deskframe" title="${esc(d.label)}" src="${esc(d.url)}"></iframe>`;
  const f = $("#deskframe");
  f.addEventListener("load", () => { try {   // same site: hide the old "jump to other desk" header buttons - the sidebar does that now
    const doc = f.contentDocument, st = doc.createElement("style");
    st.textContent = `header.top .deskbtn{display:none!important}`; doc.head.appendChild(st);
  } catch(e){} });
}
async function reportsView(v){
  v.innerHTML = `<div class="page"><h2>${ME.admin ? "Bugs & upgrades" : "My reports"}</h2><p class="muted">${ME.admin ? "Everything the crew has sent. Change the status as you work them." : "What you've sent Brandon and where it stands."}</p><div class="card" id="fblist"><p class="muted">Loading…</p></div></div>`;
  const r = await sb.from("hub_feedback").select("id,created_at,user_name,desk_key,kind,body,status,admin_note").order("created_at", { ascending:false }).limit(300);
  const box = $("#fblist");
  if(r.error) return box.innerHTML = `<p class="muted">Couldn't load: ${esc(r.error.message)}</p>`;
  if(!r.data.length) return box.innerHTML = `<p class="muted">Nothing yet.</p>`;
  const label = { bug:"🐞 Bug", upgrade:"⬆️ Upgrade", idea:"💡 Idea" }, tone = { new:"red", seen:"blue", doing:"amber", done:"green", wont:"" };
  const deskName = k => (DESKS.find(x => x.key === k) || {}).label || k || "Hub";
  box.innerHTML = r.data.map(x => `<div class="fb"><div class="hd"><b>${label[x.kind]||x.kind}</b><span class="pill ${tone[x.status]||""}">${esc(x.status)}</span>
      <span class="muted">#${x.id} · ${esc(x.user_name||"")} · ${esc(deskName(x.desk_key))} · ${new Date(x.created_at).toLocaleString()}</span>
      ${ME.admin ? `<select data-id="${x.id}" style="width:auto;min-height:34px;padding:4px 8px;margin-left:auto">${["new","seen","doing","done","wont"].map(s => `<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select>` : ""}</div>
      <p>${esc(x.body)}</p>${x.admin_note ? `<p class="muted">Brandon: ${esc(x.admin_note)}</p>` : ""}</div>`).join("");
  box.querySelectorAll("select[data-id]").forEach(s => s.onchange = async () => {
    const u = await sb.from("hub_feedback").update({ status:s.value }).eq("id", s.dataset.id);
    if(u.error){ s.insertAdjacentHTML("afterend", `<span class="muted"> couldn't save: ${esc(u.error.message)}</span>`); } });
}
/* Home: weather (Open-Meteo, no key), company news + shout-outs (hub_posts) */
const WX = { 0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Fog",51:"Drizzle",53:"Drizzle",55:"Drizzle",61:"Rain",63:"Rain",65:"Heavy rain",
  66:"Freezing rain",67:"Freezing rain",71:"Snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Heavy snow showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm" };
async function homeView(v){
  const first = (ME.name||"").split(" ")[0];
  v.innerHTML = `<div class="page"><h2>Hi ${esc(first)} 👋</h2><p class="muted">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p>
    <div class="card" id="wx"><p class="muted">Loading Park City weather…</p></div>
    <div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:17px">🎉 Shout-outs</b><button class="btn small" style="margin-left:auto" id="soadd">Give a shout-out</button></div>
      <div id="soform" style="display:none"><label class="field"><span>Who?</span><input id="soabout" placeholder="Example: Dave"></label>
      <label class="field"><span>What did they do?</span><textarea id="sobody" style="min-height:80px" placeholder="Example: Fixed the hot tub at BHL 1206 before the guests landed."></textarea></label>
      <button class="btn primary" id="sosend">Post</button> <span class="muted" id="somsg"></span></div><div id="solist"></div></div>
    <div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:17px">📣 Company news</b>${ME.canNews ? `<button class="btn small" style="margin-left:auto" id="nwadd">Post news</button>` : ""}</div>
      <div id="nwform" style="display:none"><label class="field"><span>Headline</span><input id="nwtitle"></label><label class="field"><span>Details</span><textarea id="nwbody" style="min-height:80px"></textarea></label>
      <button class="btn primary" id="nwsend">Post</button> <span class="muted" id="nwmsg"></span></div><div id="nwlist"></div></div>
    <div class="card"><b style="font-size:17px">🗞️ Park City news</b><p class="muted">Coming next: local headlines from a news source Brandon picks.</p></div></div>`;
  fetch("https://api.open-meteo.com/v1/forecast?latitude=40.6461&longitude=-111.4980&current=temperature_2m,weather_code,wind_speed_10m,snowfall&daily=weather_code,temperature_2m_max,temperature_2m_min,snowfall_sum&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FDenver&forecast_days=4")
    .then(r => r.json()).then(w => { const c = w.current, d = w.daily;
      $("#wx").innerHTML = `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div><div class="muted">Park City now</div><div style="font-size:34px;font-weight:800">${Math.round(c.temperature_2m)}°</div><div>${WX[c.weather_code]||""} · wind ${Math.round(c.wind_speed_10m)} mph</div></div>
        <div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap">${d.time.map((t,i) => `<div style="text-align:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;min-width:74px"><div class="muted">${i ? new Date(t+"T12:00").toLocaleDateString(undefined,{weekday:"short"}) : "Today"}</div><b>${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</b><div class="muted" style="font-size:12px">${WX[d.weather_code[i]]||""}${d.snowfall_sum[i] > 0 ? " · " + d.snowfall_sum[i].toFixed(1) + '" snow' : ""}</div></div>`).join("")}</div></div>
        <p class="muted" style="margin:8px 0 0;font-size:12px">Source: Open-Meteo forecast for Park City, ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</p>`; })
    .catch(() => $("#wx").innerHTML = `<p class="muted">Weather didn't load.</p>`);
  const r = await sb.from("hub_posts").select("*").eq("hidden", false).order("pinned", {ascending:false}).order("created_at", {ascending:false}).limit(60);
  const rows = r.data || [], when = t => new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const so = rows.filter(x => x.kind === "shoutout"), nw = rows.filter(x => x.kind === "news");
  $("#solist").innerHTML = so.length ? so.map(x => `<div class="fb"><div class="hd"><b>${esc(x.about_name||"")}</b><span class="muted">from ${esc(x.author_name||"")} · ${when(x.created_at)}</span></div><p>${esc(x.body)}</p></div>`).join("") : `<p class="muted">No shout-outs yet. Be the first.</p>`;
  $("#nwlist").innerHTML = nw.length ? nw.map(x => `<div class="fb"><div class="hd">${x.pinned ? `<span class="pill green">Pinned</span>` : ""}<b>${esc(x.title||"")}</b><span class="muted">${esc(x.author_name||"")} · ${when(x.created_at)}</span></div><p>${esc(x.body)}</p></div>`).join("") : `<p class="muted">No news yet.</p>`;
  $("#soadd").onclick = () => { $("#soform").style.display = "block"; $("#soabout").focus(); };
  $("#sosend").onclick = async () => { const p = await sb.rpc("hub_post", { p_kind:"shoutout", p_title:"", p_body:$("#sobody").value, p_about:$("#soabout").value });
    if(p.error) $("#somsg").textContent = "Couldn't post: " + p.error.message; else homeView(v); };
  if(ME.canNews){ $("#nwadd").onclick = () => { $("#nwform").style.display = "block"; $("#nwtitle").focus(); };
    $("#nwsend").onclick = async () => { const p = await sb.rpc("hub_post", { p_kind:"news", p_title:$("#nwtitle").value, p_body:$("#nwbody").value, p_about:"" });
      if(p.error) $("#nwmsg").textContent = "Couldn't post: " + p.error.message; else homeView(v); }; }
}
async function syncView(v){
  v.innerHTML = `<div class="page"><h2>Sync</h2><p class="muted">Admins only. Last run of every data source, and one button to pull everything now.</p>
    <div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="syncall">Sync everything now</button><span class="muted" id="syncmsg"></span></div></div>
    <div class="card" id="srcs"><p class="muted">Loading…</p></div></div>`;
  const ago = t => { if(!t) return "no report yet"; const m = Math.round((Date.now() - new Date(t)) / 60000);
    return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m/60) + " h ago" : Math.round(m/1440) + " days ago"; };
  const [s, q] = await Promise.all([ sb.from("hub_sync_sources").select("*").order("sort"),
    sb.from("hub_sync_requests").select("*").order("id", { ascending:false }).limit(1) ]);
  if(s.error) return $("#srcs").innerHTML = `<p class="muted">Couldn't load: ${esc(s.error.message)}</p>`;
  $("#srcs").innerHTML = s.data.map(x => { const age = x.last_ok_at ? (Date.now() - new Date(x.last_ok_at)) / 36e5 : null;
      const tone = x.last_status === "error" ? "red" : age == null ? "" : age < 6 ? "green" : age < 26 ? "amber" : "red";
      return `<div class="fb"><div class="hd"><b>${esc(x.label)}</b><span class="pill ${tone}">${x.last_status === "error" ? "error" : ago(x.last_ok_at)}</span>
        <span class="muted" style="margin-left:auto">${esc(x.runs_on||"")} · ${esc(x.schedule||"")}</span></div>${x.last_detail ? `<p class="muted">${esc(x.last_detail)}</p>` : ""}</div>`; }).join("");
  const last = (q.data||[])[0];
  if(last) $("#syncmsg").textContent = last.done_at ? "Last full sync finished " + ago(last.done_at) + (last.result ? " - " + last.result : "") : "Full sync asked " + ago(last.requested_at) + " - waiting for the ThinkStation to pick it up.";
  $("#syncall").onclick = async () => { $("#syncall").disabled = true; const r = await sb.rpc("hub_sync_request");
    $("#syncmsg").textContent = r.error ? "Couldn't ask: " + r.error.message : "Asked. The ThinkStation will run every sync and update this list.";
    setTimeout(() => { $("#syncall").disabled = false; }, 4000); };
}
window.addEventListener("hashchange", route);
sb.auth.onAuthStateChange(ev => { if(ev === "SIGNED_OUT") { ME = null; loginView(); } });
boot();
</script>
