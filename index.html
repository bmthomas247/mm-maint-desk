<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3c5f12">
<title>Moose Hub</title>
<link rel="icon" href="moose-logo.png">
<link rel="apple-touch-icon" href="moose-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --moose:#88B535; --moose-2:#A6CE39; --moose-ink:#2f4710; --moose-soft:#eef5e0;
  --forest:#3c5f12; --forest-2:#5b8a1e; --pine:#4f7a18; --pine-soft:#eaf3da;
  --ground:#f5f7f0; --card:#ffffff; --ink:#15201a; --ink-2:#3d4a42; --muted:#6b776f; --line:#e1e7de; --line-2:#cfd8cb;
  --red:#c8382b; --red-soft:#fbe7e4; --amber:#b5770a; --amber-soft:#fbf0d9; --blue:#2463a0; --blue-soft:#e3edf8;
  --radius:18px; --tap:48px; --shadow:0 1px 2px rgba(20,40,25,.06), 0 4px 14px rgba(20,40,25,.06); --rail:232px;
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-feature-settings:"tnum" 1;
  color:var(--ink); background:var(--ground);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1410; --card:#151f19; --ink:#e8efe9; --ink-2:#b8c6bc; --muted:#8a998f; --line:#223028; --line-2:#2c3c33;
  --pine-soft:#173026; --moose-soft:#1e2a10; --moose-ink:#cfe79a; --red-soft:#3a1714; --amber-soft:#33270c; --blue-soft:#13283d;
  --shadow:0 1px 2px rgba(0,0,0,.3); } }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);-webkit-font-smoothing:antialiased}
a{color:var(--pine)}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:14px;min-height:var(--tap);padding:0 16px;
  font:inherit;font-weight:800;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.98)} .btn.primary{background:var(--forest-2);border-color:var(--forest-2);color:#fff}
.btn.small{min-height:36px;font-size:13.5px;padding:0 12px;border-radius:11px} .btn.wide{width:100%} .btn:disabled{opacity:.5}
.field{display:block;margin:10px 0;text-align:left} .field span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:700}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:var(--tap);border:1px solid var(--line-2);border-radius:13px;padding:10px 13px;background:var(--card);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--moose-soft);border-color:var(--moose)}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink-2)}
.pill.green{background:var(--moose-soft);color:var(--moose-ink)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.red{background:var(--red-soft);color:var(--red)} .pill.blue{background:var(--blue-soft);color:var(--blue)}

/* layout */
.shell{display:grid;grid-template-columns:fit-content(420px) 1fr;height:100vh;height:100dvh}
aside.rail{min-width:var(--rail)}
aside.rail{background:linear-gradient(180deg,var(--forest),#2e4a0e);color:#fff;display:flex;flex-direction:column;min-height:0;
  padding:14px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.logo{position:relative;width:42px;height:42px;flex:none}
.logo img{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 2px 8px rgba(0,0,0,.25);display:block}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{font-size:12.5px;opacity:.75;font-weight:600}
nav.desks{flex:1 0 auto;display:flex;flex-direction:column;gap:3px;padding-right:2px}
aside.rail{overflow-y:auto;overscroll-behavior:contain}
.dk{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 10px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px;opacity:.88}
.dk:hover{background:rgba(255,255,255,.08);opacity:1}
.dk.on{background:rgba(255,255,255,.16);opacity:1;box-shadow:inset 3px 0 0 var(--moose-2)}
.dk .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.dk.on .ic{background:var(--moose);color:#16220a}
.dk .ic svg{width:17px;height:17px}
.dk .lb{flex:1;min-width:0;white-space:nowrap}
.dk.sub .lb{white-space:nowrap}
.dk .soon{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.65}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;opacity:.55;margin:12px 10px 4px}
.foot{border-top:1px solid rgba(255,255,255,.14);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:3px}
/* profile, settings, sign out: top right (2026-10-28) - .ubar on computers, inside the green .topbar on phones */
.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
/* the one green banner on every page (Brandon 2026-10-28): page name left, me right; desks inside drop their own header */
.ubar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:linear-gradient(135deg,var(--forest),var(--forest-2));color:#fff;box-shadow:0 2px 12px rgba(10,30,20,.18);flex:none;position:relative;z-index:1}
.ubar #utl{flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubar .me .nm small{color:rgba(255,255,255,.75)}
.ubar a.mgear,.ubar .me button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.ubar a.mgear:hover,.ubar a.mgear.on,.ubar .me button:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
.me{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#fff}
.me .av{width:30px;height:30px;border-radius:50%;background:var(--moose);color:#16220a;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.me .nm{min-width:0;line-height:1.2;font-weight:700} .me .nm small{display:block;color:var(--muted);font-weight:600;font-size:11.5px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
a.mlink{display:flex;align-items:center;gap:9px;min-width:0;color:inherit;text-decoration:none;border-radius:10px}
a.mlink:hover .nm{text-decoration:underline}
a.mgear{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:inherit;background:var(--ground);border:1px solid var(--line)} a.mgear:hover,a.mgear.on{background:var(--moose-soft);border-color:var(--moose)} a.mgear svg{width:17px;height:17px}
.av img,.avbig img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avbig{width:88px;height:88px;border-radius:50%;background:var(--moose);color:#16220a;display:grid;place-items:center;font-weight:800;font-size:28px;flex:none;overflow:hidden}
.ment{display:block;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit} .ment:last-child{border-bottom:0}
.ment .mt{font-size:14.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.bday{background:linear-gradient(135deg,#fff4d6,var(--card));border-color:#f1d48a}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .bday{background:linear-gradient(135deg,#3a2f12,var(--card));border-color:#5a4a1c} }
.bday .big{font-size:20px;font-weight:800;margin:6px 0 2px}
.bdrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)} .bdrow:last-child{border-bottom:0}
.bdsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .bdsel select{width:auto;min-height:40px}
.me button{background:none;border:1px solid var(--line);border-radius:9px;min-height:32px;padding:0 11px;color:var(--ink-2);font:inherit;font-weight:700;font-size:12.5px;cursor:pointer} .me button:hover{background:var(--ground)}
main.view{min-width:0;min-height:0;display:flex;flex-direction:column;flex:1}
iframe.desk{border:0;width:100%;flex:1;background:var(--ground)}
.page{max-width:760px;margin:0 auto;padding:24px 16px;width:100%;overflow:auto}
h2{font-size:24px;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
.topbar{display:none}
.shead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--ground);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
i.g,i.o{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--moose);vertical-align:middle} i.o{background:var(--blue)}
.sgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.sday{border:1px solid var(--line);border-radius:12px;padding:6px 4px 7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.sday.on{border-color:var(--moose);background:var(--moose-soft)}
.sday .dw{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sday .dd{font-size:12px;color:var(--muted);font-weight:700}
.sday b{font-size:20px;line-height:1.15;margin:2px 0}
.sday .go{font-size:11px;color:var(--ink-2);font-weight:700;display:flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:center}
.sday .go i{margin-left:2px}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0} .srow .su{min-width:84px} .srow .sg{flex-basis:100%;font-size:14px;font-weight:600;padding-left:2px}
.daily{background:linear-gradient(135deg,var(--moose-soft),var(--card))}
.dhd{display:flex;align-items:center;gap:8px} .dq{font-size:18px;font-weight:700;line-height:1.4;margin:10px 0 6px}
@media (max-width:520px){ .sgrid{gap:4px} .sday b{font-size:17px} .sday .go{font-size:10px} }
details.acc2{border-top:1px solid var(--line);padding:10px 0 0;margin-top:10px}
details.acc2>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
details.acc2>summary::-webkit-details-marker{display:none}
details.acc2>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg)}
details.acc2[open]>summary::after{transform:rotate(-135deg)}
details.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc[open]>summary{margin-bottom:6px}
/* Track-style rail: ☰ opens/closes it, search on top, Locks has a drop-down (2026-10-27) */
.shell{transition:grid-template-columns .18s ease}
.railtop{display:flex;align-items:center;gap:8px;padding:0 2px 10px}
.rtoggle{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.rtoggle svg{width:20px;height:20px} .rtoggle:hover{background:rgba(255,255,255,.16)}
.railtop .brand{padding:0;flex:1;min-width:0}
.railtop .brand>div{min-width:0}.railtop .brand small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railtop .brand .logo,.railtop .brand .logo img{width:36px;height:36px}
.rsearch{position:relative;margin:0 2px 10px}
.rsearch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.75;pointer-events:none;display:grid}
.rsearch .ic svg{width:17px;height:17px}
.rsearch input{min-height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;padding:8px 10px 8px 36px;font-size:14.5px;font-weight:600}
.rsearch input::placeholder{color:rgba(255,255,255,.65)}
.rsearch input:focus{outline:2px solid var(--moose-2);border-color:transparent}
.sres{display:none;flex-direction:column;gap:2px;margin:0 2px 8px;max-height:46vh;overflow:auto;background:rgba(0,0,0,.18);border-radius:12px;padding:6px}
.sres.on{display:flex}
.sres .sh{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;opacity:.6;margin:6px 8px 2px}
.sres a{display:flex;flex-direction:column;padding:7px 9px;border-radius:9px;color:#fff;text-decoration:none;font-weight:700;font-size:13.5px}
.sres a small{opacity:.7;font-weight:600;font-size:11.5px}
.sres a:hover,.sres a.hi{background:rgba(255,255,255,.14)}
.sres .none{padding:8px 9px;opacity:.7;font-size:13px}
.dk .chev{width:16px;height:16px;flex:none;opacity:.7;transition:transform .15s}
.dk .chev svg{width:16px;height:16px}
.gbox.open>.par .chev{transform:rotate(90deg)}
.gbox .subs{display:none;flex-direction:column;gap:2px;margin:2px 0 4px}
.gbox.open .subs{display:flex}
.dk.sub{min-height:36px;padding-left:51px;font-size:13.5px;font-weight:700}
.dk.sub.on{box-shadow:inset 3px 0 0 var(--moose-2)}
@media (min-width:821px){
  body.mini{--rail:70px} body.mini .shell{grid-template-columns:var(--rail) 1fr} body.mini aside.rail{min-width:0}
  body.mini aside.rail{padding-left:8px;padding-right:8px}
  body.mini .railtop .brand,body.mini .dk .lb,body.mini .dk .soon,body.mini .dk .chev,body.mini .grp,body.mini .gbox .subs,body.mini .sres{display:none!important}
  body.mini .railtop{flex-direction:column}
  body.mini .rsearch input{padding:0;width:40px;min-height:40px;color:transparent;cursor:pointer;margin:0 auto;display:block}
  body.mini .rsearch input::placeholder{color:transparent}
  body.mini .rsearch .ic{left:50%;transform:translate(-50%,-50%)}
  body.mini .dk{justify-content:center;padding:0}
}
/* phones: rail becomes a slide-out drawer */
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  aside.rail{position:fixed;inset:0 auto 0 0;width:max-content;min-width:min(84vw,300px);max-width:94vw;overflow-y:auto;z-index:20;transform:translateX(-102%);transition:transform .2s ease;box-shadow:4px 0 24px rgba(0,0,0,.3)}
  body.open aside.rail{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;display:none} body.open .scrim{display:block}
  .topbar{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--forest),var(--forest-2));color:#fff;
    padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
  .topbar b{font-size:17px;font-weight:800}
  .ubar{display:none}
  .topbar .me{margin-left:auto;color:#fff;gap:8px} .topbar .me .nm{display:none}
  .topbar a.mgear{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
  .topbar .me button{width:auto;height:auto;min-height:36px;color:#fff;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.1)}
}
.login{max-width:420px;margin:60px auto;padding:0 16px;text-align:center}
.login .logo{width:84px;height:84px;margin:0 auto 12px}.login .logo img{width:84px;height:84px}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex} .modal .card{width:min(520px,100%);margin:0}
/* 2-step sign-in (2026-10-28), Moose Locks look */
.tsbar{display:flex;justify-content:flex-start;margin:-36px 0 12px}
.login .logo{position:relative} .login .logo .lk{position:absolute;right:-4px;bottom:-4px;width:32px;height:32px;border-radius:50%;background:var(--forest-2);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px var(--ground)}
.login .logo .lk svg{width:17px;height:17px}
.how{margin:8px 0 4px;padding:0;list-style:none;display:grid;gap:6px;text-align:left}
.how li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35}
.how .key{flex:0 0 auto;min-width:44px;text-align:center;padding:6px 8px;border-radius:10px;background:var(--card);border:2px solid var(--line);font-weight:900;font-size:16px}
.pwr{list-style:none;margin:2px 0 8px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;text-align:left;font-size:13.5px;color:var(--muted);font-weight:700}
.pwr li.ok{color:var(--forest-2)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px} .seg button{flex:1;min-width:110px}
.seg button.on{background:var(--moose-soft);border-color:var(--moose);color:var(--moose-ink)}
.fb{border-top:1px solid var(--line);padding:12px 0}.fb:first-child{border-top:0}
.fb .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.fb p{margin:6px 0 0;white-space:pre-wrap}
/* Ask Penny (2026-10-28): helper button bottom-right on every page, chat panel, hello bubble on Home */
#pennyBtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:8px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--forest),var(--forest-2));color:#fff;border-radius:999px;padding:8px 16px 8px 8px;font:inherit;font-weight:800;font-size:15px;box-shadow:0 6px 20px rgba(20,40,25,.3)}
#pennyBtn .pav,.pmsg .pav{width:38px;height:38px;border-radius:50%;background:var(--moose);color:#16220a;display:grid;place-items:center;font-size:20px;flex:none}
#pennyBtn:hover{filter:brightness(1.08)}
#pennyHi{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;max-width:300px;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 4px 18px;box-shadow:var(--shadow);padding:12px 14px;font-size:15px;display:none}
#pennyHi.on{display:block} #pennyHi .phimg{float:left;height:110px;margin:-4px 8px 0 -6px;border-radius:12px}
#pennyBtn .pav img,.pmsg .pav img,#pennyBox .ph .pav img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
#pennyBtn .pav,.pmsg .pav{overflow:hidden;background:#eef5e0} #pennyHi b{display:block;margin-bottom:4px} #pennyHi .x{position:absolute;top:6px;right:8px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px}
#pennyHi .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px} #pennyHi .chips button{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
#pennyBox{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:51;width:min(400px,calc(100vw - 24px));height:min(560px,calc(100dvh - 110px));background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 40px rgba(20,40,25,.28);display:none;flex-direction:column;overflow:hidden}
#pennyBox.on{display:flex}
#pennyBox .ph{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(135deg,var(--forest),var(--forest-2));color:#fff}
#pennyBox .ph b{flex:1;font-size:16px} #pennyBox .ph small{display:block;font-weight:600;opacity:.8;font-size:12px}
#pennyBox .ph button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:5px 10px;font:inherit;font-weight:800;cursor:pointer}
#pennyLog{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--ground)}
.pmsg{display:flex;gap:8px;align-items:flex-start} .pmsg .pav{width:28px;height:28px;font-size:15px}
.pmsg .bub{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;max-width:85%}
.pmsg>div{min-width:0;max-width:85%} .pmsg>div>.bub{max-width:none;display:inline-block}
.pmsg .bub.wait{min-width:150px;color:var(--muted)} .pmsg .bub.wait i{display:inline-block;width:6px;height:6px;margin-left:3px;border-radius:50%;background:currentColor;animation:pdot 1.2s infinite ease-in-out}
.pmsg .bub.wait i:nth-child(2){animation-delay:.2s} .pmsg .bub.wait i:nth-child(3){animation-delay:.4s}
@keyframes pdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.pmsg .bub.wait i{animation:none;opacity:.6}}
.pmsg.me{justify-content:flex-end} .pmsg.me .bub{background:var(--moose-soft);border-color:transparent;border-radius:14px 4px 14px 14px}
.pmsg .fbk{display:flex;gap:4px;margin-top:4px} .pmsg .fbk button{border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-size:13px;padding:2px 7px}
.pmsg .fbk button.on{background:var(--moose-soft);border-color:var(--moose)}
.pmsg .plinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px} .pmsg .plinks a{text-decoration:none}
.pmsg .pask{margin-top:6px} .pmsg .pask textarea{width:100%;min-height:0;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
#pennyForm{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--card)}
#pennyPic{min-height:44px;min-width:44px;padding:0 10px;font-size:18px} #pennyPicChip{display:none;align-items:center;gap:6px;padding:6px 10px 0;font-size:13px;color:var(--muted)} #pennyPicChip.on{display:flex}
#pennyPicChip img,.pmsg .pphoto{max-height:64px;border-radius:8px;border:1px solid var(--line)} .pmsg .pphoto{display:block;max-height:140px;margin-bottom:4px}
.pmsg .pacts{display:flex;flex-direction:column;gap:6px;margin-top:8px} .pmsg .pacts .pa{border:1px dashed var(--moose);border-radius:10px;padding:8px 10px;font-size:13.5px}
.pmsg .pacts .pa b{display:block;margin-bottom:6px;font-weight:600}
#pennyForm textarea{min-height:44px;height:44px;resize:none;font-size:15px;padding:10px 12px}
@media (max-width:820px){ #pennyBtn .plb{display:none} #pennyBtn{padding:8px} }

/* Reports index, Track-style columns (2026-10-28) */
.page.wide{max-width:1240px}
.rpgrid{columns:4 250px;column-gap:14px}
.rpg{break-inside:avoid;display:inline-block;width:100%;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.rpg h3{font-size:17px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em}
.rpl{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:14.5px;font-weight:700;color:var(--pine);text-decoration:none;border-top:1px solid var(--line)}
.rpg h3+.rpl{border-top:0} .rpl:hover{text-decoration:underline} .rpl.soon{color:var(--muted);font-weight:600}
.rpl .pill{font-size:10.5px;padding:2px 7px}
.rpsub{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 2px;padding-top:8px;border-top:1px solid var(--line)}
.rpsub+.rpl{border-top:0}
/* My settings (2026-10-28) */
.ord{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)} .ord:last-child{border-bottom:0}
.ord .oi{width:32px;height:32px;border-radius:9px;background:var(--moose-soft);color:var(--moose-ink);display:grid;place-items:center;flex:none} .ord .oi svg{width:17px;height:17px}
.ord b{flex:1;min-width:0} .ord .btn.small{min-width:40px;padding:0 10px}
.ints{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0} .ints label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer;background:var(--card)}
.ints input{width:auto;min-height:0;margin:0} .ints label.on{background:var(--moose-soft);border-color:var(--moose);color:var(--moose-ink)}

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>

<script src="calendar.js"></script>

<script>
const C = window.MM_CONFIG;
const sb = supabase.createClient(C.url, C.anonKey, { auth:{ persistSession:true, detectSessionInUrl:true, flowType:"implicit" } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");
const I = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  lock: I('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  key: I('<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M16 7l3 3M14 9l2 2"/>'),
  wrench: I('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>'),
  calendar: I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'),
  chart: I('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  home: I('<path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/>'),
  badge: I('<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/>'),
  dollar: I('<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
  target: I('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
  megaphone: I('<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1zM17 9a4 4 0 0 1 0 6"/>'),
  chat: I('<path d="M21 12a8 8 0 0 1-11.8 7L4 20l1-4.6A8 8 0 1 1 21 12z"/>'),
  spark: I('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>'),
  bug: I('<rect x="7" y="7" width="10" height="13" rx="5"/><path d="M12 7V4M9 4l1.5 2M15 4l-1.5 2M3 12h4M17 12h4M4 18l3-2M20 18l-3-2M4 7l3 2M20 7l-3 2"/>'),
  list: I('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
  people: I('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.8"/>'),
  trash: I('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/>'),
  truck: I('<path d="M1 4h13v12H1zM14 8h4l4 4v4h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>'),
  search: I('<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>'),
  chev: I('<path d="m9 6 6 6-6 6"/>'),
  menu: I('<path d="M4 6h16M4 12h16M4 18h16"/>'),
  gear: I('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  grid: I('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>')
};
let ME = null, DESKS = [], PREFS = { desk_order:[], interests:[], kinds:[] };

/* ---------- sign in (same accounts as Moose Locks and the Maintenance site) */
function loginView(msg){
  document.querySelectorAll("#pennyBtn,#pennyHi,#pennyBox").forEach(e => e.remove());
  app.innerHTML = `<div class="login"><div class="logo"><img src="moose-logo.png" alt="Moose Management"></div><h2>Moose Hub</h2>
    <p class="muted">Same sign-in as Moose Locks.</p>
    <label class="field"><span>Email</span><input type="email" id="em" autocomplete="username"></label>
    <label class="field"><span>Password</span><input type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn primary wide" id="go">Sign in</button>
    <button class="btn wide" id="link" style="margin-top:8px">First time or forgot it? Email me a code</button>
    <div id="codebox" style="display:none;margin-top:10px"><label class="field"><span>Code from the email</span><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Example: 123456" style="font-size:24px;letter-spacing:6px;text-align:center"></label>
      <button class="btn primary wide" id="otpgo">Sign in with code</button></div>
    <p id="msg" class="muted">${esc(msg||"")}</p></div>`;
  const fixEm = () => { let e = $("#em").value.trim().toLowerCase().replace(/\s+/g,"");
    e = e.replace(/@m[o0]+s[e]?m[a-z]*ment\.c[o0]m?$/, "@moosemanagement.com"); $("#em").value = e; return e; };
  $("#go").onclick = async () => { const { data, error } = await sb.auth.signInWithPassword({ email:fixEm(), password:$("#pw").value });
    if(error) return $("#msg").textContent = "Wrong email or password.";
    if(data && data.weakPassword) TS.weak = true;   // older password that doesn't meet today's rules -> must pick a new one
    boot(); };
  $("#pw").addEventListener("keydown", e => { if(e.key === "Enter") $("#go").click(); });
  $("#link").onclick = async () => { const email = fixEm(); if(!email) return $("#msg").textContent = "Type your email first.";
    $("#msg").textContent = "Sending…";
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } });
    if(!error){ $("#codebox").style.display = "block"; $("#otp").focus(); }
    $("#msg").textContent = !error ? "Code sent to " + email + "." : "Couldn't send the code (" + error.message + ")."; };
  $("#otpgo").onclick = async () => { const { error } = await sb.auth.verifyOtp({ email:$("#em").value.trim().toLowerCase(), token:$("#otp").value.replace(/\D/g,""), type:"email" });
    if(error) $("#msg").textContent = "That code didn't work - send a new one."; else boot(); };
}

/* ---------- 2-step sign-in (authenticator app), same as Moose Locks. hub_two_step.sql decides when it's required:
   anyone who set up the app always types a code; with the switch on "all", everyone without it sets it up first.
   The code is asked once per device - the session stays at 2-step until they sign out. */
const TS = { ok:false, weak:false, mc:undefined, busy:false };
const PW_SYM = /[!@#$%^&*()_+\-=\[\]{};'\\:"|<>?,./`~]/;
const qrSrc = q => { const i = q.indexOf(","); return q.startsWith("data:") && i > 0 && !/;base64,/.test(q.slice(0, i+1)) ? "data:image/svg+xml;charset=utf-8," + encodeURIComponent(q.slice(i+1)) : q; };
const codeIn = `<input id="tsc" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456" style="font-size:24px;letter-spacing:6px;text-align:center">`;
function tsShell(title, inner, help = true){
  app.innerHTML = `<div class="login" style="max-width:440px"><div class="tsbar"><button class="btn small" id="tsback">← Back</button></div>
    <div class="logo"><img src="moose-logo.png" alt="Moose Management"><span class="lk">${ICON.lock}</span></div><h2>${title}</h2>${inner}
    ${help ? `<p class="muted" style="margin-top:14px"><a href="#" id="tshelp">New phone or lost it?</a></p>` : ""}</div>
    <div class="modal" id="tsm"><div class="card" style="text-align:left">
      <div style="display:flex;align-items:center;gap:10px"><button class="btn small" id="tsmback">← Back</button><h2 style="font-size:20px;flex:1;margin:0">New phone or lost it?</h2><button class="btn small" id="tsmx" aria-label="Close" title="Close" style="border-radius:50%;width:38px;padding:0">✕</button></div>
      <p>Ask Brandon or Kim to reset your 2-step sign-in. The next time you sign in you'll scan a new QR code with the new phone.</p>
      <p class="muted">Code keeps failing? The code changes every 30 seconds - type the newest one. Check your phone's clock is set automatically.</p></div></div>`;
  $("#tsback").onclick = async () => { await sb.auth.signOut(); };   // SIGNED_OUT -> back to the sign-in screen
  if(help) $("#tshelp").onclick = e => { e.preventDefault(); $("#tsm").classList.add("on"); };
  $("#tsmback").onclick = $("#tsmx").onclick = () => $("#tsm").classList.remove("on");
}
async function twoStep(){
  if(TS.ok) return true;
  let lv = null; try{ lv = (await sb.auth.mfa.getAuthenticatorAssuranceLevel()).data; }catch(e){}
  if(lv && lv.currentLevel === "aal2") return TS.ok = true;
  if(lv && lv.nextLevel === "aal2"){ tsCodeView(); return false; }
  let mode = "off"; try{ mode = (await sb.rpc("hub_two_step_mode")).data || "off"; }catch(e){}
  if(mode === "all"){ tsSetupView(); return false; }
  return TS.ok = true;
}
function tsCodeView(){
  tsShell("Enter your 6-digit code", `<p class="muted">Open your authenticator app (Google or Microsoft Authenticator) and type the Moose code - the same one you use for Moose Locks.</p>
    <label class="field"><span>Code</span>${codeIn}</label>
    <button class="btn primary wide" id="tsgo">Continue</button><p id="tsmsg" class="muted"></p>`);
  const go = async () => { $("#tsgo").disabled = true;
    try{ const { data:f } = await sb.auth.mfa.listFactors(); const t = (f.totp || [])[0];
      const { error } = await sb.auth.mfa.challengeAndVerify({ factorId:t.id, code:$("#tsc").value.replace(/\D/g,"") });
      if(error){ $("#tsgo").disabled = false; return $("#tsmsg").textContent = "That code didn't work - type the newest one from the app."; }
      TS.ok = true; boot(); }catch(e){ $("#tsgo").disabled = false; $("#tsmsg").textContent = "Something went wrong - try again."; } };
  $("#tsgo").onclick = go; $("#tsc").onkeyup = e => { if(e.key === "Enter" || $("#tsc").value.replace(/\D/g,"").length === 6) go(); }; $("#tsc").focus();
}
async function tsSetupView(){
  if(TS.busy) return; TS.busy = true; setTimeout(() => TS.busy = false, 4000);   // sign-in can fire twice; set up once
  tsShell("Turn on 2-step sign-in", `<p class="muted">One time only. After this you'll type a 6-digit code from your phone when you sign in on a new device.</p><div id="tsbox"><p class="muted">Getting your QR code…</p></div>`);
  try{
    const { data:f } = await sb.auth.mfa.listFactors();
    for(const x of (f.all || []).filter(x => x.status !== "verified")) await sb.auth.mfa.unenroll({ factorId:x.id });
    const { data, error } = await sb.auth.mfa.enroll({ factorType:"totp", friendlyName:"Moose Hub " + new Date().toISOString().slice(0,16).replace("T"," ") + " " + Math.random().toString(36).slice(2,6) });
    if(error) throw error;
    $("#tsbox").innerHTML = `<ol class="how">
        <li><span class="key">1</span><span>Install <b>Google Authenticator</b> or <b>Microsoft Authenticator</b> from the App Store / Google Play.</span></li>
        <li><span class="key">2</span><span>In the app tap <b>+</b> → <b>Scan a QR code</b> and scan this:</span></li></ol>
      <img src="${qrSrc(data.totp.qr_code)}" alt="QR code" style="width:200px;height:200px;background:#fff;padding:8px;border-radius:12px;margin:6px auto;display:block">
      <details style="margin:6px 0"><summary class="muted">Can't scan? Type this key instead</summary><code style="word-break:break-all">${esc(data.totp.secret)}</code></details>
      <ol class="how" start="3"><li><span class="key">3</span><span>Type the 6-digit code the app shows:</span></li></ol>
      ${codeIn}<button class="btn primary wide" id="tsgo" style="margin-top:8px">Turn it on</button><p id="tsmsg" class="muted"></p>`;
    const go = async () => { $("#tsgo").disabled = true;
      const { error:e2 } = await sb.auth.mfa.challengeAndVerify({ factorId:data.id, code:$("#tsc").value.replace(/\D/g,"") });
      $("#tsgo").disabled = false;
      if(e2) return $("#tsmsg").textContent = "That code didn't work - type the newest one from the app.";
      TS.ok = true; boot(); };
    $("#tsgo").onclick = go; $("#tsc").onkeyup = e => { if(e.key === "Enter") go(); };
  }catch(e){ $("#tsbox").innerHTML = `<p class="muted">Couldn't start 2-step setup (${esc(e.message || e)}). Ask Brandon or Kim.</p>`; }
}
/* new password: when an admin asked for it (allowed_users.must_change_pw) or the old one doesn't meet today's rules */
function pwMissing(p){ return [[p.length >= 12, "12+ characters"], [/[a-z]/.test(p), "a small letter"], [/[A-Z]/.test(p), "a capital letter"],
  [/\d/.test(p), "a number"], [PW_SYM.test(p), "a symbol like ! # ? @"]]; }
function pwView(){
  tsShell("Pick a new password", `<p class="muted">Moose passwords got stronger. Choose a new one now - only you will know it. It works for the Hub and Moose Locks.</p>
    <label class="field"><span>New password</span><input type="password" id="pw1" autocomplete="new-password"></label>
    <ul class="pwr" id="pwr"></ul>
    <label class="field"><span>Type it again</span><input type="password" id="pw2" autocomplete="new-password"></label>
    <div id="nonce" style="display:none"><label class="field"><span>Code we just emailed you</span><input id="pwn" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="font-size:22px;letter-spacing:6px;text-align:center"></label></div>
    <button class="btn primary wide" id="pwgo">Save my password</button><p id="pwmsg" class="muted"></p>`, false);
  const show = () => $("#pwr").innerHTML = pwMissing($("#pw1").value).map(([ok, t]) => `<li class="${ok ? "ok" : ""}">${ok ? "✓" : "○"} ${t}</li>`).join("");
  $("#pw1").oninput = show; show(); $("#pw1").focus();
  $("#pwgo").onclick = async () => { const a = $("#pw1").value, b = $("#pw2").value, n = $("#pwn").value.replace(/\D/g,"");
    if(pwMissing(a).some(([ok]) => !ok)) return $("#pwmsg").textContent = "Needs every item on the list.";
    if(a !== b) return $("#pwmsg").textContent = "The two don't match.";
    $("#pwmsg").textContent = "Saving…"; $("#pwgo").disabled = true;
    const { error } = await sb.auth.updateUser(n ? { password:a, nonce:n } : { password:a });
    $("#pwgo").disabled = false;
    if(error){
      if(error.code === "reauthentication_needed" || /reauthenticat/i.test(error.message)){
        await sb.auth.reauthenticate(); $("#nonce").style.display = "block"; $("#pwn").focus();
        return $("#pwmsg").textContent = "For safety we emailed you a 6-digit code. Type it above, then Save again."; }
      if(error.code === "same_password") return $("#pwmsg").textContent = "Pick something different from your old password.";
      if(/pwned|leak|breach/i.test(error.message)) return $("#pwmsg").textContent = "That password has shown up in a data leak online - pick a different one.";
      return $("#pwmsg").textContent = "Couldn't save (" + error.message + ")."; }
    try{ await sb.rpc("lock_pw_changed"); }catch(e){}
    TS.weak = false; TS.mc = false; boot(); };
}
/* old Maintenance site sends people here to finish 2-step, then gets them back */
const NEXT_OK = ["maint.html"];

/* ---------- shell */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return loginView();
  if(!(await twoStep())) return;
  if(TS.mc === undefined){ try{ TS.mc = !!(await sb.rpc("lock_must_change_pw")).data; }catch(e){ TS.mc = false; } }
  if(TS.mc || TS.weak) return pwView();
  const nx = new URLSearchParams(location.search).get("next");
  if(nx && NEXT_OK.includes(nx)) return location.replace(nx);
  const me = await sb.rpc("hub_me");
  if(me.error || !me.data){   // an admin may have signed this device out (hub_admin_access.sql): its session is gone
    const r = await sb.auth.refreshSession();
    if(r.error){ await sb.auth.signOut({ scope:"local" }); return loginView("You were signed out. Sign in again."); }
    return noAccess(me.error ? me.error.message : ""); }
  ME = me.data; ME.canNews = !!(await sb.rpc("hub_can_post_news")).data;
  const d = await sb.rpc("hub_my_desks"); DESKS = d.data || [];
  /* Maintenance drop-down (Brandon 2026-10-28): Workbench · Projects · Expenses & Time. Projects follows Maintenance;
     Expenses & Time follows the maint_money section (hub_can; RLS on desk_docs enforces it too). */
  const mD = DESKS.find(x => x.key === "maintenance" && x.status === "live");
  if(mD){ DESKS.push({ key:"maint_projects", label:"Maintenance · Projects", icon:mD.icon, url:"desk.html?only=projects", status:"live", sort:mD.sort + 0.1 });

/* Birthdays (2026-10-28): on the day, the week of (Mon-Sun), and the whole month during its first 7 days */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
async function loadBirthdays(){
  const box = $("#bdays"); if(!box) return;
  const r = await sb.rpc("hub_birthdays_all"); const all = r.data || []; if(!all.length) return;
  const t = new Date(); t.setHours(12,0,0,0); const y = t.getFullYear(), mo = t.getMonth() + 1, d = t.getDate();
  const mon = new Date(t); mon.setDate(d - ((t.getDay() + 6) % 7)); const wk = [...Array(7)].map((_, i) => { const x = new Date(mon); x.setDate(mon.getDate() + i); return x; });
  const isDay = (b, x) => b.month === x.getMonth() + 1 && b.day === x.getDate();
  const today = all.filter(b => isDay(b, t)), week = all.filter(b => wk.some(x => isDay(b, x)) && !isDay(b, t)), month = d <= 7 ? all.filter(b => b.month === mo) : [];
  if(!today.length && !week.length && !month.length) return;
  const first = n => esc(String(n || "").split(" ")[0]), when = b => new Date(y, b.month - 1, b.day, 12).toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  box.innerHTML = `<div class="card bday">
    ${today.length ? `<div class="big">🎂 Happy birthday, ${today.map(b => first(b.name)).join(" & ")}!</div><p class="muted" style="margin:0 0 6px">${today.some(b => b.me) ? "From all of us at Moose — have a great one!" : "Give them a shout-out below 🎉"}</p>` : ""}
    ${week.length ? `<b>🎈 Birthdays this week</b>${week.map(b => `<div class="bdrow"><b>${esc(b.name)}</b><span class="muted" style="margin-left:auto">${when(b)}</span></div>`).join("")}` : ""}
    ${month.length ? `<details class="acc2" ${today.length || week.length ? "" : "open"}><summary><b>🎉 ${MONTHS[mo - 1]} birthdays</b><span class="pill green">${month.length}</span></summary>${month.map(b => `<div class="bdrow"><b>${esc(b.name)}</b><span class="muted" style="margin-left:auto">${when(b)}</span></div>`).join("")}</details>` : ""}
  </div>`;
}

/* Reports > Sync (Brandon 2026-10-28): Manual sync (#/sync), Recent sync report (#/sync/recent), Error report (#/sync/errors) */
async function syncReport(v, kind){
  const ago = t => { if(!t) return "never"; const m = Math.round((Date.now() - new Date(t)) / 60000);
    return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m/60) + " h ago" : Math.round(m/1440) + " days ago"; };
  v.innerHTML = `<div class="page"><p style="margin:0 0 6px"><a href="#/reports">← All reports</a> · <a href="#/sync">Manual sync</a></p><h2>${kind === "errors" ? "Error report" : "Recent sync report"}</h2>
    <p class="muted">${kind === "errors" ? "Data sources with a problem on their last run, or that haven't synced in over a day." : "When each data source last synced, newest first, and the syncs people started by hand."}</p><div id="srep"><div class="card"><p class="muted">Loading…</p></div></div></div>`;
  const [s, q] = await Promise.all([ sb.from("hub_sync_sources").select("*"), sb.from("hub_sync_requests").select("*").order("id", { ascending:false }).limit(40) ]);
  if(s.error) return $("#srep").innerHTML = `<div class="card"><p class="muted">Couldn't load: ${esc(s.error.message)}</p></div>`;
  const src = s.data || [], label = k => k ? ((src.find(x => x.key === k) || {}).label || k) : "Every data source";
  const stale = x => !x.last_ok_at || (Date.now() - new Date(x.last_ok_at)) / 36e5 > 26;
  const row = x => { const bad = x.last_status === "error", old = stale(x);
    return `<div class="fb"><div class="hd"><b>${esc(x.label)}</b><span class="pill ${bad ? "red" : old ? "amber" : "green"}">${bad ? "error" : old ? "no sync in " + ago(x.last_ok_at).replace(" ago","") : "ok · " + ago(x.last_ok_at)}</span>
      <a class="btn small" style="margin-left:auto" href="#/sync/${esc(x.key)}">Open</a></div>
      ${x.feeds ? `<p style="margin:6px 0 0"><span class="muted">Feeds:</span> ${esc(x.feeds)}</p>` : ""}
      <p class="muted" style="margin:4px 0 0">Last run ${ago(x.last_run_at)} · ${esc(x.schedule || "")}</p>${x.last_detail ? `<p class="muted" style="margin:4px 0 0;font-size:12.5px">${esc(x.last_detail)}</p>` : ""}</div>`; };
  if(kind === "errors"){
    const list = src.filter(x => x.last_status === "error" || (x.can_run && stale(x))).sort((a, b) => a.label.localeCompare(b.label));
    const failed = (q.data || []).filter(r => /problem|fail|declined/i.test(r.result || ""));
    $("#srep").innerHTML = `<div class="card">${list.length ? list.map(row).join("") : `<p class="muted">No problems — every data source synced in the last day. ✅</p>`}</div>` +
      (failed.length ? `<div class="card"><b style="font-size:17px">Hand-started syncs with problems</b>${failed.map(r => `<div class="fb"><div class="hd"><b>${esc(label(r.source_key))}</b><span class="muted">${esc(r.requested_by || "")} · ${ago(r.requested_at)}</span></div><p class="muted">${esc(r.result || "")}</p></div>`).join("")}</div>` : "");
  } else {
    const list = src.slice().sort((a, b) => new Date(b.last_run_at || 0) - new Date(a.last_run_at || 0));
    $("#srep").innerHTML = `<div class="card">${list.map(row).join("")}</div>` + ((q.data || []).length ? `<div class="card"><b style="font-size:17px">Started by hand</b>${(q.data || []).slice(0, 20).map(r => `<div class="fb"><div class="hd"><b>${esc(label(r.source_key))}</b><span class="pill ${r.status === "declined" ? "red" : r.status === "needs_approval" ? "amber" : r.done_at ? "green" : "blue"}">${r.status === "declined" ? "declined" : r.status === "needs_approval" ? "waiting" : r.done_at ? "done" : "running"}</span><span class="muted">${esc(r.requested_by || "")} · ${ago(r.requested_at)}</span></div>${r.result ? `<p class="muted">${esc(r.result)}</p>` : ""}</div>`).join("")}</div>` : "");
  }
}

      <span style="margin-left:auto;display:flex;gap:6px"><button class="btn small primary" data-ok="${r.id}">Approve</button><button class="btn small" data-no="${r.id}">Decline</button></span></div></div>`).join("")}</div>`;
  const rows = s.data.slice().filter(x => !only || x.key === only).sort((a, b) => a.label.localeCompare(b.label));
  if(!rows.length) return $("#srcs").innerHTML = `<p class="muted">No report for that source.</p>`;
  const btn = x => { if(!x.can_run) return `<span class="muted" style="margin-left:auto">runs on its own${x.cost === "paid" ? " · costs money" : ""}</span>`;
    const r = lastFor(x.key); if(r && r.status === "needs_approval") return `<span class="pill amber" style="margin-left:auto">waiting for approval</span>`;
    return A || x.cost === "free" ? `<button class="btn small" style="margin-left:auto" data-sync="${esc(x.key)}">Sync now</button>`
      : `<span style="margin-left:auto;display:flex;gap:6px;align-items:center"><span class="pill amber">${COST[x.cost]} · needs approval</span><button class="btn small" data-sync="${esc(x.key)}">Ask to sync</button></span>`; };
  $("#srcs").innerHTML = rows.map(x => { const age = x.last_ok_at ? (Date.now() - new Date(x.last_ok_at)) / 36e5 : null;
      const tone = x.last_status === "error" ? "red" : age == null ? "" : age < 6 ? "green" : age < 26 ? "amber" : "red", r = lastFor(x.key);
      const state = r ? (r.status === "declined" ? "Last ask declined" + (r.approved_by ? " by " + r.approved_by : "") : r.done_at ? "Last run from here " + ago(r.done_at) + (r.result ? " - " + r.result : "") : r.status === "needs_approval" ? "Asked by " + (r.requested_by || "") + " " + ago(r.requested_at) : "Asked " + ago(r.requested_at) + " - waiting for the ThinkStation") : "";
      return `<div class="fb"><div class="hd"><b>${esc(x.label)}</b><span class="pill ${tone}">${x.last_status === "error" ? "error" : ago(x.last_ok_at)}</span>${btn(x)}</div>

function pennySay(role, text, id, links){

  el.innerHTML = role === "user" ? `<div class="bub">${esc(text)}</div>` : `<span class="pav"><img src="penny-face.png" alt="Penny"></span><div><div class="bub">${esc(text)}</div>${(links || []).length ? `<div class="plinks">${links.filter(l => /^#\//.test(l.href)).map(l => `<a class="btn small" href="${esc(l.href)}">${esc(l.label)} →</a>`).join("")}</div>` : ""}${id ? `<div class="fbk"><button data-h="1" title="Helpful">👍</button><button data-h="0" title="Not helpful">👎</button><button data-ask="1" title="Send this question to an admin">🙋 Ask an admin</button></div>` : ""}</div>`;
  $("#pennyLog").appendChild(el); $("#pennyLog").scrollTop = 1e9;
  el.querySelectorAll("[data-h]").forEach(b => b.onclick = async () => { el.querySelectorAll("[data-h]").forEach(x => x.classList.toggle("on", x === b));
    await sb.rpc("penny_feedback", { p_id:id, p_helpful:b.dataset.h === "1", p_note:null }); });
  const ab = el.querySelector("[data-ask]"); if(ab) ab.onclick = () => pennyAdmin(el, ab);
  return el;
}
/* Penny couldn't help → send the question (or an access request) to an admin; reuses hub-feedback (saved + Slack DM) */
function pennyAdmin(el, ab){
  if(el.querySelector(".pask")) return;
  const lastQ = [...PENNY.hist].reverse().find(x => x.role === "user");
  const box = document.createElement("div"); box.className = "pask";
  box.innerHTML = `<textarea rows="3">${esc(lastQ ? lastQ.text : "")}</textarea><div style="display:flex;gap:6px;align-items:center;margin-top:4px"><button class="btn primary small">Send to admin</button><button class="btn small">Cancel</button><span class="muted"></span></div>`;
  el.lastElementChild.appendChild(box); $("#pennyLog").scrollTop = 1e9;
  const [send, cancel] = box.querySelectorAll("button"), msg = box.querySelector(".muted"), ta = box.querySelector("textarea"); ta.focus();
  cancel.onclick = () => box.remove();
  send.onclick = async () => { const body = ta.value.trim(); if(body.length < 3) return msg.textContent = "Write a little more.";
    send.disabled = true; msg.textContent = "Sending…"; const w = typeof whereAmI === "function" ? whereAmI() : { label:"", page:"" };
    const r = await sb.functions.invoke("hub-feedback", { body:{ kind:"ask", body:"Asked Penny: " + body, desk:"", deskLabel:w.label, page:(w.label + " | " + w.page).slice(0, 500) } });
    if(r.error || !r.data || !r.data.ok){ send.disabled = false; msg.textContent = "Couldn't send - try again."; return; }
    box.innerHTML = `<p class="muted" style="margin:4px 0">Sent ✓ An admin will get back to you.</p>`; ab.disabled = true; };
}
/* 2026-10-28 (Brandon): Penny knows what you're looking at - the home on Property Details, or the stay on a reservation check list */
function pennyCtx(){
  const k = current(), arg = hashArg(), c = { desk:k };
  try { const f = document.getElementById("deskframe"), S = f && f.contentWindow.deskCtx && f.contentWindow.deskCtx();
    if(S && S.home && ["homes", "lease", "fire", "firesys"].includes(S.tab)) c.home = S.home;
    if(S && S.sel && ["jobs", "today", "check", "projects"].includes(S.tab)) c.job = S.sel; } catch(e){}
  if(!c.home && k === "homes" && arg) c.home = arg;
  if(k === "reservations" && /^\d+$/.test(arg)) Object.assign(c, typeof window.resCtx === "function" ? window.resCtx(arg) : { res:arg });
  return c;
}
/* 2026-10-28 (Brandon): photos for Penny - shrunk in the browser to <= 1280px JPEG, sent once, never stored */
function pennyShrink(f){ return new Promise((ok, bad) => { const im = new Image(), u = URL.createObjectURL(f);
  im.onload = () => { const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok({ type:"image/jpeg", data:c.toDataURL("image/jpeg", 0.82).split(",")[1] }); };
  im.onerror = () => { URL.revokeObjectURL(u); bad(new Error("bad image")); }; im.src = u; }); }

/* admins: what people ask Penny, to see where tools and training help most (Brandon 2026-10-28). Counts from penny_chats. */
const PENNY_TOOL = { lookup_home:"Homes", who_is_in:"Who's in house", find_vendor:"Vendors", past_chats:"Past chats", knowledge:"Guest / owner replies & policies",
  staff:"Coworkers", maintenance_jobs:"Maintenance jobs", projects:"Projects", licensing:"Licensing", owner_feedback:"Owner feedback" };
const PENNY_TEAM = { owner_relations:"Owner relations", maint_manager:"Maintenance manager", office_manager:"Office manager", hk_manager:"Housekeeping manager",
  front_desk:"Front desk", maint_crew:"Maintenance crew", licensing:"Licensing", leasing:"Leasing", admin:"Admin" };
function pennyInsights(all, needs){
  const since = Date.now() - 30 * 864e5, rows = all.filter(x => new Date(x.created_at) >= since);
  const tally = (f) => { const m = {}; rows.forEach(x => [].concat(f(x) || []).forEach(k => { if(k) m[k] = (m[k] || 0) + 1; })); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const bars = (list, n = 8) => { const top = list.slice(0, n), max = Math.max(1, ...top.map(x => x[1]));
    return top.length ? top.map(([k, v]) => `<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="width:44%;font-size:13.5px">${esc(k)}</span><span style="flex:1;background:var(--line);border-radius:4px;height:10px"><span style="display:block;height:10px;border-radius:4px;background:var(--moose);width:${Math.round(v / max * 100)}%"></span></span><b style="width:28px;text-align:right;font-size:13px">${v}</b></div>`).join("") : `<p class="muted">Nothing yet.</p>`; };
  const STOP = new Set("the and for you are can what who how does did any our with that this have from about there they when where which into just your need want know tell give show get its was were has had will would should could been some more like over also only them then than very much".split(" "));
  const tools = x => /looked up: (.*)/.exec(x.note || "")?.[1].split(", ").map(t => PENNY_TOOL[t] || t) || ["Notes only (no lookup)"];
  const days = tally(x => new Date(x.created_at).toLocaleDateString("en-CA", { timeZone:"America/Denver" })).sort((a, b) => a[0] < b[0] ? -1 : 1).slice(-14)
    .map(([d, n]) => [new Date(d + "T12:00").toLocaleDateString([], { month:"short", day:"numeric" }), n]);
  const missed = rows.filter(needs), people = new Set(rows.map(x => x.user_id)).size, cost = rows.reduce((a, x) => a + (+x.cost_usd || 0), 0);
  $("#pins").innerHTML = `<b style="font-size:17px">What people ask (last 30 days)</b> <span class="muted">${rows.length} questions · ${people} people · ${missed.length} missed or 👎 · $${cost.toFixed(2)}</span>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:10px">
      <div><div class="muted" style="font-size:12.5px;margin-bottom:4px">By team</div>${bars(tally(x => (x.teams || []).length ? x.teams.map(t => PENNY_TEAM[t] || t) : ["No team"]))}</div>
      <div><div class="muted" style="font-size:12.5px;margin-bottom:4px">What she had to look up</div>${bars(tally(tools))}</div>
      <div><div class="muted" style="font-size:12.5px;margin-bottom:4px">Who asks most</div>${bars(tally(x => x.user_name))}</div>
      <div><div class="muted" style="font-size:12.5px;margin-bottom:4px">Words that come up most</div>${bars(tally(x => [...new Set(String(x.question || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w.length > 2 && !STOP.has(w) && !/^d+$/.test(w)))]), 10)}</div>
      <div><div class="muted" style="font-size:12.5px;margin-bottom:4px">Questions per day</div>${bars(days, 14)}</div>
      <div><div class="muted" style="font-size:12.5px;margin-bottom:4px">Missed by team (train or build here first)</div>${bars(tally(x => needs(x) ? ((x.teams || []).length ? x.teams.map(t => PENNY_TEAM[t] || t) : ["No team"]) : null))}</div>
    </div><p class="muted" style="font-size:12px;margin:8px 0 0">Source: Ask Penny log (penny_chats). "Missed" = 👎 or an answer saying she didn't know.</p>`;
}

      if(r.error) return $("#pc_msg").textContent = r.error.message; $("#pcform").innerHTML = ""; checks = await load(); }; };
  $("#pcrun").onclick = async () => { const b = $("#pcrun"); b.disabled = true; const run = "run-" + Date.now();
    for(const [i, x] of checks.entries()){ b.textContent = `Running ${i + 1} of ${checks.length}…`;
      const r = await sb.functions.invoke("penny", { body:{ question:x.question, page:"Reports › Penny accuracy checks", check:true } });
      const ans = String(r.data?.answer || r.error?.message || ""), low = ans.toLowerCase();
      const missing = x.must.filter(m => !m.split("|").some(alt => low.includes(alt.trim()))).concat(x.must_not.filter(m => low.includes(m)).map(m => "said: " + m));
      await sb.from("penny_check_runs").insert({ run_id:run, check_id:x.id, by_name:ME.name, answer:ans.slice(0, 4000), pass:!missing.length && !!r.data?.ok, missing }); }
    b.disabled = false; b.textContent = "▶ Run all checks"; checks = await load(); };
}
/* admins: what staff asked Penny + edit what she knows (#/penny) */
async function pennyView(v){
  if(!ME.admin){ location.hash = "#/home"; return; }
  if(hashArg().startsWith("checks")) return pennyChecksView(v);
  if(hashArg() === "cleanup") return pennyCleanupView(v);
  if(hashArg() === "teach") return pennyTeachView(v);
  const missedOnly = hashArg() === "missed";
  v.innerHTML = `<div class="page wide"><p style="margin:0 0 6px"><a href="#/reports">← All reports</a></p><h2>Ask Penny</h2><p class="muted">What staff asked, Penny's answers, 👍/👎 and cost. Questions she missed or got 👎 are on top — tap <b>🎓 Teach Penny</b>, write the right answer, save, and she uses it from then on for everyone who can see that desk.</p>
    <div class="card" id="pins"><p class="muted">Loading…</p></div><div class="card" id="plog"><p class="muted">Loading…</p></div><div class="card" id="pkb"><p class="muted">Loading…</p></div></div>`;
  const [c, k] = await Promise.all([ sb.from("penny_chats").select("*").order("id", { ascending:false }).limit(1000), sb.from("penny_kb").select("*").order("topic") ]);
  const needs = x => x.helpful === false || /can.?t help|don.?t have|not sure|not in my notes|don.?t know|couldn.?t find/i.test((x.answer || "").slice(0, 220));
  const all = (c.data || []).filter(x => !/^accuracy check/.test(x.note || "")); pennyInsights(all, needs);   // check runs are not staff questions
  const rows = (missedOnly ? all.filter(needs) : all.slice(0, 200)).filter(x => !/^accuracy check/.test(x.note || "")).sort((a, b) => needs(b) - needs(a)), tot = rows.reduce((a, x) => a + (+x.cost_usd || 0), 0);
  if(missedOnly){ $("#pins").remove(); v.querySelector("h2").textContent = "Penny — missed & 👎"; }
  $("#plog").innerHTML = `<b style="font-size:17px">Questions</b> <span class="muted">${rows.filter(needs).length} to teach first · ${rows.length} shown · $${tot.toFixed(2)} · 👍 ${rows.filter(x => x.helpful === true).length} · 👎 ${rows.filter(x => x.helpful === false).length}</span>` +
    (rows.length ? rows.map((x, i) => `<div class="fb"><div class="hd"><b>${esc(x.user_name || "")}</b>${needs(x) ? `<span class="pill amber">teach her</span>` : ""}<span class="muted">${new Date(x.created_at).toLocaleString()} · ${esc(x.page || "")}</span>${x.helpful === true ? `<span class="pill green">👍</span>` : x.helpful === false ? `<span class="pill red">👎</span>` : ""}<span class="muted" style="margin-left:auto">$${(+x.cost_usd || 0).toFixed(4)}</span></div>
      <p><b>Q:</b> ${esc(x.question)}</p><p class="muted"><b>Penny:</b> ${esc(x.answer || "")}</p><button class="btn small" data-teach="${i}">🎓 Teach Penny</button></div>`).join("") : `<p class="muted">No questions yet.</p>`);
  const kb = k.data || [];
  $("#pkb").innerHTML = `<div style="display:flex;align-items:center;gap:8px"><b style="font-size:17px">What Penny knows</b><span class="muted">${kb.length} notes</span><button class="btn small" id="pkbnew" style="margin-left:auto">+ Note</button></div><div id="pkbform"></div>` +
    kb.map((x, i) => `<details class="acc2"><summary><b>${esc(x.topic)}</b>${x.desk_key ? `<span class="pill">${esc(x.desk_key)} only</span>` : ""}${x.active ? "" : `<span class="pill amber">off</span>`}</summary>
      <p style="white-space:pre-wrap">${esc(x.body)}</p><p class="muted" style="font-size:12px">${esc(x.source || "")}${x.updated_by ? " · edited by " + esc(x.updated_by) : ""}</p><button class="btn small" data-pkb="${i}">Edit</button></details>`).join("");
  const form = x => { $("#pkbform").innerHTML = `<div class="card" style="margin-top:10px"><label class="field"><span>Topic</span><input id="pk_t" value="${esc(x.topic || "")}"></label>
      <label class="field"><span>What Penny should know (plain steps, no codes or passwords)</span><textarea id="pk_b">${esc(x.body || "")}</textarea></label>
      <label class="field"><span>Only for people who can open this desk (blank = everyone)</span><select id="pk_d"><option value="">Everyone</option>${DESKS.map(d => `<option value="${esc(d.key)}" ${x.desk_key === d.key ? "selected" : ""}>${esc(d.label)}</option>`).join("")}${x.desk_key && !DESKS.some(d => d.key === x.desk_key) ? `<option selected value="${esc(x.desk_key)}">${esc(x.desk_key)}</option>` : ""}</select></label>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pk_a" style="width:auto;min-height:0" ${x.active === false ? "" : "checked"}> On</label>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary small" id="pk_s">Save note</button><button class="btn small" id="pk_c">Cancel</button><span class="muted" id="pk_m"></span></div></div>`;
    $("#pk_c").onclick = () => $("#pkbform").innerHTML = "";
    $("#pk_s").onclick = async () => { const r = await sb.rpc("penny_kb_save", { p_topic:$("#pk_t").value, p_body:$("#pk_b").value, p_desk:$("#pk_d").value, p_active:$("#pk_a").checked });
      if(r.error) $("#pk_m").textContent = r.error.message; else pennyView(v); }; };
  $("#pkbnew").onclick = () => form({});
  $("#plog").querySelectorAll("[data-teach]").forEach(b => b.onclick = () => { const x = rows[+b.dataset.teach];
    form({ topic:String(x.question || "").slice(0, 80), body:x.answer || "", active:true }); $("#pkbform").scrollIntoView({ behavior:"smooth" }); });
  $("#pkb").querySelectorAll("[data-pkb]").forEach(b => b.onclick = () => { form(kb[+b.dataset.pkb]); $("#pkbform").scrollIntoView({ behavior:"smooth" }); });
}
/* Reports > Ask Patrick & Penny > Ask Patrick (#/patrick, #/patrick/week; Brandon 2026-10-28): the website's Ask Patrick log
   (WP admin > Ask Patrick > Log), copied into patrick_chats every 5 min by patrick-desk (hub_patrick.sql). Read by RLS hub_can('patrick_log'). */
async function patrickView(v){
  if(!DESKS.some(x => x.key === "patrick_log")){ location.hash = "#/home"; return; }
  $("#ttl").textContent = "Reports & Analytics";
  const week = hashArg() === "week", P = window.PAT = window.PAT || { days: week ? 7 : 30, q:"", topic:"", outcome:"", todo:false };
  if(week) P.days = 7;
  v.innerHTML = `<div class="page wide"><p style="margin:0 0 6px"><a href="#/reports">← All reports</a></p><h2>Ask Patrick${week ? " — weekly" : ""}</h2>
    <p class="muted">What guests asked Patrick on vacationrentalsparkcity.com, his answers, sources, outcome and cost. Source: the website's Ask Patrick log, copied here every 5 minutes. <span id="pwhen"></span></p>
    <div class="card" id="pins"><p class="muted">Loading…</p></div><div class="card" id="plog"></div><div id="plists"></div></div>`;
  const [c, rv, l] = await Promise.all([ sb.from("patrick_chats").select("*").order("id", { ascending:false }).limit(5000),
    sb.from("patrick_reviews").select("*").order("id", { ascending:false }).limit(2000), sb.rpc("patrick_lists") ]);
  if(c.error) return $("#pins").innerHTML = `<p class="muted">Couldn't load: ${esc(c.error.message)}</p>`;
  const L = (l.data || [])[0] || {}, all = c.data || [], revs = rv.data || [];
  $("#pwhen").textContent = L.last_pull ? "Last copied " + new Date(L.last_pull).toLocaleString() + "." : "";
  if(!all.length){ $("#pins").innerHTML = `<p class="muted">No chats copied from the website yet${L.paired ? "" : " — the website isn't connected to the hub yet"}.</p>`; $("#plog").remove(); return; }
  const since = P.days ? Date.now() - P.days * 864e5 : 0, inP = all.filter(x => !since || new Date(x.created_at) >= since);
  const usd = n => "$" + (+n || 0).toFixed(2), top = (list, f, n = 8) => { const m = {}; list.forEach(x => { const k = (f(x) || "").trim(); if(k) m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, n); };
  const bar = (rows, tot) => rows.length ? rows.map(([k, n]) => `<div style="display:flex;gap:8px;align-items:center;font-size:13.5px;margin:3px 0"><span style="flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(k)}">${esc(k)}</span>
      <span style="flex:1;background:var(--line);border-radius:4px;height:8px"><span style="display:block;height:8px;border-radius:4px;background:var(--moose);width:${Math.max(3, Math.round(100 * n / tot))}%"></span></span><b style="min-width:34px;text-align:right">${n}</b></div>`).join("") : `<p class="muted">—</p>`;
  const pagePath = x => { try { return new URL(x.page).pathname; } catch(e){ return x.page || ""; } };
  const sess = new Set(inP.map(x => x.session).filter(Boolean)).size, cost = inP.reduce((a, x) => a + (+x.cost || 0), 0);
  $("#pins").innerHTML = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-size:17px">At a glance</b>
      <select id="pdays" style="width:auto;margin-left:auto">${[[7,"Last 7 days"],[30,"Last 30 days"],[90,"Last 90 days"],[0,"All time"]].map(([d, t]) => `<option value="${d}" ${P.days === d ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="rpgrid" style="margin-top:10px"><section class="rpg"><h3>Totals</h3><p style="margin:4px 0"><b>${inP.length}</b> questions · <b>${sess}</b> chats · <b>${usd(cost)}</b> spend</p>
      <p class="muted" style="margin:4px 0">${inP.length ? usd(cost / inP.length) : "$0.00"} per question · ${inP.filter(x => x.reviewed).length} reviewed</p></section>
      <section class="rpg"><h3>Outcome</h3>${bar(top(inP, x => x.outcome || "(none)"), inP.length)}</section>
      <section class="rpg"><h3>Topics</h3>${bar(top(inP, x => x.topic), inP.length)}</section>
      <section class="rpg"><h3>Pages asked from</h3>${bar(top(inP, pagePath), inP.length)}</section>
      <section class="rpg"><h3>Tools Patrick used</h3>${bar(top(inP.flatMap(x => String(x.tools || "").split(/[,;|]\s*/).map(t => ({ t }))), x => x.t), inP.length)}</section>
      <section class="rpg"><h3>Device</h3>${bar(top(inP, x => x.device), inP.length)}</section></div>`;
  $("#pdays").onchange = e => { P.days = +e.target.value; if(week){ location.hash = "#/patrick"; } else patrickView(v); };
  const topics = [...new Set(all.map(x => x.topic).filter(Boolean))].sort(), outs = [...new Set(all.map(x => x.outcome).filter(Boolean))].sort();
  const byChat = {}; revs.forEach(r => { if(r.chat_id) (byChat[r.chat_id] = byChat[r.chat_id] || []).push(r); });
  const draw = () => {
    const q = P.q.toLowerCase(), rows = inP.filter(x => (!q || [x.question, x.answer, x.page, x.session].some(s => String(s || "").toLowerCase().includes(q)))
      && (!P.topic || x.topic === P.topic) && (!P.outcome || x.outcome === P.outcome) && (!P.todo || !x.reviewed)), shown = rows.slice(0, 200);
    $("#plist").innerHTML = `<p class="muted" style="margin:8px 0">${rows.length} match${rows.length > 200 ? " · newest 200 shown" : ""}</p>` + (shown.length ? shown.map(x => {
      const rr = byChat[x.id] || [], pill = /wrong|bad|fail/i.test(x.reviewed || x.outcome || "") ? "red" : /ok|right|good|book|lead/i.test(x.reviewed || x.outcome || "") ? "green" : "";
      return `<div class="fb"><div class="hd"><span class="muted">${x.created_at ? new Date(x.created_at).toLocaleString() : ""}</span>${x.topic ? `<span class="pill">${esc(x.topic)}</span>` : ""}${x.outcome ? `<span class="pill ${pill}">${esc(x.outcome)}</span>` : ""}${x.reviewed ? `<span class="pill green">✓ ${esc(x.reviewed)}</span>` : ""}
        <span class="muted" style="margin-left:auto">${esc(x.device || "")} · ${x.cost != null ? "$" + (+x.cost).toFixed(4) : ""}</span></div>
        <p><b>Q:</b> ${esc(x.question || "")}</p><details><summary class="muted" style="cursor:pointer"><b>Patrick:</b> ${esc(String(x.answer || "").slice(0, 160))}${String(x.answer || "").length > 160 ? "…" : ""}</summary>
        <p style="white-space:pre-wrap">${esc(x.answer || "")}</p>${x.sources || x.source ? `<p class="muted" style="font-size:12.5px"><b>Sources:</b> ${esc([x.source, x.sources].filter(Boolean).join(" · "))}</p>` : ""}
        ${x.tools ? `<p class="muted" style="font-size:12.5px"><b>Tools:</b> ${esc(x.tools)}</p>` : ""}${x.buttons ? `<p class="muted" style="font-size:12.5px"><b>Buttons shown:</b> ${esc(x.buttons)}</p>` : ""}
        <p class="muted" style="font-size:12.5px">${x.page ? `Page: ${esc(pagePath(x))}` : ""}${x.session ? ` · chat ${esc(String(x.session).slice(0, 8))}` : ""}</p></details>
        ${rr.map(r => `<p class="muted" style="font-size:12.5px;margin:4px 0">${esc(r.by_name || "")} · ${esc({ ok:"marked right", wrong:"marked wrong", crew:"gave a better answer", note:"note" }[r.kind] || r.kind)}${r.answer && r.kind === "crew" ? ": " + esc(r.answer) : ""}${r.note ? " — " + esc(r.note) : ""}${r.apply_error ? ` <span class="pill red">not saved on the website</span>` : ""}</p>`).join("")}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn small" data-pa="ok" data-id="${x.id}">✓ Right</button><button class="btn small" data-pa="wrong" data-id="${x.id}">✗ Wrong</button>
          <button class="btn small" data-pa="crew" data-id="${x.id}">✍ Better answer</button><button class="btn small" data-pa="note" data-id="${x.id}">📝 Note</button><span class="muted" data-pm="${x.id}"></span></div></div>`; }).join("")
      : `<p class="muted">Nothing matches.</p>`);
    $("#plist").querySelectorAll("[data-pa]").forEach(b => b.onclick = async () => { const x = all.find(y => y.id === +b.dataset.id), kind = b.dataset.pa, m = $(`[data-pm="${x.id}"]`);
      let answer = "", note = "";
      if(kind === "crew"){ answer = prompt("The answer Patrick should give for:\n\n" + (x.question || "") + "\n\n(no codes or passwords)", ""); if(!answer) return; }
      if(kind === "note" || kind === "wrong"){ note = prompt(kind === "wrong" ? "What's wrong with it? (optional)" : "Note", "") || ""; if(kind === "note" && !note) return; }
      m.textContent = "Saving…";
      const r = await sb.functions.invoke("patrick-desk", { body:{ action:"apply", kind, chat_id:x.id, question:x.question, answer, note } });
      const err = r.error ? ((await r.error.context?.json?.().catch(() => null)) || {}).error || r.error.message : r.data && r.data.error;
      if(err){ m.textContent = err; return; } patrickView(v); }); };
  $("#plog").innerHTML = `<b style="font-size:17px">Questions</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input id="pq" placeholder="Search questions, answers, pages" value="${esc(P.q)}" style="flex:1 1 220px">
      <select id="ptopic" style="width:auto"><option value="">All topics</option>${topics.map(t => `<option ${P.topic === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <select id="pout" style="width:auto"><option value="">All outcomes</option>${outs.map(t => `<option ${P.outcome === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ptodo" style="width:auto;min-height:0" ${P.todo ? "checked" : ""}> Not reviewed</label></div><div id="plist"></div>`;
  $("#pq").oninput = e => { P.q = e.target.value; draw(); }; $("#ptopic").onchange = e => { P.topic = e.target.value; draw(); };
  $("#pout").onchange = e => { P.outcome = e.target.value; draw(); }; $("#ptodo").onchange = e => { P.todo = e.target.checked; draw(); };
  draw();
  if(ME.admin){   // the crew-answer and avoid lists change what Patrick tells every guest: hub admins only (patrick-desk enforces it too)
    const box = (k, t, h, val) => `<details class="acc2"><summary><b>${t}</b><span class="muted">${h}</span></summary><textarea id="pl_${k}" style="min-height:180px">${esc(val || "")}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary small" data-pl="${k}">Save to the website</button><span class="muted" id="plm_${k}"></span></div></details>`;
    $("#plists").innerHTML = `<div class="card"><b style="font-size:17px">What Patrick is told</b>${box("crew", "Crew answers", "answers staff gave him", L.crew_answers)}${box("avoid", "Avoid list", "things he must not say", L.avoid)}</div>`;
    $("#plists").querySelectorAll("[data-pl]").forEach(b => b.onclick = async () => { const k = b.dataset.pl, m = $("#plm_" + k); m.textContent = "Saving…";
      const r = await sb.functions.invoke("patrick-desk", { body:{ action:"apply", kind: k + "_set", answer: $("#pl_" + k).value } });
      const err = r.error ? ((await r.error.context?.json?.().catch(() => null)) || {}).error || r.error.message : r.data && r.data.error;
      m.textContent = err || "Saved."; });
  }
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => { if(e.key === "Escape"){ const m = document.querySelector(".modal.on"); if(m) m.classList.remove("on"); } });
sb.auth.onAuthStateChange(ev => { if(ev === "SIGNED_OUT") { ME = null; TS.ok = false; TS.weak = false; TS.mc = undefined; loginView(); } });
boot();
</script>
